<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>負柱鏡轉正柱鏡</title>
<style>
  body { font-family: sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  label { display: block; margin: 12px 0 4px; }
  input { width: 100%; padding: 6px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 8px 20px; }
  #result { margin-top: 20px; padding: 12px; background: #eee; }
</style>
</head>
<body>
  <h1>負柱鏡轉正柱鏡</h1>

  <label for="sph">球面度數 (D)</label>
  <input type="number" id="sph" step="0.25">

  <label for="cyl">柱面度數 (D)</label>
  <input type="number" id="cyl" step="0.25">

  <label for="axis">軸度 (度)</label>
  <input type="number" id="axis">

  <button onclick="convert()">轉換</button>

  <div id="result"></div>

<script>
function convert() {
  var sph = parseFloat(document.getElementById('sph').value);
  var cyl = parseFloat(document.getElementById('cyl').value);
  var axis = parseFloat(document.getElementById('axis').value);

  var newSph = sph + cyl;
  var newCyl = -cyl;
  var newAxis = axis + 90;
  if (newAxis >= 180) {
    newAxis = newAxis - 180;
  }

  document.getElementById('result').innerHTML =
    "球面度數：" + newSph.toFixed(2) + " D<br>" +
    "柱面度數：" + newCyl.toFixed(2) + " D<br>" +
    "軸度：" + newAxis + " 度";
}
</script>
</body>
</html>
