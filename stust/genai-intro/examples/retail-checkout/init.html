<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f4e9">
<title>衣日選物｜促銷購物車結帳試算器</title>
<style>
:root{font-family:Arial,sans-serif;color:#222;background:#fff}*{box-sizing:border-box}body{margin:0;line-height:1.5}.wrap{width:min(1100px,94%);margin:auto}.top{padding:20px 0;border-bottom:1px solid #ccc}.brand{font-weight:bold}.top h1{margin:.3rem 0}.top p{margin:.3rem 0}.promo{padding:12px;background:#f2f2f2;margin:16px 0}.promo strong{margin-right:8px}.layout{display:grid;grid-template-columns:1.3fr .9fr;gap:16px;padding-bottom:30px}.panel{border:1px solid #ccc;padding:16px}.panel h2{margin:0 0 12px}.section-head{display:flex;justify-content:space-between}.count,.meta,.cart-sub,.footer{color:#666}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border:1px solid #ddd;padding:12px}.product h3{margin:0}.tag{background:#eee;padding:2px 6px}.price-line{display:flex;gap:8px;margin:8px 0}.price,.discount{font-weight:bold}.old{text-decoration:line-through;color:#777}.add-row,.cart-controls{display:flex;gap:8px;align-items:center}.qty-input,.cart-controls input{width:60px;padding:6px}.button{padding:7px 10px;cursor:pointer}.cart-panel{align-self:start}.cart-empty{border:1px dashed #aaa;padding:20px;text-align:center}.cart-item{padding:10px 0;border-bottom:1px solid #ddd}.cart-title,.sumrow,.pay{display:flex;justify-content:space-between;gap:10px}.cart-sub,.sumrow{margin:5px 0}.remove{margin-left:auto}.summary{border-top:1px solid #aaa;margin-top:12px;padding-top:10px}.tier-note{padding:8px;background:#f2f2f2}.pay{padding:12px;background:#eee;font-weight:bold}.pay strong{font-size:1.5rem}.clear{width:100%;margin-top:8px}.footer{text-align:center;padding:15px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:760px){.layout{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">衣日選物・門市結帳小幫手</div><h1>促銷購物車結帳試算器</h1><p>先看每件商品的類別優惠，再試算整車結帳折扣。</p></div></header>
<main class="wrap">
<div class="promo"><span>結帳加碼優惠</span><span><strong>滿 $1,000 95 折</strong>　·　<strong>滿 $2,000 88 折</strong>　·　<strong>滿 $3,000 8 折</strong>　·　<strong>滿 $5,000 75 折</strong></span></div>
<div class="layout"><section class="panel" aria-labelledby="product-heading"><div class="section-head"><h2 id="product-heading">挑選商品</h2><span class="count" id="product-count"></span></div><div class="products" id="products"></div></section>
<aside class="panel cart-panel" aria-labelledby="cart-heading"><div class="section-head"><h2 id="cart-heading">購物車</h2><span class="count" id="cart-count">0 件商品</span></div><div id="cart-content"></div><div class="summary" id="summary"></div></aside></div>
<footer class="footer">虛構商品試算示範｜不連接真實商店或顧客資料</footer>
</main>
<script>
const products=[{"id":"S01","name":"棉麻短袖襯衫","price":1280,"category":"當季新品","type":"上衣"},{"id":"S02","name":"垂墜寬褲","price":1580,"category":"當季新品","type":"褲子"},{"id":"S03","name":"輕薄針織背心","price":880,"category":"當季新品","type":"上衣"},{"id":"S04","name":"立領防曬外套","price":1980,"category":"當季新品","type":"外套"},{"id":"S05","name":"直筒丹寧長褲","price":1680,"category":"當季新品","type":"褲子"},{"id":"S06","name":"柔棉落肩上衣","price":980,"category":"當季新品","type":"上衣"},{"id":"S07","name":"微光澤百褶裙","price":1480,"category":"當季新品","type":"裙裝"},{"id":"S08","name":"口袋短版外套","price":2280,"category":"當季新品","type":"外套"},{"id":"O01","name":"格紋長袖襯衫","price":1180,"category":"過季品","type":"上衣"},{"id":"O02","name":"刷色牛仔短褲","price":1080,"category":"過季品","type":"褲子"},{"id":"O03","name":"薄款連帽外套","price":1880,"category":"過季品","type":"外套"},{"id":"O04","name":"荷葉袖洋裝","price":1680,"category":"過季品","type":"洋裝"},{"id":"O05","name":"綁帶九分褲","price":1380,"category":"過季品","type":"褲子"},{"id":"O06","name":"V領針織上衣","price":980,"category":"過季品","type":"上衣"},{"id":"O07","name":"雙面穿背心","price":1280,"category":"過季品","type":"上衣"},{"id":"P01","name":"條紋棉質T恤","price":690,"category":"促銷庫存","type":"上衣"},{"id":"P02","name":"抽繩休閒短褲","price":890,"category":"促銷庫存","type":"褲子"},{"id":"P03","name":"素色薄長袖上衣","price":790,"category":"促銷庫存","type":"上衣"},{"id":"P04","name":"輕便帆布托特包","price":590,"category":"促銷庫存","type":"配件"},{"id":"P05","name":"簡約羅紋襪組","price":290,"category":"促銷庫存","type":"配件"},{"id":"S09","name":"棉質短版針織衫","price":1180,"category":"當季新品","type":"上衣"},{"id":"S10","name":"亞麻七分袖上衣","price":1080,"category":"當季新品","type":"上衣"},{"id":"S11","name":"落肩條紋襯衫","price":1380,"category":"當季新品","type":"上衣"},{"id":"S12","name":"高腰直筒牛仔褲","price":1780,"category":"當季新品","type":"褲子"},{"id":"S13","name":"輕量防風外套","price":2180,"category":"當季新品","type":"外套"},{"id":"S14","name":"A字牛仔裙","price":1480,"category":"當季新品","type":"裙裝"},{"id":"S15","name":"俐落剪裁連身褲","price":1980,"category":"當季新品","type":"連身服"},{"id":"S16","name":"寬版西裝外套","price":2680,"category":"當季新品","type":"外套"},{"id":"S17","name":"細肩帶針織背心","price":780,"category":"當季新品","type":"上衣"},{"id":"S18","name":"緞面垂墜長裙","price":1680,"category":"當季新品","type":"裙裝"},{"id":"S19","name":"綁帶襯衫式洋裝","price":1880,"category":"當季新品","type":"洋裝"},{"id":"S20","name":"編織皮革腰帶","price":680,"category":"當季新品","type":"配件"},{"id":"O08","name":"復古水洗丹寧襯衫","price":1280,"category":"過季品","type":"上衣"},{"id":"O09","name":"細肩帶碎花洋裝","price":1580,"category":"過季品","type":"洋裝"},{"id":"O10","name":"格紋百褶中長裙","price":1380,"category":"過季品","type":"裙裝"},{"id":"O11","name":"多口袋工裝長褲","price":1480,"category":"過季品","type":"褲子"},{"id":"O12","name":"羊毛混紡大衣","price":2880,"category":"過季品","type":"外套"},{"id":"O13","name":"毛呢報童帽","price":680,"category":"過季品","type":"配件"},{"id":"O14","name":"簡約斜背小包","price":980,"category":"過季品","type":"配件"},{"id":"O15","name":"雙色針織圍巾","price":590,"category":"過季品","type":"配件"},{"id":"O16","name":"燈芯絨長袖襯衫","price":1280,"category":"過季品","type":"上衣"},{"id":"O17","name":"錐形剪裁卡其褲","price":1380,"category":"過季品","type":"褲子"},{"id":"O18","name":"鋪棉立領背心","price":1680,"category":"過季品","type":"外套"},{"id":"O19","name":"復古方領短洋裝","price":1480,"category":"過季品","type":"洋裝"},{"id":"O20","name":"經典低筒帆布鞋","price":1280,"category":"過季品","type":"鞋款"},{"id":"P06","name":"基本款圓領短袖上衣","price":490,"category":"促銷庫存","type":"上衣"},{"id":"P07","name":"彈性休閒長褲","price":790,"category":"促銷庫存","type":"褲子"},{"id":"P08","name":"輕薄防曬連帽外套","price":990,"category":"促銷庫存","type":"外套"},{"id":"P09","name":"棉質抽繩長裙","price":690,"category":"促銷庫存","type":"裙裝"},{"id":"P10","name":"素面背心洋裝","price":890,"category":"促銷庫存","type":"洋裝"},{"id":"P11","name":"小格紋短袖襯衫","price":590,"category":"促銷庫存","type":"上衣"},{"id":"P12","name":"刷色丹寧五分褲","price":690,"category":"促銷庫存","type":"褲子"},{"id":"P13","name":"輕便收納風衣","price":1290,"category":"促銷庫存","type":"外套"},{"id":"P14","name":"簡約A字短裙","price":590,"category":"促銷庫存","type":"裙裝"},{"id":"P15","name":"棉麻寬版連身褲","price":1090,"category":"促銷庫存","type":"連身服"},{"id":"P16","name":"素色針織毛帽","price":290,"category":"促銷庫存","type":"配件"},{"id":"P17","name":"日常帆布肩背包","price":490,"category":"促銷庫存","type":"配件"},{"id":"P18","name":"柔軟居家短襪三入組","price":190,"category":"促銷庫存","type":"配件"},{"id":"P19","name":"百搭薄款罩衫","price":690,"category":"促銷庫存","type":"外套"},{"id":"P20","name":"輕量慢跑鞋","price":990,"category":"促銷庫存","type":"鞋款"}]; 
const rates={'當季新品':1,'過季品':.8,'促銷庫存':.6};const money=n=>'$'+Math.round(n).toLocaleString('zh-TW');const unitPrice=p=>Math.round(p.price*rates[p.category]);let cart={};
function renderProducts(){document.getElementById('product-count').textContent=`${products.length} 項虛構商品`;document.getElementById('products').innerHTML=products.map(p=>`<article class="product"><h3>${p.name}</h3><div class="meta"><span class="tag">${p.category}</span><span>${p.id}</span></div><div class="price-line"><span class="price">${money(unitPrice(p))}</span><span class="old">原價 ${money(p.price)}</span><span class="discount">${rates[p.category]===1?'不打折':`${rates[p.category]*10} 折`}</span></div><div class="add-row"><label class="sr-only" for="qty-${p.id}">${p.name}購買數量</label><input class="qty-input" id="qty-${p.id}" type="number" min="1" step="1" value="1"><button class="button" type="button" onclick="addToCart('${p.id}')">加入購物車</button></div></article>`).join('')}
function addToCart(id){const input=document.getElementById(`qty-${id}`);const qty=Number(input.value);if(!Number.isInteger(qty)||qty<1){input.focus();input.setCustomValidity('請輸入正整數數量');input.reportValidity();input.setCustomValidity('');return}cart[id]=(cart[id]||0)+qty;renderCart()}
function updateQty(id,value){const qty=Number(value);if(!Number.isInteger(qty)||qty<1){renderCart();return}cart[id]=qty;renderCart()}
function removeItem(id){delete cart[id];renderCart()}
function clearCart(){cart={};renderCart()}
function getTier(subtotal){if(subtotal>=5000)return{rate:.75,label:'滿 $5,000｜75 折'};if(subtotal>=3000)return{rate:.8,label:'滿 $3,000｜8 折'};if(subtotal>=2000)return{rate:.88,label:'滿 $2,000｜88 折'};if(subtotal>=1000)return{rate:.95,label:'滿 $1,000｜95 折'};return{rate:1,label:'未滿 $1,000｜無結帳折扣'}}
function renderCart(){const entries=Object.entries(cart);const content=document.getElementById('cart-content');document.getElementById('cart-count').textContent=`${entries.reduce((s,[,q])=>s+q,0)} 件商品`;if(!entries.length){content.innerHTML='<div class="cart-empty">購物車目前是空的<br>從商品清單加入想試算的品項。</div>';document.getElementById('summary').innerHTML='<div class="sumrow"><span>原價合計</span><strong>$0</strong></div><div class="sumrow"><span>折後商品小計</span><strong>$0</strong></div><div class="sumrow"><span>結帳折抵</span><strong>$0</strong></div><div class="pay"><span>最後應付</span><strong>$0</strong></div>';return}
let original=0,subtotal=0;content.innerHTML=`<div class="cart-items">${entries.map(([id,qty])=>{const p=products.find(item=>item.id===id),unit=unitPrice(p),row=unit*qty;original+=p.price*qty;subtotal+=row;return `<div class="cart-item"><div class="cart-title"><span>${p.name}</span><span class="amount">${money(row)}</span></div><div class="cart-sub">${p.category}｜折後單價 ${money(unit)}（原價 ${money(p.price)}）</div><div class="cart-controls"><label for="cart-${id}">數量</label><input id="cart-${id}" type="number" min="1" step="1" value="${qty}" onchange="updateQty('${id}',this.value)"><button class="remove" type="button" onclick="removeItem('${id}')">移除</button></div></div>`}).join('')}</div>`;const tier=getTier(subtotal),discount=subtotal-Math.round(subtotal*tier.rate),pay=subtotal-discount;document.getElementById('summary').innerHTML=`<div class="sumrow"><span>原價合計</span><strong>${money(original)}</strong></div><div class="sumrow"><span>商品折扣後小計</span><strong>${money(subtotal)}</strong></div><div class="tier-note">套用級距：${tier.label}</div><div class="sumrow"><span>結帳折抵金額</span><strong>− ${money(discount)}</strong></div><div class="pay"><span>最後應付金額</span><strong>${money(pay)}</strong></div><button class="button secondary clear" type="button" onclick="clearCart()">清空購物車</button>`}
renderProducts();renderCart();
</script>
</body>
</html>
