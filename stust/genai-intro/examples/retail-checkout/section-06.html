<style>
:root{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:#243c32;background:#f8f4e9;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;line-height:1.55}.wrap{width:min(1180px,94%);margin:auto}.top{padding:25px 0 20px;border-bottom:1px solid #e7dec9}.brand{font-size:.82rem;letter-spacing:.16em;color:#b85e32;font-weight:800}.top h1{font-size:clamp(1.65rem,4vw,2.5rem);line-height:1.15;margin:.4rem 0;color:#204638}.top p{margin:.45rem 0 0;color:#647267}.promo{margin:18px 0;background:#204638;color:#fff;border-radius:16px;padding:16px 20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}.promo strong{color:#ffd29a}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.9fr);gap:20px;padding:8px 0 35px}.panel{background:#fffdf8;border:1px solid #e8dfcd;border-radius:16px;padding:20px;box-shadow:0 5px 22px #49391b0b}.panel h2{margin:0 0 14px;font-size:1.25rem;color:#204638}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{color:#788278;font-size:.9rem}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{border:1px solid #e9e2d5;border-radius:13px;padding:14px;background:#fff}.product h3{font-size:1rem;margin:0 0 7px;color:#293d33}.meta{font-size:.82rem;color:#68766c;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.tag{background:#edf1e9;color:#49624f;border-radius:99px;padding:2px 9px}.price-line{display:flex;align-items:baseline;gap:9px;margin:8px 0}.price{font-weight:800;color:#b9562d;font-size:1.15rem}.old{font-size:.82rem;color:#8a9088;text-decoration:line-through}.discount{font-size:.78rem;color:#b9562d;font-weight:700}.add-row{display:flex;gap:8px;margin-top:10px}.qty-input{width:68px;border:1px solid #d9d2c4;border-radius:8px;padding:8px;text-align:center;font:inherit}.button{border:0;border-radius:9px;background:#bf6036;color:#fff;font-weight:750;padding:9px 13px;cursor:pointer;font:inherit}.button:hover{background:#a64c28}.button.secondary{background:#e9eee8;color:#345743}.button.secondary:hover{background:#dce6da}.cart-panel{position:sticky;top:14px;align-self:start}.cart-empty{border:1px dashed #d9d2c4;border-radius:12px;text-align:center;padding:25px;color:#768077}.cart-items{display:grid;gap:9px}.cart-item{padding:12px 0;border-bottom:1px solid #eee8dd}.cart-title{display:flex;justify-content:space-between;gap:8px;font-weight:700}.cart-sub{font-size:.84rem;color:#748076;margin:4px 0}.cart-controls{display:flex;align-items:center;gap:7px}.cart-controls input{width:58px;padding:5px;border:1px solid #d9d2c4;border-radius:7px;text-align:center;font:inherit}.remove{border:0;background:transparent;color:#a64c28;text-decoration:underline;cursor:pointer;font:inherit;margin-left:auto}.amount{font-weight:750;color:#354b3e}.summary{border-top:2px solid #e8dfcd;margin-top:15px;padding-top:12px}.sumrow{display:flex;justify-content:space-between;gap:12px;margin:7px 0;color:#5f6c62}.sumrow strong{color:#293d33}.tier-note{font-size:.82rem;color:#748076;background:#f3f1e8;padding:9px 11px;border-radius:9px;margin:10px 0}.pay{margin-top:12px;background:#204638;border-radius:13px;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.pay span{font-size:.92rem}.pay strong{font-size:1.75rem;color:#ffd29a}.clear{width:100%;margin-top:10px}.footer{text-align:center;color:#7d857c;font-size:.82rem;padding:0 0 22px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.catalog-tools{display:grid;gap:11px;margin:0 0 18px;padding:13px;background:#f5f1e7;border-radius:12px}.filter-row{display:flex;align-items:flex-start;gap:10px}.filter-row>strong{white-space:nowrap;padding-top:6px;color:#49624f;font-size:.9rem}.filters{display:flex;flex-wrap:wrap;gap:6px}.filter-btn{border:1px solid #d9d2c4;border-radius:999px;background:#fffdf8;color:#345743;padding:5px 10px;cursor:pointer;font:inherit;font-size:.86rem}.filter-btn[aria-pressed="true"]{background:#204638;color:#fff;border-color:#204638}.search-row{display:flex;align-items:center;gap:9px}.search-row label{font-weight:700;color:#49624f;white-space:nowrap}.search-input{min-width:140px;flex:1;border:1px solid #d9d2c4;border-radius:9px;padding:8px 10px;font:inherit}.catalog-group{margin:18px 0 24px}.catalog-heading{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid #e8dfcd;padding-bottom:7px;margin-bottom:12px;color:#204638}.catalog-heading h3{margin:0;font-size:1.12rem}.catalog-heading span{font-size:.84rem;color:#748076}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product-visual{height:118px;display:grid;place-items:center;margin:-14px -14px 12px;border-radius:12px 12px 0 0;background:#edf1e9;overflow:hidden}.product-visual svg{width:100%;height:100%;display:block}.product-visual[data-promo="過季品"]{background:#f2eee6}.product-visual[data-promo="促銷庫存"]{background:#faeee4}.product-type{display:inline-flex;background:#f5f1e7;color:#56674f;border-radius:99px;padding:2px 8px;font-size:.78rem}.no-results{padding:22px;border:1px dashed #d9d2c4;border-radius:12px;text-align:center;color:#748076}@media(max-width:520px){.filter-row{display:block}.filter-row>strong{display:block;margin-bottom:6px}.product-grid{grid-template-columns:1fr}.search-row{flex-wrap:wrap}.search-input{min-width:120px}}
@media(max-width:800px){.layout{grid-template-columns:1fr}.cart-panel{position:static;grid-row:1}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.products{grid-template-columns:1fr}.panel{padding:15px}.promo{padding:14px}.top{padding-top:19px}}

<body>
<header class="top"><div class="wrap"><div class="brand">衣日選物・門市結帳小幫手</div><h1>促銷購物車結帳試算器</h1><p>先看每件商品的類別優惠，再試算整車結帳折扣。</p></div></header>
<main class="wrap">
<div class="promo"><span>結帳加碼優惠</span><span><strong>滿 $1,000 95 折</strong>　·　<strong>滿 $2,000 88 折</strong>　·　<strong>滿 $3,000 8 折</strong>　·　<strong>滿 $5,000 75 折</strong></span></div>
<div class="layout"><section class="panel" aria-labelledby="product-heading"><div class="section-head"><h2 id="product-heading">挑選商品</h2><span class="count" id="product-count"></span></div><div class="catalog-tools"><div class="filter-row"><strong>促銷狀態</strong><div id="promotion-filters" class="filters" aria-label="依促銷狀態篩選"></div></div><div class="filter-row"><strong>商品類型</strong><div id="type-filters" class="filters" aria-label="依商品類型篩選"></div></div><div class="search-row"><label for="product-search">搜尋商品</label><input id="product-search" class="search-input" type="search" placeholder="輸入商品名稱"><span id="result-count" class="count" aria-live="polite"></span></div></div><div id="products"></div></section>
<aside class="panel cart-panel" aria-labelledby="cart-heading"><div class="section-head"><h2 id="cart-heading">購物車</h2><span class="count" id="cart-count">0 件商品</span></div><div id="cart-content"></div><div class="summary" id="summary"></div></aside></div>
<footer class="footer">虛構商品試算示範｜不連接真實商店或顧客資料</footer>
</main>
<script>
const products=[{"id":"S01","name":"棉麻短袖襯衫","price":1280,"category":"當季新品","type":"上衣"},{"id":"S02","name":"垂墜寬褲","price":1580,"category":"當季新品","type":"褲子"},{"id":"S03","name":"輕薄針織背心","price":880,"category":"當季新品","type":"上衣"},{"id":"S04","name":"立領防曬外套","price":1980,"category":"當季新品","type":"外套"},{"id":"S05","name":"直筒丹寧長褲","price":1680,"category":"當季新品","type":"褲子"},{"id":"S06","name":"柔棉落肩上衣","price":980,"category":"當季新品","type":"上衣"},{"id":"S07","name":"微光澤百褶裙","price":1480,"category":"當季新品","type":"裙裝"},{"id":"S08","name":"口袋短版外套","price":2280,"category":"當季新品","type":"外套"},{"id":"O01","name":"格紋長袖襯衫","price":1180,"category":"過季品","type":"上衣"},{"id":"O02","name":"刷色牛仔短褲","price":1080,"category":"過季品","type":"褲子"},{"id":"O03","name":"薄款連帽外套","price":1880,"category":"過季品","type":"外套"},{"id":"O04","name":"荷葉袖洋裝","price":1680,"category":"過季品","type":"洋裝"},{"id":"O05","name":"綁帶九分褲","price":1380,"category":"過季品","type":"褲子"},{"id":"O06","name":"V領針織上衣","price":980,"category":"過季品","type":"上衣"},{"id":"O07","name":"雙面穿背心","price":1280,"category":"過季品","type":"上衣"},{"id":"P01","name":"條紋棉質T恤","price":690,"category":"促銷庫存","type":"上衣"},{"id":"P02","name":"抽繩休閒短褲","price":890,"category":"促銷庫存","type":"褲子"},{"id":"P03","name":"素色薄長袖上衣","price":790,"category":"促銷庫存","type":"上衣"},{"id":"P04","name":"輕便帆布托特包","price":590,"category":"促銷庫存","type":"配件"},{"id":"P05","name":"簡約羅紋襪組","price":290,"category":"促銷庫存","type":"配件"},{"id":"S09","name":"棉質短版針織衫","price":1180,"category":"當季新品","type":"上衣"},{"id":"S10","name":"亞麻七分袖上衣","price":1080,"category":"當季新品","type":"上衣"},{"id":"S11","name":"落肩條紋襯衫","price":1380,"category":"當季新品","type":"上衣"},{"id":"S12","name":"高腰直筒牛仔褲","price":1780,"category":"當季新品","type":"褲子"},{"id":"S13","name":"輕量防風外套","price":2180,"category":"當季新品","type":"外套"},{"id":"S14","name":"A字牛仔裙","price":1480,"category":"當季新品","type":"裙裝"},{"id":"S15","name":"俐落剪裁連身褲","price":1980,"category":"當季新品","type":"連身服"},{"id":"S16","name":"寬版西裝外套","price":2680,"category":"當季新品","type":"外套"},{"id":"S17","name":"細肩帶針織背心","price":780,"category":"當季新品","type":"上衣"},{"id":"S18","name":"緞面垂墜長裙","price":1680,"category":"當季新品","type":"裙裝"},{"id":"S19","name":"綁帶襯衫式洋裝","price":1880,"category":"當季新品","type":"洋裝"},{"id":"S20","name":"編織皮革腰帶","price":680,"category":"當季新品","type":"配件"},{"id":"O08","name":"復古水洗丹寧襯衫","price":1280,"category":"過季品","type":"上衣"},{"id":"O09","name":"細肩帶碎花洋裝","price":1580,"category":"過季品","type":"洋裝"},{"id":"O10","name":"格紋百褶中長裙","price":1380,"category":"過季品","type":"裙裝"},{"id":"O11","name":"多口袋工裝長褲","price":1480,"category":"過季品","type":"褲子"},{"id":"O12","name":"羊毛混紡大衣","price":2880,"category":"過季品","type":"外套"},{"id":"O13","name":"毛呢報童帽","price":680,"category":"過季品","type":"配件"},{"id":"O14","name":"簡約斜背小包","price":980,"category":"過季品","type":"配件"},{"id":"O15","name":"雙色針織圍巾","price":590,"category":"過季品","type":"配件"},{"id":"O16","name":"燈芯絨長袖襯衫","price":1280,"category":"過季品","type":"上衣"},{"id":"O17","name":"錐形剪裁卡其褲","price":1380,"category":"過季品","type":"褲子"},{"id":"O18","name":"鋪棉立領背心","price":1680,"category":"過季品","type":"外套"},{"id":"O19","name":"復古方領短洋裝","price":1480,"category":"過季品","type":"洋裝"},{"id":"O20","name":"經典低筒帆布鞋","price":1280,"category":"過季品","type":"鞋款"},{"id":"P06","name":"基本款圓領短袖上衣","price":490,"category":"促銷庫存","type":"上衣"},{"id":"P07","name":"彈性休閒長褲","price":790,"category":"促銷庫存","type":"褲子"},{"id":"P08","name":"輕薄防曬連帽外套","price":990,"category":"促銷庫存","type":"外套"},{"id":"P09","name":"棉質抽繩長裙","price":690,"category":"促銷庫存","type":"裙裝"},{"id":"P10","name":"素面背心洋裝","price":890,"category":"促銷庫存","type":"洋裝"},{"id":"P11","name":"小格紋短袖襯衫","price":590,"category":"促銷庫存","type":"上衣"},{"id":"P12","name":"刷色丹寧五分褲","price":690,"category":"促銷庫存","type":"褲子"},{"id":"P13","name":"輕便收納風衣","price":1290,"category":"促銷庫存","type":"外套"},{"id":"P14","name":"簡約A字短裙","price":590,"category":"促銷庫存","type":"裙裝"},{"id":"P15","name":"棉麻寬版連身褲","price":1090,"category":"促銷庫存","type":"連身服"},{"id":"P16","name":"素色針織毛帽","price":290,"category":"促銷庫存","type":"配件"},{"id":"P17","name":"日常帆布肩背包","price":490,"category":"促銷庫存","type":"配件"},{"id":"P18","name":"柔軟居家短襪三入組","price":190,"category":"促銷庫存","type":"配件"},{"id":"P19","name":"百搭薄款罩衫","price":690,"category":"促銷庫存","type":"外套"},{"id":"P20","name":"輕量慢跑鞋","price":990,"category":"促銷庫存","type":"鞋款"}]
const rates={'當季新品':1,'過季品':.8,'促銷庫存':.6};const money=n=>'$'+Math.round(n).toLocaleString('zh-TW');const unitPrice=p=>Math.round(p.price*rates[p.category]);let cart={};
const promotionNames=['當季新品','過季品','促銷庫存'];const merchandiseTypes=[...new Set(products.map(p=>p.type))];let activePromotion='全部';let activeType='全部';let searchText='';
function typeVisual(type){const forms={
'上衣':'<path d="m105 42 31-18 20 10 20-10 31 18 20 23-18 14-13-14v57h-80V65l-13 14-18-14 20-23Z"/>',
'褲子':'<path d="M119 24h74l-4 100h-28l-5-59-5 59h-28l-4-100Z"/>',
'外套':'<path d="m109 39 30-16 17 10 17-10 30 16 20 27-17 12-14-16v60h-72V62l-14 16-17-12 20-27Z"/><path d="M156 34v88m-8-72h8" fill="none"/>',
'裙裝':'<path d="M139 24h34l5 25 25 72h-94l25-72 5-25Z"/>',
'洋裝':'<path d="M142 25h28l8 21 20 12-12 19-8-6 19 50h-94l19-50-8 6-12-19 20-12 8-21Z"/>',
'連身服':'<path d="M137 25h38l7 22 19 15-13 18-10-7 15 47h-31l-6-44-6 44h-31l15-47-10 7-13-18 19-15 7-22Z"/>',
'配件':'<path d="M118 51h74l13 68h-100l13-68Zm18 0c0-17 8-28 19-28s19 11 19 28" fill="none" stroke-width="8"/>',
'鞋款':'<path d="M108 88c20 0 30-12 37-38h20c5 24 14 35 35 39l15 14v16H108V88Z"/>'};const shape=forms[type]||forms['上衣'];return `<svg viewBox="0 0 320 140" role="img" aria-label="${type}商品示意圖" xmlns="http://www.w3.org/2000/svg"><path d="M0 118q80-28 160 0t160 0v22H0Z" fill="#ffffff" opacity=".7"/><g fill="#fffaf0" stroke="#496b54" stroke-width="4" stroke-linejoin="round">${shape}</g><text x="270" y="38" text-anchor="middle" font-size="13" fill="#49624f">${type}</text></svg>`}
function renderProducts(){const promoFilters=document.getElementById('promotion-filters'),typeFilters=document.getElementById('type-filters');promoFilters.innerHTML=['全部',...promotionNames].map(c=>`<button class="filter-btn" type="button" aria-pressed="${activePromotion===c}" onclick="setPromotion('${c}')">${c}</button>`).join('');typeFilters.innerHTML=['全部',...merchandiseTypes].map(t=>`<button class="filter-btn" type="button" aria-pressed="${activeType===t}" onclick="setProductType('${t}')">${t}</button>`).join('');const visible=products.filter(p=>(activePromotion==='全部'||p.category===activePromotion)&&(activeType==='全部'||p.type===activeType)&&p.name.toLowerCase().includes(searchText));document.getElementById('product-count').textContent=`${products.length} 項虛構商品`;document.getElementById('result-count').textContent=`找到 ${visible.length} 項`;const groups=promotionNames.map(category=>{const items=visible.filter(p=>p.category===category);if(!items.length)return '';return `<section class="catalog-group"><header class="catalog-heading"><h3>${category}</h3><span>${items.length} 項</span></header><div class="product-grid">${items.map(p=>`<article class="product"><div class="product-visual" data-promo="${p.category}">${typeVisual(p.type)}</div><h3>${p.name}</h3><div class="meta"><span class="tag">${p.category}</span><span class="product-type">${p.type}</span></div><div class="price-line"><span class="price">${money(unitPrice(p))}</span><span class="old">原價 ${money(p.price)}</span><span class="discount">${rates[p.category]===1?'不打折':`${rates[p.category]*10} 折`}</span></div><div class="add-row"><label class="sr-only" for="qty-${p.id}">${p.name}購買數量</label><input class="qty-input" id="qty-${p.id}" type="number" min="1" step="1" value="1"><button class="button" type="button" onclick="addToCart('${p.id}')">加入購物車</button></div></article>`).join('')}</div></section>`}).join('');document.getElementById('products').innerHTML=groups||'<div class="no-results">找不到符合條件的商品，請調整分類或關鍵字。</div>'}
function setPromotion(category){activePromotion=category;renderProducts()}
function setProductType(type){activeType=type;renderProducts()}
document.getElementById('product-search').addEventListener('input',event=>{searchText=event.target.value.trim().toLowerCase();renderProducts()});
function addToCart(id){const input=document.getElementById(`qty-${id}`);const qty=Number(input.value);if(!Number.isInteger(qty)||qty<1){input.focus();input.setCustomValidity('請輸入正整數數量');input.reportValidity();input.setCustomValidity('');return}cart[id]=(cart[id]||0)+qty;renderCart()}
function updateQty(id,value){const qty=Number(value);if(!Number.isInteger(qty)||qty<1){renderCart();return}cart[id]=qty;renderCart()}
function removeItem(id){delete cart[id];renderCart()}
function clearCart(){cart={};renderCart()}
function getTier(subtotal){if(subtotal>=5000)return{rate:.75,label:'滿 $5,000｜75 折'};if(subtotal>=3000)return{rate:.8,label:'滿 $3,000｜8 折'};if(subtotal>=2000)return{rate:.88,label:'滿 $2,000｜88 折'};if(subtotal>=1000)return{rate:.95,label:'滿 $1,000｜95 折'};return{rate:1,label:'未滿 $1,000｜無結帳折扣'}}
function renderCart(){const entries=Object.entries(cart);const content=document.getElementById('cart-content');document.getElementById('cart-count').textContent=`${entries.reduce((s,[,q])=>s+q,0)} 件商品`;if(!entries.length){content.innerHTML='<div class="cart-empty">購物車目前是空的<br>從商品清單加入想試算的品項。</div>';document.getElementById('summary').innerHTML='<div class="sumrow"><span>原價合計</span><strong>$0</strong></div><div class="sumrow"><span>折後商品小計</span><strong>$0</strong></div><div class="sumrow"><span>結帳折抵</span><strong>$0</strong></div><div class="pay"><span>最後應付</span><strong>$0</strong></div>';return}
let original=0,subtotal=0;content.innerHTML=`<div class="cart-items">${entries.map(([id,qty])=>{const p=products.find(item=>item.id===id),unit=unitPrice(p),row=unit*qty;original+=p.price*qty;subtotal+=row;return `<div class="cart-item"><div class="cart-title"><span>${p.name}</span><span class="amount">${money(row)}</span></div><div class="cart-sub">${p.category}｜折後單價 ${money(unit)}（原價 ${money(p.price)}）</div><div class="cart-controls"><label for="cart-${id}">數量</label><input id="cart-${id}" type="number" min="1" step="1" value="${qty}" onchange="updateQty('${id}',this.value)"><button class="remove" type="button" onclick="removeItem('${id}')">移除</button></div></div>`}).join('')}</div>`;const tier=getTier(subtotal),discount=subtotal-Math.round(subtotal*tier.rate),pay=subtotal-discount;document.getElementById('summary').innerHTML=`<div class="sumrow"><span>原價合計</span><strong>${money(original)}</strong></div><div class="sumrow"><span>商品折扣後小計</span><strong>${money(subtotal)}</strong></div><div class="tier-note">套用級距：${tier.label}</div><div class="sumrow"><span>結帳折抵金額</span><strong>− ${money(discount)}</strong></div><div class="pay"><span>最後應付金額</span><strong>${money(pay)}</strong></div><button class="button secondary clear" type="button" onclick="clearCart()">清空購物車</button>`}
renderProducts();renderCart();
</script>
</body>
</html>
