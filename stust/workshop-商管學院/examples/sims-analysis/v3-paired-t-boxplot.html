function tcdf(t,df){let x=df/(df+t*t),q=.5*ibeta(x,df/2,.5);return t>=0?1-q:q}function tinv(p,df){let lo=0,hi=50;for(let i=0;i<80;i++){let m=(lo+hi)/2;if(tcdf(m,df)<p)lo=m;else hi=m}return (lo+hi)/2}
function boxSvg(a,b,label){let vals=[...a,...b],W=580,H=235,L=56,R=20,T=20,B=42,x=v=>L+(v-1)/6*(W-L-R),groups=[['前測',a,75,'#6c9b95'],['後測',b,155,'#df9b62']];let grid=[1,2,3,4,5,6,7].map(v=>`<line x1="${x(v)}" y1="${T}" x2="${x(v)}" y2="${H-B}" stroke="#e4e9e8"/><text x="${x(v)}" y="${H-15}" text-anchor="middle">${v}</text>`).join('');function quant(sorted,p){let k=(sorted.length-1)*p,lo=Math.floor(k),hi=Math.ceil(k);return sorted[lo]+(sorted[hi]-sorted[lo])*(k-lo)}let g=groups.map(([n,v,y,col])=>{let s=[...v].sort((a,b)=>a-b),q1=quant(s,.25),med=quant(s,.5),q3=quant(s,.75),iqr=q3-q1,low=s.find(z=>z>=q1-1.5*iqr)??s[0],high=[...s].reverse().find(z=>z<=q3+1.5*iqr)??s[s.length-1];let out=s.filter(z=>z<low||z>high).map(z=>`<circle cx="${x(z)}" cy="${y}" r="4" fill="${col}"/>`).join('');return `<text x="12" y="${y+5}">${n} n=${s.length}</text><line x1="${x(low)}" y1="${y}" x2="${x(high)}" y2="${y}" stroke="${col}" stroke-width="2"/><line x1="${x(low)}" y1="${y-10}" x2="${x(low)}" y2="${y+10}" stroke="${col}"/><line x1="${x(high)}" y1="${y-10}" x2="${x(high)}" y2="${y+10}" stroke="${col}"/><rect x="${x(q1)}" y="${y-18}" width="${x(q3)-x(q1)}" height="36" fill="${col}" fill-opacity=".32" stroke="${col}" stroke-width="2"/><line x1="${x(med)}" y1="${y-18}" x2="${x(med)}" y2="${y+18}" stroke="#20323b" stroke-width="3"/>${out}`}).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}前後測盒鬚圖">${grid}${g}</svg>`}
function renderTests(ss,d){let results=ss.map(s=>{let dif=s.postVals.map((v,i)=>v-s.preVals[i]),n=dif.length,m=mean(dif),sdD=sd(dif),t=m/(sdD/Math.sqrt(n)),df=n-1,p=2*(1-tcdf(Math.abs(t),df)),crit=tinv(.975,df),dz=m/sdD;return {...s,n,m,sdD,t,df,p,low:m-crit*sdD/Math.sqrt(n),high:m+crit*sdD/Math.sqrt(n),dz}});let sorted=[...results].sort((a,b)=>a.p-b.p),adj={};let mx=0;sorted.forEach((r,i)=>{mx=Math.max(mx,Math.min(1,(sorted.length-i)*r.p));adj[r.c]=mx});$('#tests').innerHTML='<h2>配對樣本 t 檢定與分布</h2><p class="muted">差值＝後測−前測；p 為雙尾，α=.05；四次檢定另列 Holm 校正。dz 為平均差除以差值標準差。</p>'+`<div class="scroll"><table><thead><tr><th>構面</th><th>n</th><th>前測 M (SD)</th><th>後測 M (SD)</th><th>差 M</th><th>95% CI</th><th>t(df)</th><th>p</th><th>Holm p</th><th>dz</th></tr></thead><tbody>${results.map(r=>`<tr><th>${r.label}</th><td>${r.n}</td><td>${mean(r.preVals).toFixed(2)} (${sd(r.preVals).toFixed(2)})</td><td>${mean(r.postVals).toFixed(2)} (${sd(r.postVals).toFixed(2)})</td><td>${r.m>0?'+':''}${r.m.toFixed(2)}</td><td>[${r.low.toFixed(2)}, ${r.high.toFixed(2)}]</td><td>${r.t.toFixed(2)} (${r.df})</td><td>${r.p<.001?'<.001':r.p.toFixed(3)}</td><td>${adj[r.c]<.001?'<.001':adj[r.c].toFixed(3)}</td><td>${r.dz.toFixed(2)}</td></tr>`).join('')}</tbody></table></div><div class="grid">${results.map(r=>`<article><h3>${r.label}</h3>${boxSvg(r.preVals,r.postVals,r.label)}<small>箱體為 Q1–Q3，中線為中位數；鬚延伸至 1.5×IQR 範圍內最遠觀察值，超出點會另外標示。</small></article>`).join('')}</div><div class="note">此配對檢定描述目前模擬樣本的前後差異。未顯著不代表完全相同；顯著也不證明活動造成改變。請一併檢查差值分布、區間及實務意義。</div>`}
$('#upload').addEventListener('change',async e=>{let f=e.target.files[0];if(f){try{rows=parseCSV(await f.text());$('#msg').textContent=`已載入 ${f.name}`;render()}catch(err){$('#msg').textContent='無法讀取 CSV：'+err.message}}});$('#cohort').addEventListener('change',render);render();</script></body></html>
