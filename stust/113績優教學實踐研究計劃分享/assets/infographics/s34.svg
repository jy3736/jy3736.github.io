<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">以教學、觀察與調整形成研究循環</title>
  <desc id="desc">教學與研究，形成循環；教學；觀察；調整；分析資料，再回到課堂；留下觀察與調整的依據</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">教學與研究，形成循環</text><path d="M244 105 H322 V220" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M256 265 H144" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M58 265 H38 V105 H155" fill="none" stroke="#A85F29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><circle cx="200" cy="105" r="35" fill="#D5E5DF"/><g transform="translate(177.2 82.2) scale(0.95)"><path d="M4 6 H44 V31 H4 Z M11 15 H25 M11 23 H35 M24 31 V43 M16 43 H32" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200" y="170" text-anchor="middle" font-size="24" font-weight="700" fill="#167C80">教學</text><circle cx="300" cy="265" r="35" fill="#D5E5DF"/><g transform="translate(277.2 242.2) scale(0.95)"><path d="M20 34 A14 14 0 1 0 20 6 A14 14 0 1 0 20 34 M30 30 L44 44" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="300" y="330" text-anchor="middle" font-size="24" font-weight="700" fill="#167C80">觀察</text><circle cx="100" cy="265" r="35" fill="#F1E2D3"/><g transform="translate(77.2 242.2) scale(0.95)"><path d="M5 10 H43 V37 H5 Z M19 37 V43 M29 37 V43 M14 43 H34 M12 19 L17 24 L12 29 M25 29 H34" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="100" y="330" text-anchor="middle" font-size="24" font-weight="700" fill="#A85F29">調整</text><text x="200" y="372" text-anchor="middle" font-size="23" font-weight="700" fill="#A85F29">分析資料，再回到課堂</text><path d="M148 389 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">留下觀察與調整的依據</text></g>
</svg>
