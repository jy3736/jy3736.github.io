<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">修正後計算分數與各次施測信度</title><desc id="desc">由老師確認錯誤後，依計分規則計算構面平均、RAI與每次施測的信度；信度不能代替量表效度的證據。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">先確認修正，再依規則計分</text><rect x="63" y="104" width="434" height="68" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="147" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">老師核對原始表單後，指定修正</text><path d="M280 172 V204" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M94 204 H466" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M94 204 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="10" y="240" width="168" height="105" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="94" y="281" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">四個構面</text><text x="94" y="322" text-anchor="middle" font-size="21" font-weight="600" fill="#167C80">各四題平均</text><path d="M280 204 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="196" y="240" width="168" height="105" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="281" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">RAI</text><text x="280" y="322" text-anchor="middle" font-size="21" font-weight="600" fill="#167C80">依指定公式</text><path d="M466 204 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="382" y="240" width="168" height="105" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="466" y="281" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">信度 α</text><text x="466" y="322" text-anchor="middle" font-size="21" font-weight="600" fill="#167C80">每次施測分開算</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">先講清楚算法，α 不能代替效度證據</text></g></svg>