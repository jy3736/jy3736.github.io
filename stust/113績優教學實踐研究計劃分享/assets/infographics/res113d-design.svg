<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">同一批學生四次施測，沒有對照組</title>
  <desc id="desc">單組重複測量；1；基礎；2；模組；3；RTL；4；專題；同一批學生；沒有對照組；四次 SIMS；能看變化，難談因果</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">單組重複測量</text><path d="M36 168 H364" fill="none" stroke="#163D40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><circle cx="62" cy="168" r="22" fill="#167C80"/><text x="62" y="177" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">1</text><text x="62" y="226" text-anchor="middle" font-size="23" font-weight="700" fill="#167C80">基礎</text><circle cx="152" cy="168" r="22" fill="#167C80"/><text x="152" y="177" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">2</text><text x="152" y="226" text-anchor="middle" font-size="23" font-weight="700" fill="#167C80">模組</text><circle cx="242" cy="168" r="22" fill="#167C80"/><text x="242" y="177" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">3</text><text x="242" y="226" text-anchor="middle" font-size="23" font-weight="700" fill="#167C80">RTL</text><circle cx="332" cy="168" r="22" fill="#A85F29"/><text x="332" y="177" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">4</text><text x="332" y="226" text-anchor="middle" font-size="23" font-weight="700" fill="#A85F29">專題</text><rect x="44" y="268" width="312" height="82" rx="8" fill="#D5E5DF"/><text x="200" y="304" text-anchor="middle" font-size="27" font-weight="800" fill="#167C80">同一批學生</text><text x="200" y="336" text-anchor="middle" font-size="23" font-weight="600" fill="#163D40">沒有對照組</text><text x="200" y="108" text-anchor="middle" font-size="31" font-weight="800" fill="#163D40">四次 SIMS</text><path d="M148 381 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="410" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">能看變化，難談因果</text></g>
</svg>
