" font-size="22" font-weight="600" fill="#506764">自動測試</text><path d="M30 296 H370" fill="none" stroke="#163D40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="404" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">有支撐</text><text x="200" y="434" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">不等於人人接得住</text></g>
