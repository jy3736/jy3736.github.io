<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">成績考核與成效評量的不同目的</title>
  <desc id="desc">兩件事，分開寫清楚；成績考核；成效評量；怎麼計分；看什麼改變；考核方式；評量工具；課程成績；學習證據；兩種用途，都要詳述</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">兩件事，分開寫清楚</text><g transform="translate(66.4 67.4) scale(1.15)"><path d="M9 4 H39 V44 H9 Z M15 16 L19 20 L26 12 M15 33 L19 37 L26 29 M30 17 H33 M30 34 H33" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(278.4 67.4) scale(1.15)"><path d="M5 5 V43 H45 M13 34 V27 M24 34 V19 M35 34 V10" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="94" y="153" text-anchor="middle" font-size="25" font-weight="700" fill="#167C80">成績考核</text><text x="306" y="153" text-anchor="middle" font-size="25" font-weight="700" fill="#A85F29">成效評量</text><text x="94" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">怎麼計分</text><text x="306" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">看什麼改變</text><circle cx="200" cy="206" r="2.5" fill="#B5CAC3"/><text x="94" y="278" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">考核方式</text><text x="306" y="278" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">評量工具</text><circle cx="200" cy="269" r="2.5" fill="#B5CAC3"/><text x="94" y="341" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">課程成績</text><text x="306" y="341" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">學習證據</text><circle cx="200" cy="332" r="2.5" fill="#B5CAC3"/><path d="M148 389 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">兩種用途，都要詳述</text></g>
</svg>
