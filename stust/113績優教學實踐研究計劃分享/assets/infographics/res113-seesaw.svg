<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">好消息與警訊相對，相對自主指數未達顯著變化</title>
  <desc id="desc">構面與總指數，一起看；好消息；內在、認同；警訊；動機缺乏；不同構面的變化；可能互相抵銷；這是解釋，還不是定論</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">構面與總指數，一起看</text><path d="M60 186 H340" fill="none" stroke="#163D40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 186 L172 246 H228 Z" fill="none" stroke="#B5CAC3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="106" width="124" height="72" rx="8" fill="#D5E5DF"/><text x="106" y="132" text-anchor="middle" font-size="24" font-weight="800" fill="#167C80">好消息</text><text x="106" y="167" text-anchor="middle" font-size="22" font-weight="600" fill="#163D40">內在、認同</text><rect x="232" y="106" width="124" height="72" rx="8" fill="#F1E2D3"/><text x="294" y="132" text-anchor="middle" font-size="24" font-weight="800" fill="#A85F29">警訊</text><text x="294" y="167" text-anchor="middle" font-size="22" font-weight="600" fill="#163D40">動機缺乏</text><text x="200" y="296" text-anchor="middle" font-size="26" font-weight="800" fill="#163D40">不同構面的變化</text><text x="200" y="336" text-anchor="middle" font-size="27" font-weight="700" fill="#A85F29">可能互相抵銷</text><text x="200" y="378" text-anchor="middle" font-size="23" font-weight="600" fill="#506764">這是解釋，還不是定論</text></g>
