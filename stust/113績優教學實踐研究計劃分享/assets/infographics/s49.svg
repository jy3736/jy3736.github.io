<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">SIMS十六題分屬四構面，各有四題，不能只看一個總分</title><desc id="desc">SIMS十六題分屬四構面，各有四題，不能只看一個總分。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="150.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">內在動機</text><text x="150.0" y="73" text-anchor="middle" font-size="21" font-weight="500" fill="#506764">題號</text><rect x="88.0" y="91" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="115.0" y="128" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">1</text><rect x="158.0" y="91" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="185.0" y="128" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">5</text><rect x="88.0" y="156" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="115.0" y="193" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">9</text><rect x="158.0" y="156" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="185.0" y="193" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">13</text><text x="150.0" y="279" text-anchor="middle" font-size="27" font-weight="800" fill="#163D40">因為有趣</text></g><g transform="translate(300 0)"><text x="150.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">認同調節</text><text x="150.0" y="73" text-anchor="middle" font-size="21" font-weight="500" fill="#506764">題號</text><rect x="88.0" y="91" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="115.0" y="128" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">2</text><rect x="158.0" y="91" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="185.0" y="128" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">6</text><rect x="88.0" y="156" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="115.0" y="193" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">10</text><rect x="158.0" y="156" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="185.0" y="193" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">14</text><text x="150.0" y="279" text-anchor="middle" font-size="27" font-weight="800" fill="#163D40">對自己有價值</text></g><g transform="translate(600 0)"><text x="150.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">外在調節</text><text x="150.0" y="73" text-anchor="middle" font-size="21" font-weight="500" fill="#506764">題號</text><rect x="88.0" y="91" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="115.0" y="128" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">3</text><rect x="158.0" y="91" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="185.0" y="128" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">7</text><rect x="88.0" y="156" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="115.0" y="193" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">11</text><rect x="158.0" y="156" width="54" height="53" rx="5" fill="#D5E5DF"/><text x="185.0" y="193" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">15</text><text x="150.0" y="279" text-anchor="middle" font-size="27" font-weight="800" fill="#163D40">因為外界要求</text></g><g transform="translate(900 0)"><text x="150.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">動機缺乏</text><text x="150.0" y="73" text-anchor="middle" font-size="21" font-weight="500" fill="#506764">題號</text><rect x="88.0" y="91" width="54" h