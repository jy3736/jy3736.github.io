<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">從使用 AI 走向評估、批判與創造 AI 輸出，屬下一步目標</title>
  <desc id="desc">不只會用，還要會看；使用 AI；評估；好不好；批判；對不對；創造；變成自己的；RAI 沒有明顯提升：；報告認為尚未全面內化；目標，尚未驗證</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">不只會用，還要會看</text><rect x="120" y="66" width="160" height="62" rx="8" fill="#D5E5DF"/><text x="200" y="106" text-anchor="middle" font-size="27" font-weight="800" fill="#167C80">使用 AI</text><path d="M200 130 V160 M76 160 H324" fill="none" stroke="#B5CAC3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 160 V194" fill="none" stroke="#A85F29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><rect x="20" y="198" width="112" height="92" rx="8" fill="#F1E2D3"/><text x="76" y="240" text-anchor="middle" font-size="26" font-weight="800" fill="#A85F29">評估</text><text x="76" y="272" text-anchor="middle" font-size="18" font-weight="600" fill="#163D40">好不好</text><path d="M200 160 V194" fill="none" stroke="#A85F29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><rect x="144" y="198" width="112" height="92" rx="8" fill="#F1E2D3"/><text x="200" y="240" text-anchor="middle" font-size="26" font-weight="800" fill="#A85F29">批判</text><text x="200" y="272" text-anchor="middle" font-size="18" font-weight="600" fill="#163D40">對不對</text><path d="M324 160 V194" fill="none" stroke="#A85F29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><rect x="268" y="198" width="112" height="92" rx="8" fill="#F1E2D3"/><text x="324" y="240" text-anchor="middle" font-size="26" font-weight="800" fill="#A85F29">創造</text><text x="324" y="272" text-anchor="middle" font-size="18" font-weight="600" fill="#163D40">變成自己的</text><text x="200" y="332" text-anchor="middle" font-size="21" font-weight="700" fill="#163D40">RAI 沒有明顯提升：</text><text x="200" y="362" text-anchor="middle" font-size="21" font-weight="600" fill="#506764">報告認為尚未全面內化</text><path d="M148 387 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="416" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">目標，尚未驗證</text></g>
