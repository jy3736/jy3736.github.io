<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">四個階段中 AI 的介入方式逐步加重</title>
  <desc id="desc">AI 一階一階加進來；還不用；階段一；自由選；階段二；正式用；階段三；三選一；階段四；階梯是介入方式，不是成效</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">AI 一階一階加進來</text><rect x="34" y="322" width="80" height="34" rx="5" fill="#D5E5DF"/><text x="74" y="288" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">還不用</text><text x="74" y="314" text-anchor="middle" font-size="18" font-weight="600" fill="#506764">階段一</text><rect x="118" y="260" width="80" height="96" rx="5" fill="#D5E5DF"/><text x="158" y="226" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">自由選</text><text x="158" y="252" text-anchor="middle" font-size="18" font-weight="600" fill="#506764">階段二</text><rect x="202" y="198" width="80" height="158" rx="5" fill="#D5E5DF"/><text x="242" y="164" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">正式用</text><text x="242" y="190" text-anchor="middle" font-size="18" font-weight="600" fill="#506764">階段三</text><rect x="286" y="136" width="80" height="220" rx="5" fill="#F1E2D3"/><text x="326" y="102" text-anchor="middle" font-size="23" font-weight="800" fill="#A85F29">三選一</text><text x="326" y="128" text-anchor="middle" font-size="18" font-weight="600" fill="#506764">階段四</text><path d="M148 371 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="400" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">階梯是介入方式，不是成效</text></g>
</svg>
