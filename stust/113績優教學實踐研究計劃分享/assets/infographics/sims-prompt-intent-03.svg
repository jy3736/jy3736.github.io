<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">由研究問題與資料結構選方法</title><desc id="desc">先看平均數與標準差，再說明想知道整學期動機是否改變；要求AI說明方法選擇理由。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">先說想回答什麼，再問用什麼方法</text><circle cx="94" cy="143" r="53" fill="#D5E5DF"/><text x="94" y="153" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">第 1 週</text><circle cx="280" cy="143" r="53" fill="#D5E5DF"/><text x="280" y="153" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">第 9 週</text><circle cx="466" cy="143" r="53" fill="#D5E5DF"/><text x="466" y="153" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">第 18 週</text><path d="M94 204 H466" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="280" y="235" text-anchor="middle" font-size="25" font-weight="600" fill="#167C80">同一批學生・三次施測</text><path d="M280 245 V273" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="52" y="283" width="456" height="68" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="325" text-anchor="middle" font-size="24" font-weight="600" fill="#163D40">動機有沒有改變？方法為什麼適合？</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">平均看方向，方法要能說出選擇理由</text></g></svg>