<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">可以說、要小心、還不能說的三個層次</title>
  <desc id="desc">話能說到哪裡；可以說；觀察到內在動機升高；要小心；分數更分散；還不能說；是 AI 造成的；單組設計的界線</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">話能說到哪裡</text><rect x="30" y="66" width="340" height="88" rx="10" fill="#D5E5DF"/><text x="200" y="102" text-anchor="middle" font-size="22" font-weight="800" fill="#167C80">可以說</text><text x="200" y="136" text-anchor="middle" font-size="26" font-weight="800" fill="#163D40">觀察到內在動機升高</text><rect x="30" y="172" width="340" height="88" rx="10" fill="#F1E2D3"/><text x="200" y="208" text-anchor="middle" font-size="22" font-weight="800" fill="#A85F29">要小心</text><text x="200" y="242" text-anchor="middle" font-size="26" font-weight="800" fill="#163D40">分數更分散</text><rect x="30" y="278" width="340" height="88" rx="10" fill="#B5CAC3"/><text x="200" y="314" text-anchor="middle" font-size="22" font-weight="800" fill="#163D40">還不能說</text><text x="200" y="348" text-anchor="middle" font-size="26" font-weight="800" fill="#163D40">是 AI 造成的</text><path d="M148 387 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="416" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">單組設計的界線</text></g>
</svg>
