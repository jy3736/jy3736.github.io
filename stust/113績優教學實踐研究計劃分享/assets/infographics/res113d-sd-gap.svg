<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">109 到 111 學年，學期成績標準差由 10.95 增為 14.65，將近 34%</title>
  <desc id="desc">平均差不多，距離變遠；109 學年　標準差 10.95；111 學年　標準差 14.65；將近 34%；線寬依標準差比例</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">平均差不多，距離變遠</text><text x="200" y="78" text-anchor="middle" font-size="24" font-weight="800" fill="#167C80">109 學年　標準差 10.95</text><path d="M90.5 120 H309.5" fill="none" stroke="#167C80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M90.5 108 V132 M309.5 108 V132" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="120" r="8" fill="#163D40"/><text x="200" y="228" text-anchor="middle" font-size="24" font-weight="800" fill="#A85F29">111 學年　標準差 14.65</text><path d="M53.5 270 H346.5" fill="none" stroke="#A85F29" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M53.5 258 V282 M346.5 258 V282" fill="none" stroke="#A85F29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="270" r="8" fill="#163D40"/><text x="200" y="352" text-anchor="middle" font-size="34" font-weight="800" fill="#A85F29">將近 34%</text><path d="M148 381 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="410" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">線寬依標準差比例</text></g>
