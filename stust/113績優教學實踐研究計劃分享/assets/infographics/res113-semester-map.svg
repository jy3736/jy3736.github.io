<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">下一輪調整落在學期的位置：精簡第二階段、中段診斷、後段加時數與專題拆小，尚未實施</title>
  <desc id="desc">這些調整，落在學期哪裡；階段一；階段二；精簡重複練習；階段三；時數移進來；階段四；時數移進來、專題拆小；課程中段：動機診斷；難度階梯：延續第四階段的分層；都是想做的，尚未實施</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">這些調整，落在學期哪裡</text><rect x="30" y="58" width="92" height="52" rx="6" fill="#D5E5DF"/><text x="76" y="92" text-anchor="middle" font-size="22" font-weight="800" fill="#167C80">階段一</text><rect x="30" y="118" width="92" height="52" rx="6" fill="#D5E5DF"/><text x="76" y="152" text-anchor="middle" font-size="22" font-weight="800" fill="#167C80">階段二</text><text x="136" y="152" text-anchor="start" font-size="21" font-weight="800" fill="#A85F29">精簡重複練習</text><rect x="30" y="228" width="92" height="52" rx="6" fill="#D5E5DF"/><text x="76" y="262" text-anchor="middle" font-size="22" font-weight="800" fill="#167C80">階段三</text><text x="136" y="262" text-anchor="start" font-size="21" font-weight="800" fill="#A85F29">時數移進來</text><rect x="30" y="288" width="92" height="52" rx="6" fill="#D5E5DF"/><text x="76" y="322" text-anchor="middle" font-size="22" font-weight="800" fill="#167C80">階段四</text><text x="136" y="322" text-anchor="start" font-size="21" font-weight="800" fill="#A85F29">時數移進來、專題拆小</text><text x="30" y="198" text-anchor="start" font-size="21" font-weight="800" fill="#A85F29">課程中段：動機診斷</text><path d="M30 212 H370" fill="none" stroke="#A85F29" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><text x="200" y="374" text-anchor="middle" font-size="19" font-weight="600" fill="#506764">難度階梯：延續第四階段的分層</text><path d="M148 395 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="424" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">都是想做的，尚未實施</text></g>
</svg>
