<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">平時 50%、期中 20%、期末 30%，高度依比例</title>
  <desc id="desc">一半的分數在平時；50%；平時；小測・線上練習・實作；20%；期中；上機：選擇＋實作；30%；期末；選擇＋專題或補救；高度依配分比例</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">一半的分數在平時</text><rect x="30" y="66" width="110" height="165.0" rx="5" fill="#D5E5DF"/><text x="85" y="161.0" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">50%</text><text x="154" y="147.0" text-anchor="start" font-size="24" font-weight="800" fill="#167C80">平時</text><text x="154" y="173.0" text-anchor="start" font-size="16" font-weight="600" fill="#163D40">小測・線上練習・實作</text><rect x="30" y="236.0" width="110" height="63.0" rx="5" fill="#B5CAC3"/><text x="85" y="280.0" text-anchor="middle" font-size="30" font-weight="800" fill="#163D40">20%</text><text x="154" y="266.0" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">期中</text><text x="154" y="292.0" text-anchor="start" font-size="16" font-weight="600" fill="#163D40">上機：選擇＋實作</text><rect x="30" y="304.0" width="110" height="97.0" rx="5" fill="#F1E2D3"/><text x="85" y="365.0" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">30%</text><text x="154" y="351.0" text-anchor="start" font-size="24" font-weight="800" fill="#A85F29">期末</text><text x="154" y="377.0" text-anchor="start" font-size="16" font-weight="600" fill="#163D40">選擇＋專題或補救</text><path d="M148 395 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="424" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">高度依配分比例</text></g>
</svg>
