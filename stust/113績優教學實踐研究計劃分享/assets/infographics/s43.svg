<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">主文引用、參考書目與另檔附件的對照檢查</title><desc id="desc">主文引用、參考書目與另檔附件的對照檢查。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">引用 ↔ 書目</text><g transform="translate(83.4 95.4) scale(1.4)"><path d="M10 3 H30 L40 13 V45 H10 Z M30 3 V14 H40 M17 22 H33 M17 29 H33 M17 36 H28" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(249.4 95.4) scale(1.4)"><path d="M24 11 Q13 3 3 9 V39 Q13 33 24 41 Q35 33 45 39 V9 Q35 3 24 11 V41 M9 16 L17 17 M31 17 L39 16 M9 23 L17 24 M31 24 L39 23" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M162.0 115 H237.0" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M237.0 146 H162.0" fill="none" stroke="#A85F29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><text x="200.0" y="235" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">逐筆雙向核對</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">漏列、未用，都要查清楚</text></g><g transform="translate(400 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">同筆與格式</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M9 4 H39 V44 H9 Z M15 16 L19 20 L26 12 M15 33 L19 37 L26 29 M30 17 H33 M30 34 H33" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">去重、統一格式</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">同一筆文獻只列一次</text></g><g transform="translate(800 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">另檔附件</text><circle cx="200.0" cy="129" r="58" fill="#F1E2D3"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M10 3 H30 L40 13 V45 H10 Z M30 3 V14 H40 M17 22 H33 M17 29 H33 M17 36 H28" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">授課計畫書另檔</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">內容要與主文一致</text></g></g></svg>
