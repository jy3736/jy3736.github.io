<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">教學經驗要接回本次研究問題</title>
<desc id="desc">113 計畫案例：累積 340 多部教學影片的經驗，但教材更新仍然耗時，因此提出研究問題：生成式 AI 能否減輕教材編寫與評量設計的負擔。這是研究問題，尚未表示已證實成效。</desc>
<defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="180" y="35" text-anchor="middle" font-size="32" font-weight="800" fill="#167C80">教學經驗</text><text x="600" y="35" text-anchor="middle" font-size="32" font-weight="800" fill="#167C80">尚未解決的困難</text><text x="1020" y="35" text-anchor="middle" font-size="32" font-weight="800" fill="#A85F29">本次研究問題</text><circle cx="180" cy="133" r="76" fill="#D5E5DF"/><rect x="114" y="95" width="40" height="32" rx="4" fill="#FFFFFF"/><path d="M129 103 L141 111 L129 119 Z" fill="#167C80"/><rect x="114" y="139" width="40" height="32" rx="4" fill="#FFFFFF"/><path d="M129 147 L141 155 L129 163 Z" fill="#167C80"/><rect x="160" y="95" width="40" height="32" rx="4" fill="#FFFFFF"/><path d="M175 103 L187 111 L175 119 Z" fill="#167C80"/><rect x="160" y="139" width="40" height="32" rx="4" fill="#FFFFFF"/><path d="M175 147 L187 155 L175 163 Z" fill="#167C80"/><rect x="206" y="95" width="40" height="32" rx="4" fill="#FFFFFF"/><path d="M221 103 L233 111 L221 119 Z" fill="#167C80"/><rect x="206" y="139" width="40" height="32" rx="4" fill="#FFFFFF"/><path d="M221 147 L233 155 L221 163 Z" fill="#167C80"/><text x="180" y="257" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">340 多部教學影片</text><text x="180" y="294" text-anchor="middle" font-size="25" font-weight="500" fill="#506764">累積了教材開發經驗</text><circle cx="600" cy="133" r="76" fill="#D5E5DF"/><g transform="translate(529.0 77.0) scale(2.0)"><path d="M10 3 H30 L40 13 V45 H10 Z M30 3 V14 H40 M17 22 H33 M17 29 H33 M17 36 H28" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="640" cy="164" r="36" fill="#F6F4EE"/><g transform="translate(607.6 131.6) scale(1.35)"><path d="M24 43 A19 19 0 1 0 24 5 A19 19 0 1 0 24 43 M24 13 V25 L33 30" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="600" y="257" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">教材更新耗時</text><text x="600" y="294" text-anchor="middle" font-size="25" font-weight="500" fill="#506764">經驗中仍有待解問題</text><circle cx="1020" cy="133" r="76" fill="#F1E2D3"/><path d="M960 90 H1080 V164 H960 Z M1004 164 V185 M1036 164 V185 M991 185 H1049" fill="none" stroke="#A85F29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1020" y="145" text-anchor="middle" font-size="49" font-weight="800" fill="#A85F29">AI</text><text x="1020" y="252" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">能否減輕教材編寫</text><text x="1020" y="292" text-anchor="middle" font-size="28" font-weight="800" fill="#A85F29">與評量設計的負擔？</text><path d="M292 134 H464" fill="none" stroke="#167C80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M714 134 H884" fill="none" stroke="#A85F29" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><text x="380" y="111" text-anchor="middle" font-size="23" font-weight="600" fill="#506764">找出缺口</text><text x="800" y="111" text-anchor="middle" font-size="23" font-weight="600" fill="#506764">接回本案</text></g></svg>
