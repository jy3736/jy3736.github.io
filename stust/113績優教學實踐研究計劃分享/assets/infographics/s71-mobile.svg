<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1056" role="img" aria-labelledby="title desc"><title id="title">先規劃配對比較：時間點、分析方法與效果量各自回答不同問題</title><desc id="desc">先規劃配對比較：時間點、分析方法與效果量各自回答不同問題。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="34" text-anchor="middle" font-size="31" font-weight="800" fill="#167C80">兩個時間點</text><path d="M144.0 128 H256.0" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="144.0" cy="128" r="26" fill="#D5E5DF"/><text x="144.0" y="137" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">1</text><circle cx="256.0" cy="128" r="26" fill="#D5E5DF"/><text x="256.0" y="137" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">2</text><text x="200.0" y="233" text-anchor="middle" font-size="30" font-weight="800" fill="#163D40">配對 t 檢定</text><text x="200.0" y="278" text-anchor="middle" font-size="23" font-weight="600" fill="#506764">第 3→4 階段：5.23 → 5.74</text></g><g transform="translate(0 368)"><text x="200.0" y="34" text-anchor="middle" font-size="31" font-weight="800" fill="#167C80">三次以上</text><path d="M93.5 128 H306.5" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="93.5" cy="128" r="26" fill="#D5E5DF"/><text x="93.5" y="137" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">1</text><circle cx="164.5" cy="128" r="26" fill="#D5E5DF"/><text x="164.5" y="137" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">2</text><circle cx="235.5" cy="128" r="26" fill="#D5E5DF"/><text x="235.5" y="137" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">3</text><circle cx="306.5" cy="128" r="26" fill="#D5E5DF"/><text x="306.5" y="137" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">4</text><text x="200.0" y="233" text-anchor="middle" font-size="30" font-weight="800" fill="#163D40">重複量數分析</text><text x="200.0" y="278" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">四階段：F = 5.789，p = .001</text></g><g transform="translate(0 736)"><text x="200.0" y="34" text-anchor="middle" font-size="31" font-weight="800" fill="#A85F29">變化多大</text><circle cx="200.0" cy="128" r="69" fill="#F1E2D3"/><text x="200.0" y="144" text-anchor="middle" font-size="32" font-weight="800" fill="#A85F29">d = 0.55</text><text x="200.0" y="233" text-anchor="middle" font-size="30" font-weight="800" fill="#163D40">效果量</text><text x="200.0" y="278" text-anchor="middle" font-size="23" font-weight="600" fill="#506764">第 3→4 階段・中等（報告值）</text></g></g></svg>
