<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">計畫書的章節架構</title>
  <desc id="desc">章節先定位，內容再對齊；一；主持人；教學經驗與關聯；二；執行內容；動機、設計、研究；成果・文獻・附件；依樣板安排計畫書</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">章節先定位，內容再對齊</text><path d="M70 76 H291 L331 116 V355 H70 Z" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M291 76 V116 H331" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="151" text-anchor="middle" font-size="24" font-weight="700" fill="#167C80">一</text><text x="150" y="151" text-anchor="start" font-size="27" font-weight="800" fill="#163D40">主持人</text><text x="150" y="184" text-anchor="start" font-size="21" font-weight="500" fill="#506764">教學經驗與關聯</text><text x="106" y="252" text-anchor="middle" font-size="24" font-weight="700" fill="#167C80">二</text><text x="150" y="252" text-anchor="start" font-size="27" font-weight="800" fill="#163D40">執行內容</text><text x="150" y="285" text-anchor="start" font-size="21" font-weight="500" fill="#506764">動機、設計、研究</text><path d="M94 204 H306" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="329" text-anchor="middle" font-size="23" font-weight="700" fill="#A85F29">成果・文獻・附件</text><path d="M148 389 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">依樣板安排計畫書</text></g>
