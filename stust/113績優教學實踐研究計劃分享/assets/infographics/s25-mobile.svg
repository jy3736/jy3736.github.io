<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1424" role="img" aria-labelledby="title desc"><title id="title">計畫動機要寫到這門課的實際缺口</title><desc id="desc">計畫動機要寫到這門課的實際缺口。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">現象</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M24 22 A7 7 0 1 0 24 8 A7 7 0 1 0 24 22 M12 43 V37 Q12 28 24 28 Q36 28 36 37 V43 M7 25 A5 5 0 1 0 7 15 M41 25 A5 5 0 1 1 41 15 M3 32 V42 M45 32 V42" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">動機低、成就低</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">看見這群學生</text></g><path d="M200 324 V356" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><g transform="translate(0 368)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">依據</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M5 5 V43 H45 M13 34 V27 M24 34 V19 M35 34 V10" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">動機問卷＋觀察</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">資料支持現象</text></g><path d="M200 692 V724" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><g transform="translate(0 736)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">已試過</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M5 10 H43 V37 H5 Z M19 37 V43 M29 37 V43 M14 43 H34 M12 19 L17 24 L12 29 M25 29 H34" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">SPI 專題＋AI 組員</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">前期嘗試，仍有不足</text></g><path d="M200 1060 V1092" fill="none" stroke="#A85F29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><g transform="translate(0 1104)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">仍有缺口</text><circle cx="200.0" cy="129" r="58" fill="#F1E2D3"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M24 23 A8 8 0 1 0 24 7 A8 8 0 1 0 24 23 M8 43 V38 Q8 28 24 28 Q40 28 40 38 V43" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">仍有學生放棄</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">教師無力逐一照顧</text></g></g></svg>
