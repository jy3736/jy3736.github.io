<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">四個人數有不同用途，不推定41與39差異的原因</title><desc id="desc">四個人數有不同用途，不推定41與39差異的原因。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="150.0" y="34" text-anchor="middle" font-size="29" font-weight="800" fill="#167C80">預估修課</text><text x="150.0" y="173" text-anchor="middle" font-size="88" font-weight="800" fill="#167C80">30</text><text x="150.0" y="236" text-anchor="middle" font-size="26" font-weight="500" fill="#506764">人</text><path d="M102.0 260 H198.0" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="150.0" y="293" text-anchor="middle" font-size="26" font-weight="700" fill="#163D40">授課計畫書</text></g><g transform="translate(300 0)"><text x="150.0" y="34" text-anchor="middle" font-size="29" font-weight="800" fill="#167C80">實際參與</text><text x="150.0" y="173" text-anchor="middle" font-size="88" font-weight="800" fill="#167C80">51</text><text x="150.0" y="236" text-anchor="middle" font-size="26" font-weight="500" fill="#506764">人</text><path d="M102.0 260 H198.0" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="150.0" y="293" text-anchor="middle" font-size="26" font-weight="700" fill="#163D40">課程參與人數</text></g><g transform="translate(600 0)"><text x="150.0" y="34" text-anchor="middle" font-size="29" font-weight="800" fill="#167C80">完成四輪量表</text><text x="150.0" y="173" text-anchor="middle" font-size="88" font-weight="800" fill="#167C80">41</text><text x="150.0" y="236" text-anchor="middle" font-size="26" font-weight="500" fill="#506764">人</text><path d="M102.0 260 H198.0" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="150.0" y="293" text-anchor="middle" font-size="26" font-weight="700" fill="#163D40">主要分析樣本</text></g><g transform="translate(900 0)"><text x="150.0" y="34" text-anchor="middle" font-size="29" font-weight="800" fill="#A85F29">統計檢定有效</text><text x="150.0" y="173" text-anchor="middle" font-size="88" font-weight="800" fill="#A85F29">39</text><text x="150.0" y="236" text-anchor="middle" font-size="26" font-weight="500" fill="#506764">人</text><path d="M102.0 260 H198.0" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="150.0" y="293" text-anchor="middle" font-size="26" font-weight="700" fill="#163D40">重複量數分析</text></g></g></svg>
