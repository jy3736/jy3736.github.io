<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">同一道難度坡，基礎不同感受不同，學生期待中間階段任務</title>
  <desc id="desc">同一道坡，兩種感受；起點；Toy-Processor；中間階段；的任務；基礎好：；激發投入；基礎弱：；壓力過大；虛線：學生期待的階梯</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">同一道坡，兩種感受</text><path d="M36 346 H130 L270 136 H364" fill="none" stroke="#163D40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="330" text-anchor="middle" font-size="20" font-weight="600" fill="#506764">起點</text><text x="316" y="120" text-anchor="middle" font-size="21" font-weight="800" fill="#A85F29">Toy-Processor</text><path d="M130 346 H177 V276 H224 V206 H270 V136" fill="none" stroke="#A85F29" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/><text x="290" y="276" text-anchor="middle" font-size="24" font-weight="800" fill="#A85F29">中間階段</text><text x="290" y="310" text-anchor="middle" font-size="24" font-weight="800" fill="#A85F29">的任務</text><text x="100" y="196" text-anchor="middle" font-size="21" font-weight="800" fill="#167C80">基礎好：</text><text x="100" y="224" text-anchor="middle" font-size="20" font-weight="600" fill="#163D40">激發投入</text><text x="100" y="262" text-anchor="middle" font-size="21" font-weight="800" fill="#A85F29">基礎弱：</text><text x="100" y="290" text-anchor="middle" font-size="20" font-weight="600" fill="#163D40">壓力過大</text><path d="M148 371 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="400" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">虛線：學生期待的階梯</text></g>
