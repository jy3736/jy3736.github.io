<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">文獻有三種處理：留、縮、補，依用途並列選擇</title><desc id="desc">文獻有三種處理：留、縮、補，依用途並列選擇。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="50" text-anchor="middle" font-size="42" font-weight="800" fill="#167C80">留</text><circle cx="200.0" cy="137" r="56" fill="#D5E5DF"/><g transform="translate(161.6 98.6) scale(1.6)"><path d="M9 4 H39 V44 H9 Z M15 16 L19 20 L26 12 M15 33 L19 37 L26 29 M30 17 H33 M30 34 H33" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="248" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">支撐做法或評量</text><text x="200.0" y="299" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">情境動機</text><text x="200.0" y="337" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">支撐問卷選擇</text></g><g transform="translate(400 0)"><text x="200.0" y="50" text-anchor="middle" font-size="42" font-weight="800" fill="#167C80">縮</text><circle cx="200.0" cy="137" r="56" fill="#D5E5DF"/><path d="M170.0 119 H230.0 M170.0 137 H215.0 M170.0 155 H200.0" fill="none" stroke="#167C80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="200.0" y="248" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">只是背景介紹</text><text x="200.0" y="299" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">CS50 故事</text><text x="200.0" y="337" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">縮成一兩句</text></g><g transform="translate(800 0)"><text x="200.0" y="50" text-anchor="middle" font-size="42" font-weight="800" fill="#A85F29">補</text><circle cx="200.0" cy="137" r="56" fill="#F1E2D3"/><g transform="translate(161.6 98.6) scale(1.6)"><path d="M20 34 A14 14 0 1 0 20 6 A14 14 0 1 0 20 34 M30 30 L44 44" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="248" text-anchor="middle" font-size="29" font-weight="800" fill="#163D40">缺少適用的依據</text><text x="200.0" y="299" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">遊戲式學習</text><text x="200.0" y="337" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">補大學課程研究</text></g></g></svg>
