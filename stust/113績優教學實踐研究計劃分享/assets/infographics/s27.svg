<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">送件前把工具、時點、比較與研究問題寫清楚</title><desc id="desc">送件前把工具、時點、比較與研究問題寫清楚。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="150.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">用什麼測</text><circle cx="150.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(109.2 88.2) scale(1.7)"><path d="M9 4 H39 V44 H9 Z M15 16 L19 20 L26 12 M15 33 L19 37 L26 29 M30 17 H33 M30 34 H33" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">前後測／SIMS</text><text x="150.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">每種工具各有用途</text></g><path d="M226.0 129 H374.0" fill="none" stroke="#167C80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><g transform="translate(300 0)"><text x="150.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">何時測</text><circle cx="150.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(109.2 88.2) scale(1.7)"><path d="M24 43 A19 19 0 1 0 24 5 A19 19 0 1 0 24 43 M24 13 V25 L33 30" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">開課、第 9／18 週</text><text x="150.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">對準教學階段</text></g><path d="M526.0 129 H674.0" fill="none" stroke="#167C80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><g transform="translate(600 0)"><text x="150.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">怎麼比</text><circle cx="150.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(109.2 88.2) scale(1.7)"><path d="M5 5 V43 H45 M13 34 V27 M24 34 V19 M35 34 V10" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">配對比較＋效果量</text><text x="150.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">同一批學生前後比</text></g><path d="M826.0 129 H974.0" fill="none" stroke="#A85F29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><g transform="translate(900 0)"><text x="150.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">回答哪題</text><circle cx="150.0" cy="129" r="58" fill="#F1E2D3"/><g transform="translate(109.2 88.2) scale(1.7)"><path d="M4 6 H44 V33 H20 L9 43 V33 H4 Z M12 15 H36 M12 23 H29" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="150.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">比較對應研究問題</text><text x="150.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">送件前就先寫清楚</text></g></g></svg>
