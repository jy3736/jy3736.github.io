<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">從分析輸出撰寫結果段落</title><desc id="desc">要求依已算結果寫約兩百字說明，先限制不能宣稱證明有效，也不能加入未計算內容；數字須逐一核對。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">把算過的結果，寫成有界線的說明</text><rect x="24" y="112" width="196" height="83" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="122" y="162" text-anchor="middle" font-size="23" font-weight="600" fill="#163D40">已核對的分析輸出</text><path d="M230 154 H299" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="312" y="112" width="224" height="83" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="424" y="142" text-anchor="middle" font-size="28" font-weight="600" fill="#163D40">約 200 字</text><text x="424" y="181" text-anchor="middle" font-size="25" font-weight="600" fill="#167C80">結果段落</text><rect x="30" y="241" width="500" height="106" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="281" text-anchor="middle" font-size="28" font-weight="600" fill="#AD672E">不寫「證明有效」</text><text x="280" y="324" text-anchor="middle" font-size="26" font-weight="600" fill="#AD672E">不加沒有計算過的內容</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">每個數字，都要對回原來的分析輸出</text></g></svg>