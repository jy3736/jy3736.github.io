<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">生成式 AI 同時帶來機會與風險</title>
  <desc id="desc">AI 帶來兩面；機會；即時回饋；降低挫折；風險；依賴工具；落差擴大；同一個工具；所以三個問題都要問</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">AI 帶來兩面</text><path d="M60 176 L340 176" fill="none" stroke="#163D40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 176 V312" fill="none" stroke="#163D40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 312 H250" fill="none" stroke="#163D40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="26" y="190" width="160" height="124" rx="8" fill="#D5E5DF"/><text x="106" y="232" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">機會</text><text x="106" y="266" text-anchor="middle" font-size="21" font-weight="600" fill="#163D40">即時回饋</text><text x="106" y="294" text-anchor="middle" font-size="21" font-weight="600" fill="#163D40">降低挫折</text><rect x="214" y="190" width="160" height="124" rx="8" fill="#F1E2D3"/><text x="294" y="232" text-anchor="middle" font-size="28" font-weight="800" fill="#A85F29">風險</text><text x="294" y="266" text-anchor="middle" font-size="21" font-weight="600" fill="#163D40">依賴工具</text><text x="294" y="294" text-anchor="middle" font-size="21" font-weight="600" fill="#163D40">落差擴大</text><text x="200" y="136" text-anchor="middle" font-size="30" font-weight="800" fill="#163D40">同一個工具</text><path d="M148 371 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="400" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">所以三個問題都要問</text></g>
</svg>
