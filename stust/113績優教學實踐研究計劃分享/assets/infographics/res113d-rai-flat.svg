<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">相對自主指數由 3.431 到 3.553，p = .677</title>
  <desc id="desc">指數幾乎沒動；3.431；第 3 次；3.553；第 4 次；只有 +0.12；p = .677；沒動，不等於沒變化</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">指數幾乎沒動</text><path d="M40 190 H360" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="112" cy="186" r="13" fill="#167C80"/><text x="112" y="150" text-anchor="middle" font-size="31" font-weight="800" fill="#167C80">3.431</text><text x="112" y="232" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">第 3 次</text><circle cx="288" cy="186" r="13" fill="#167C80"/><text x="288" y="150" text-anchor="middle" font-size="31" font-weight="800" fill="#167C80">3.553</text><text x="288" y="232" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">第 4 次</text><path d="M126 185 H274" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><rect x="56" y="272" width="288" height="74" rx="8" fill="#F1E2D3"/><text x="200" y="304" text-anchor="middle" font-size="27" font-weight="800" fill="#A85F29">只有 +0.12</text><text x="200" y="334" text-anchor="middle" font-size="23" font-weight="600" fill="#163D40">p = .677</text><path d="M148 375 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="404" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">沒動，不等於沒變化</text></g>
