  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">同一套系統，用到期末</text><rect x="30" y="150" width="204.3170731707317" height="86" rx="5" fill="#D5E5DF"/><text x="133.65853658536585" y="204" text-anchor="middle" font-size="34" font-weight="800" fill="#167C80">25</text><text x="133.65853658536585" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#167C80">平時</text><rect x="237.3170731707317" y="150" width="30.170731707317074" height="86" rx="5" fill="#B5CAC3"/><text x="253.90243902439025" y="204" text-anchor="middle" font-size="22" font-weight="800" fill="#163D40">4</text><text x="253.90243902439025" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#163D40">期中</text><rect x="270.4878048780488" y="150" width="96.51219512195122" height="86" rx="5" fill="#F1E2D3"/><text x="320.2439024390244" y="204" text-anchor="middle" font-size="34" font-weight="800" fill="#A85F29">12</text><text x="320.2439024390244" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#A85F29">期末</text><text x="200" y="108" text-anchor="middle" font-size="30" font-weight="800" fill="#163D40">41 個批閱項目</text><text x="200" y="326" text-anchor="middle" font-size="23" font-weight="600" fill="#506764">即時回饋・測試結果</text><path d="M148 365 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="394" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">寬度依題數比例</text></g>
