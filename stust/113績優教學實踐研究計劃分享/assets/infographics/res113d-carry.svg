<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">可以帶走的四件事，講師歸納</title>
  <desc id="desc">可以帶走的四件事；1；先分階段放進 AI；2；讓學生有得選；3；好壞消息一起看；4；每題對回證據；細節請依自己的課調整</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">可以帶走的四件事</text><circle cx="62" cy="96" r="24" fill="#167C80"/><text x="62" y="106" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">1</text><rect x="98" y="64" width="276" height="64" rx="8" fill="#D5E5DF"/><text x="236" y="106" text-anchor="middle" font-size="24" font-weight="700" fill="#163D40">先分階段放進 AI</text><circle cx="62" cy="178" r="24" fill="#167C80"/><text x="62" y="188" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">2</text><rect x="98" y="146" width="276" height="64" rx="8" fill="#D5E5DF"/><text x="236" y="188" text-anchor="middle" font-size="24" font-weight="700" fill="#163D40">讓學生有得選</text><circle cx="62" cy="260" r="24" fill="#167C80"/><text x="62" y="270" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">3</text><rect x="98" y="228" width="276" height="64" rx="8" fill="#D5E5DF"/><text x="236" y="270" text-anchor="middle" font-size="24" font-weight="700" fill="#163D40">好壞消息一起看</text><circle cx="62" cy="342" r="24" fill="#167C80"/><text x="62" y="352" text-anchor="middle" font-size="26" font-weight="800" fill="#fff">4</text><rect x="98" y="310" width="276" height="64" rx="8" fill="#D5E5DF"/><text x="236" y="352" text-anchor="middle" font-size="24" font-weight="700" fill="#163D40">每題對回證據</text><path d="M148 389 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">細節請依自己的課調整</text></g>
</svg>
