<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">第 3 到第 4 次正向構面與動機缺乏都升高</title>
  <desc id="desc">兩張圖要一起看；第 3 次 → 第 4 次；正向三構面；動機缺乏；升高；也升高；只放左邊：「動機提升」；兩邊都放，才看得全</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">兩張圖要一起看</text><text x="200" y="76" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">第 3 次 → 第 4 次</text><rect x="30" y="96" width="160" height="220" rx="8" fill="#D5E5DF"/><rect x="210" y="96" width="160" height="220" rx="8" fill="#F1E2D3"/><path d="M110 276 V146" fill="none" stroke="#167C80" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M290 276 V146" fill="none" stroke="#A85F29" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><text x="110" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#167C80">正向三構面</text><text x="290" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#A85F29">動機缺乏</text><text x="110" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#167C80">升高</text><text x="290" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#A85F29">也升高</text><text x="200" y="362" text-anchor="middle" font-size="22" font-weight="700" fill="#167C80">只放左邊：「動機提升」</text><text x="200" y="396" text-anchor="middle" font-size="23" font-weight="800" fill="#163D40">兩邊都放，才看得全</text></g>
</svg>
