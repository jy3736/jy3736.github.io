<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">前期與本次計畫的三項差異</title>
  <desc id="desc">前後並排，差異才清楚；過去計畫；本次計畫；研究主題；主題差異；現場問題；問題差異；成效評估；評估差異；延續或深化時，明列三個面向</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">前後並排，差異才清楚</text><g transform="translate(66.4 67.4) scale(1.15)"><path d="M10 3 H30 L40 13 V45 H10 Z M30 3 V14 H40 M17 22 H33 M17 29 H33 M17 36 H28" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(278.4 67.4) scale(1.15)"><path d="M10 3 H30 L40 13 V45 H10 Z M30 3 V14 H40 M17 22 H33 M17 29 H33 M17 36 H28" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="94" y="153" text-anchor="middle" font-size="25" font-weight="700" fill="#167C80">過去計畫</text><text x="306" y="153" text-anchor="middle" font-size="25" font-weight="700" fill="#A85F29">本次計畫</text><text x="94" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">研究主題</text><text x="306" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">主題差異</text><path d="M163 207 H232" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="94" y="278" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">現場問題</text><text x="306" y="278" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">問題差異</text><path d="M163 270 H232" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="94" y="341" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">成效評估</text><text x="306" y="341" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">評估差異</text><path d="M163 333 H232" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M148 389 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">延續或深化時，明列三個面向</text></g>
