<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1056" role="img" aria-labelledby="title desc"><title id="title">總指數不變仍要拆開構面、檢查分布與研究限制</title><desc id="desc">總指數不變仍要拆開構面、檢查分布與研究限制。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="34" text-anchor="middle" font-size="31" font-weight="800" fill="#167C80">總指數</text><text x="200.0" y="111" text-anchor="middle" font-size="31" font-weight="700" fill="#506764">RAI</text><text x="200.0" y="183" text-anchor="middle" font-size="42" font-weight="800" fill="#163D40">3.45 → 3.47</text><text x="200.0" y="242" text-anchor="middle" font-size="24" font-weight="500" fill="#506764">第一 → 第四階段</text><text x="200.0" y="291" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">幾乎沒變</text></g><g transform="translate(0 368)"><text x="200.0" y="34" text-anchor="middle" font-size="31" font-weight="800" fill="#167C80">拆開構面</text><text x="175.0" y="133" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">內在動機</text><path d="M305.0 147 V91" fill="none" stroke="#167C80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="175.0" y="218" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">動機缺乏</text><path d="M305.0 232 V176" fill="none" stroke="#A85F29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><text x="200.0" y="291" text-anchor="middle" font-size="27" font-weight="800" fill="#A85F29">可能互相抵銷</text></g><g transform="translate(0 736)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">再往下看</text><circle cx="200.0" cy="129" r="58" fill="#F1E2D3"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M20 34 A14 14 0 1 0 20 6 A14 14 0 1 0 20 34 M30 30 L44 44" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">分布・配對・效果量</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">限制與變化一起交代</text></g></g></svg>
