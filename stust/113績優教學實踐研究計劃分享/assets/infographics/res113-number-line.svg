<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">在同一條尺上比較 HDLBits 指定 71 與 6/8 檢核的平均、中位數、最高</title>
  <desc id="desc">指定量，落在全班哪裡；0；指定 71；平均 62；中位 72；最高 114；橘色：6/8 檢核；中位數，只比指定量多一點</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">指定量，落在全班哪裡</text><path d="M40 200 H369" fill="none" stroke="#163D40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="232" text-anchor="middle" font-size="19" font-weight="600" fill="#506764">0</text><path d="M232 116 V200" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="232" cy="200" r="9" fill="#167C80"/><text x="232" y="104" text-anchor="middle" font-size="25" font-weight="800" fill="#167C80">指定 71</text><circle cx="207" cy="200" r="8" fill="#A85F29"/><path d="M207 208 V248" fill="none" stroke="#A85F29" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="213" y="272" text-anchor="end" font-size="23" font-weight="700" fill="#A85F29">平均 62</text><circle cx="234" cy="200" r="8" fill="#A85F29"/><path d="M234 208 V296" fill="none" stroke="#A85F29" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="234" y="320" text-anchor="middle" font-size="23" font-weight="700" fill="#A85F29">中位 72</text><circle cx="348" cy="200" r="8" fill="#A85F29"/><path d="M348 208 V248" fill="none" stroke="#A85F29" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="334" y="272" text-anchor="middle" font-size="23" font-weight="700" fill="#A85F29">最高 114</text><text x="200" y="366" text-anchor="middle" font-size="21" font-weight="600" fill="#A85F29">橘色：6/8 檢核</text><path d="M148 387 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="416" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">中位數，只比指定量多一點</text></g>
</svg>
