<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">以教學目的保留C或Python兩條路</title><desc id="desc">並列研究者考慮的兩種教學取向，不表示已選定語言或比較優劣。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">依學習目的，保留語言選擇</text><rect x="77" y="104" width="406" height="65" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="146" text-anchor="middle" font-size="28" font-weight="600" fill="#163D40">基礎程式設計</text><path d="M280 169 V202" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M140 202 H420" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M140 202 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="22" y="240" width="236" height="105" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="140" y="280" text-anchor="middle" font-size="29" font-weight="600" fill="#163D40">C 語言</text><text x="140" y="321" text-anchor="middle" font-size="25" font-weight="600" fill="#167C80">貼近硬體</text><path d="M420 202 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="302" y="240" width="236" height="105" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="420" y="280" text-anchor="middle" font-size="29" font-weight="600" fill="#163D40">Python</text><text x="420" y="321" text-anchor="middle" font-size="25" font-weight="600" fill="#167C80">貼近演算法</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">兩種都有可能，課要教什麼由自己定</text></g></svg>