<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc"><title id="title">預期成果要分清可交付產出與待觀察的效果</title><desc id="desc">預期成果要分清可交付產出與待觀察的效果。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="285.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">可交付的產出</text><circle cx="285.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(244.2 88.2) scale(1.7)"><path d="M10 3 H30 L40 13 V45 H10 Z M30 3 V14 H40 M17 22 H33 M17 29 H33 M17 36 H28" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="285.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">教材・系統・分析報告</text><text x="285.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">結案時有實體成果可核對</text></g><g transform="translate(630 0)"><text x="285.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">需要觀察的效果</text><circle cx="285.0" cy="129" r="58" fill="#F1E2D3"/><g transform="translate(240.0 93.0) scale(1.5)"><path d="M5 5 V43 H45 M13 34 V27 M24 34 V19 M35 34 V10" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="330.0" y="128" text-anchor="middle" font-size="39" font-weight="800" fill="#A85F29">?</text><text x="285.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">動機提升？負擔減輕？</text><text x="285.0" y="280" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">成效須由資料判斷</text></g></g></svg>
