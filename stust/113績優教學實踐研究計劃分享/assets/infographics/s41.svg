<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">行動研究：具體交代狀況、觀察依據與調整</title><desc id="desc">行動研究：具體交代狀況、觀察依據與調整。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">看到什麼</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M4 6 H44 V33 H20 L9 43 V33 H4 Z M12 15 H36 M12 23 H29" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">卡住、時間太趕</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">學生出現挫折</text></g><path d="M276.0 129 H524.0" fill="none" stroke="#167C80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><g transform="translate(400 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">怎麼知道</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M20 34 A14 14 0 1 0 20 6 A14 14 0 1 0 20 34 M30 30 L44 44" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">教師與助教觀察</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">課堂過程留下依據</text></g><path d="M676.0 129 H924.0" fill="none" stroke="#A85F29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><g transform="translate(800 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">改了什麼</text><circle cx="200.0" cy="129" r="58" fill="#F1E2D3"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M5 10 H43 V37 H5 Z M19 37 V43 M29 37 V43 M14 43 H34 M12 19 L17 24 L12 29 M25 29 H34" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">輔導、調降任務量</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">持續觀察與調整</text></g><path d="M1076.0 129 H1191 V313 H9 V129 H124.0" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)" stroke-dasharray="6 7"/></g></svg>
