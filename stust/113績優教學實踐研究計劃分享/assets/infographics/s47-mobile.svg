<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1086" role="img" aria-labelledby="title desc"><title id="title">研究結論須與證據相稱：動機數值、分散程度與未列出的工作時數</title><desc id="desc">研究結論須與證據相稱：動機數值、分散程度與未列出的工作時數。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">動機變了嗎？</text><circle cx="200.0" cy="125" r="58" fill="#D5E5DF"/><g transform="translate(159.2 84.2) scale(1.7)"><path d="M5 5 V43 H45 M13 34 V27 M24 34 V19 M35 34 V10" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="237" text-anchor="middle" font-size="37" font-weight="800" fill="#163D40">5.23 → 5.74</text><text x="200.0" y="286" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">內在動機・d = 0.55</text></g><g transform="translate(0 378)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">分數更分散？</text><text x="70.0" y="93" text-anchor="start" font-size="21" font-weight="500" fill="#506764">第 3 階段</text><rect x="70.0" y="106" width="151.04895104895107" height="24" rx="2" fill="#167C80"/><text x="235.04895104895107" y="128" text-anchor="start" font-size="24" font-weight="800" fill="#167C80">1.08</text><text x="70.0" y="165" text-anchor="start" font-size="21" font-weight="500" fill="#506764">第 4 階段</text><rect x="70.0" y="178" width="200.0" height="24" rx="2" fill="#A85F29"/><text x="284.0" y="200" text-anchor="start" font-size="24" font-weight="800" fill="#A85F29">1.43</text><text x="200.0" y="252" text-anchor="middle" font-size="27" font-weight="800" fill="#163D40">動機缺乏的標準差</text><text x="200.0" y="293" text-anchor="middle" font-size="24" font-weight="600" fill="#506764">分散程度增加</text></g><g transform="translate(0 756)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">負擔減輕了嗎？</text><circle cx="200.0" cy="125" r="58" fill="#F1E2D3"/><g transform="translate(159.2 84.2) scale(1.7)"><path d="M10 3 H30 L40 13 V45 H10 Z M30 3 V14 H40 M17 22 H33 M17 29 H33 M17 36 H28" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="237" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">未列教材日誌時數</text><text x="200.0" y="286" text-anchor="middle" font-size="23" font-weight="700" fill="#A85F29">僅教師自述，證據不足</text></g></g></svg>
