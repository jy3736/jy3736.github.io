e" font-size="24" font-weight="700" fill="#A85F29">貢獻</text><text x="331" y="318" text-anchor="middle" font-size="21" font-weight="500" fill="#506764">成果的影響</text><path d="M148 389 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">都要是計畫期間可完成的工作</text></g>
