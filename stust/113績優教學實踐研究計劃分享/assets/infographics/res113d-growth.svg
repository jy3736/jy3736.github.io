<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">第 3 到第 4 次平均增幅：動機缺乏 15.6%、內在 9.7%、認同 8.2%、外在 4.8%，長度依比例</title>
  <desc id="desc">誰漲得最多；動機缺乏；+15.6%；內在動機；+9.7%；認同調節；+8.2%；外在調節；+4.8%；長度依增幅比例</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">誰漲得最多</text><text x="40" y="82" text-anchor="start" font-size="24" font-weight="800" fill="#A85F29">動機缺乏</text><rect x="40" y="94" width="249.6" height="34" rx="4" fill="#F1E2D3"/><text x="295.6" y="121" text-anchor="start" font-size="24" font-weight="800" fill="#A85F29">+15.6%</text><text x="40" y="168" text-anchor="start" font-size="24" font-weight="800" fill="#167C80">內在動機</text><rect x="40" y="180" width="155.2" height="34" rx="4" fill="#D5E5DF"/><text x="201.2" y="207" text-anchor="start" font-size="24" font-weight="800" fill="#167C80">+9.7%</text><text x="40" y="254" text-anchor="start" font-size="24" font-weight="800" fill="#167C80">認同調節</text><rect x="40" y="266" width="131.2" height="34" rx="4" fill="#D5E5DF"/><text x="177.2" y="293" text-anchor="start" font-size="24" font-weight="800" fill="#167C80">+8.2%</text><text x="40" y="340" text-anchor="start" font-size="24" font-weight="800" fill="#506764">外在調節</text><rect x="40" y="352" width="76.8" height="34" rx="4" fill="#B5CAC3"/><text x="122.8" y="379" text-anchor="start" font-size="24" font-weight="800" fill="#506764">+4.8%</text><path d="M148 397 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="426" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">長度依增幅比例</text></g>
</svg>
