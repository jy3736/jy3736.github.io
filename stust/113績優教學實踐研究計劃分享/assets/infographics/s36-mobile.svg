<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1464" role="img" aria-labelledby="title desc"><title id="title">活教材的更新循環：蒐集、補寫、上線、分層</title><desc id="desc">活教材的更新循環：蒐集、補寫、上線、分層。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">蒐集回饋</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M4 6 H44 V33 H20 L9 43 V33 H4 Z M12 15 H36 M12 23 H29" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">觀察・提問・小測</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">更新有依據</text></g><path d="M200 334 V366" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><g transform="translate(0 378)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">補寫教材</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M10 3 H30 L40 13 V45 H10 Z M30 3 V14 H40 M17 22 H33 M17 29 H33 M17 36 H28" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">AI 起草，教師檢查</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">說明與範例一起補</text></g><path d="M200 712 V744" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><g transform="translate(0 756)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">下次課前上線</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M24 43 A19 19 0 1 0 24 5 A19 19 0 1 0 24 43 M24 13 V25 L33 30" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">補進 Notion 教材</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">有明確的更新時限</text></g><path d="M200 1090 V1122" fill="none" stroke="#A85F29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><g transform="translate(0 1134)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">分層使用</text><circle cx="200.0" cy="129" r="58" fill="#F1E2D3"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M24 22 A7 7 0 1 0 24 8 A7 7 0 1 0 24 22 M12 43 V37 Q12 28 24 28 Q36 28 36 37 V43 M7 25 A5 5 0 1 0 7 15 M41 25 A5 5 0 1 1 41 15 M3 32 V42 M45 32 V42" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">補充／延伸題</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">不同程度各取所需</text></g><path d="M287 1273 H390 V129 H276" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)" stroke-dasharray="6 7"/></g></svg>
