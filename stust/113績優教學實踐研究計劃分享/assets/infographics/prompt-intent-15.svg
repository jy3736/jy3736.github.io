<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">將五個文獻主題組成有主線的大綱</title><desc id="desc">主題形成章節主線，再展開五節子題與每節兩三段的規劃；內容仍須閱讀原文後才能撰寫。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">把五個主題，串成一個論述故事</text><rect x="15" y="108" width="180" height="226" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="105" y="144" text-anchor="middle" font-size="27" font-weight="600" fill="#163D40">五個主題</text><circle cx="105" cy="174" r="11" fill="#167C80"/><circle cx="105" cy="203" r="11" fill="#167C80"/><circle cx="105" cy="232" r="11" fill="#167C80"/><circle cx="105" cy="261" r="11" fill="#167C80"/><circle cx="105" cy="290" r="11" fill="#167C80"/><path d="M205 220 H257" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="273" y="106" width="270" height="52" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="408" y="140" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">文獻探討主題</text><path d="M292 158 V332" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M292 180 H316" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="331" y="188" text-anchor="start" font-size="22" font-weight="600" fill="#163D40">第 1 節・子題與段落</text><path d="M292 215 H316" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="331" y="223" text-anchor="start" font-size="22" font-weight="600" fill="#163D40">第 2 節・子題與段落</text><path d="M292 250 H316" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="331" y="258" text-anchor="start" font-size="22" font-weight="600" fill="#163D40">第 3 節・子題與段落</text><path d="M292 285 H316" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="331" y="293" text-anchor="start" font-size="22" font-weight="600" fill="#163D40">第 4 節・子題與段落</text><path d="M292 320 H316" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="331" y="328" text-anchor="start" font-size="22" font-weight="600" fill="#163D40">第 5 節・子題與段落</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">大綱有主線，每節還要讀原文才能寫</text></g></svg>