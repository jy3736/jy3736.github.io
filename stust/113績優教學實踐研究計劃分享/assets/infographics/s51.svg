<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc"><title id="title">113申請規劃的課程檢核與持續記錄，不當成實際SIMS施測週次</title><desc id="desc">113申請規劃的課程檢核與持續記錄，不當成實際SIMS施測週次。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">第 1 週</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M9 4 H39 V44 H9 Z M15 16 L19 20 L26 12 M15 33 L19 37 L26 29 M30 17 H33 M30 34 H33" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">基礎知識測驗</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">了解先備知識</text></g><path d="M276.0 129 H524.0" fill="none" stroke="#167C80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><g transform="translate(400 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">第 9 週／期中</text><circle cx="200.0" cy="129" r="58" fill="#D5E5DF"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M24 43 A19 19 0 1 0 24 5 A19 19 0 1 0 24 43 M24 13 V25 L33 30" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">期中測驗、規劃問卷</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">實際問卷日期待核對</text></g><path d="M676.0 129 H924.0" fill="none" stroke="#A85F29" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><g transform="translate(800 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">第 18 週／期末</text><circle cx="200.0" cy="129" r="58" fill="#F1E2D3"/><g transform="translate(159.2 88.2) scale(1.7)"><path d="M10 3 H30 L40 13 V45 H10 Z M30 3 V14 H40 M17 22 H33 M17 29 H33 M17 36 H28" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="235" text-anchor="middle" font-size="28" font-weight="800" fill="#163D40">實作／展示與彙整</text><text x="200.0" y="280" text-anchor="middle" font-size="23" font-weight="500" fill="#506764">問卷、自評未必同日收</text></g><path d="M66 310 H1134" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="337" text-anchor="middle" font-size="23" font-weight="700" fill="#167C80">依進度：形成性評量（原估約 10 次）</text><text x="600" y="372" text-anchor="middle" font-size="23" font-weight="600" fill="#506764">每週規劃：教材開發日誌</text></g></svg>
