<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">具體修正標題用詞與適用範圍</title><desc id="desc">研究者指出臺灣用語與跨電子電機資工的範圍要求，再請AI濃縮標題。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">用詞與範圍，都由研究者校準</text><rect x="15" y="109" width="185" height="74" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="108" y="155" text-anchor="middle" font-size="26" font-weight="600" fill="#AD672E">寫碼</text><path d="M211 146 H290" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="304" y="109" width="241" height="74" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="424" y="155" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">臺灣常用說法</text><rect x="15" y="208" width="185" height="74" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="108" y="254" text-anchor="middle" font-size="26" font-weight="600" fill="#AD672E">電子工程</text><path d="M211 245 H290" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="304" y="208" width="241" height="74" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="424" y="254" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">資電科系</text><text x="280" y="331" text-anchor="middle" font-size="26" font-weight="600" fill="#167C80">意思對準後，再請 AI 縮短標題</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">給具體修改依據，最後仍由自己決定</text></g></svg>