<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">三項結果各自對應下一輪教學調整</title>
  <desc id="desc">反思，從結果長出來；看到的結果；下一輪調整；動機缺乏升高；期中診斷；學生差距變大；難度階梯；每週壓力過大；專題拆小；每一項調整，都接回證據</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">反思，從結果長出來</text><text x="100" y="92" text-anchor="middle" font-size="24" font-weight="700" fill="#167C80">看到的結果</text><text x="300" y="92" text-anchor="middle" font-size="24" font-weight="700" fill="#A85F29">下一輪調整</text><text x="100" y="157" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">動機缺乏升高</text><path d="M185 149 H222" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="300" y="157" text-anchor="middle" font-size="25" font-weight="800" fill="#A85F29">期中診斷</text><text x="100" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">學生差距變大</text><path d="M185 227 H222" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="300" y="235" text-anchor="middle" font-size="25" font-weight="800" fill="#A85F29">難度階梯</text><text x="100" y="313" text-anchor="middle" font-size="23" font-weight="700" fill="#163D40">每週壓力過大</text><path d="M185 305 H222" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><text x="300" y="313" text-anchor="middle" font-size="25" font-weight="800" fill="#A85F29">專題拆小</text><path d="M52 363 H347" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="394" text-anchor="middle" font-size="23" font-weight="700" fill="#167C80">每一項調整，都接回證據</text></g>
</svg>
