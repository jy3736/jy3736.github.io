  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">三種分析，三個問題</text><rect x="30" y="62" width="340" height="92" rx="10" fill="#D5E5DF"/><text x="200" y="100" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">ANOVA</text><text x="200" y="134" text-anchor="middle" font-size="22" font-weight="600" fill="#163D40">四次，整體有變嗎</text><rect x="30" y="172" width="340" height="92" rx="10" fill="#D5E5DF"/><text x="200" y="210" text-anchor="middle" font-size="28" font-weight="800" fill="#167C80">配對 t</text><text x="200" y="244" text-anchor="middle" font-size="22" font-weight="600" fill="#163D40">第 3→4 次，差多少</text><rect x="30" y="282" width="340" height="92" rx="10" fill="#F1E2D3"/><text x="200" y="320" text-anchor="middle" font-size="28" font-weight="800" fill="#A85F29">Cohen’s d</text><text x="200" y="354" text-anchor="middle" font-size="22" font-weight="600" fill="#163D40">差距實質有多大</text><path d="M148 387 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="416" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">方法跟著問題走</text></g>
