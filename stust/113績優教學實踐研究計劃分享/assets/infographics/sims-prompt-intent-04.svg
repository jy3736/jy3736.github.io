<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">要求分析輸出與假設檢查</title><desc id="desc">對指定樣本做重複量數分析，同時要求F值p值效果量及球形假設檢查；圖示分析要求，不代表已證明教學有效。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">指定分析，也要求檢查假設</text><rect x="41" y="105" width="478" height="67" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="147" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">依提問指定的完整配對樣本分析</text><path d="M280 172 V202" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="115" y="211" width="330" height="68" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="253" text-anchor="middle" font-size="27" font-weight="600" fill="#163D40">重複量數變異數分析</text><path d="M280 279 V295" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M143 295 H417" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M143 295 V314" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="18" y="321" width="250" height="43" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="143" y="350" text-anchor="middle" font-size="24" font-weight="600" fill="#167C80">F、p、效果量</text><path d="M417 295 V314" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="292" y="321" width="250" height="43" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="417" y="350" text-anchor="middle" font-size="24" font-weight="600" fill="#167C80">球形假設／校正</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">報告方法與校正，假資料不作成效結論</text></g></svg>