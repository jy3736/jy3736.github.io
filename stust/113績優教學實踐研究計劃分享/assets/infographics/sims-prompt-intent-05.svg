<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">比較三段配對差異</title><desc id="desc">比較一對九週、九對十八週與一對十八週的配對差異，同時要求多重比較校正與效果量。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">整體有差之後，再找哪兩次不同</text><rect x="11" y="108" width="142" height="62" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="82" y="149" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">第 1 週</text><rect x="209" y="108" width="142" height="62" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="149" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">第 9 週</text><rect x="407" y="108" width="142" height="62" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="478" y="149" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">第 18 週</text><rect x="11" y="238" width="166" height="73" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="94" y="284" text-anchor="middle" font-size="27" font-weight="600" fill="#167C80">1 ↔ 9</text><rect x="197" y="238" width="166" height="73" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="284" text-anchor="middle" font-size="27" font-weight="600" fill="#167C80">9 ↔ 18</text><rect x="383" y="238" width="166" height="73" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="466" y="284" text-anchor="middle" font-size="27" font-weight="600" fill="#167C80">1 ↔ 18</text><text x="280" y="217" text-anchor="middle" font-size="24" font-weight="600" fill="#163D40">三組配對比較＋多重校正＋效果量</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">寫明樣本人數，也寫明效果量的算法</text></g></svg>