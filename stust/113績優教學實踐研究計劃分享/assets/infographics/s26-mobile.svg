<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 768" role="img" aria-labelledby="title desc"><title id="title">對照111與113案例：問題要具體到課程、卡點與依據</title><desc id="desc">對照111與113案例：問題要具體到課程、卡點與依據。本圖為依原投影片整理的寫作示例，不新增成效結論。</desc><defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><g transform="translate(0 0)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">111｜問題太籠統</text><circle cx="200.0" cy="145" r="66" fill="#D5E5DF"/><g transform="translate(152.0 97.0) scale(2.0)"><path d="M4 6 H44 V33 H20 L9 43 V33 H4 Z M12 15 H36 M12 23 H29" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200.0" y="257" text-anchor="middle" font-size="34" font-weight="800" fill="#163D40">提升學習興趣</text><text x="200.0" y="306" text-anchor="middle" font-size="26" font-weight="600" fill="#506764">換哪門課都成立</text></g><path d="M200 364 V396" fill="none" stroke="#A85F29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><g transform="translate(0 408)"><text x="200.0" y="34" text-anchor="middle" font-size="30" font-weight="800" fill="#A85F29">113｜具體到課堂</text><g transform="translate(22.6 89.6) scale(0.85)"><path d="M4 6 H44 V31 H4 Z M11 15 H25 M11 23 H35 M24 31 V43 M16 43 H32" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="97" text-anchor="start" font-size="22" font-weight="600" fill="#506764">哪門課</text><text x="83" y="134" text-anchor="start" font-size="28" font-weight="800" fill="#163D40">數位系統設計實務</text><g transform="translate(22.6 187.6) scale(0.85)"><path d="M5 10 H43 V37 H5 Z M19 37 V43 M29 37 V43 M14 43 H34 M12 19 L17 24 L12 29 M25 29 H34" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="195" text-anchor="start" font-size="22" font-weight="600" fill="#506764">卡在哪</text><text x="83" y="232" text-anchor="start" font-size="28" font-weight="800" fill="#163D40">舊專題不適用</text><g transform="translate(22.6 285.6) scale(0.85)"><path d="M5 5 V43 H45 M13 34 V27 M24 34 V19 M35 34 V10" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="83" y="293" text-anchor="start" font-size="22" font-weight="600" fill="#506764">怎麼知道</text><text x="83" y="330" text-anchor="start" font-size="28" font-weight="800" fill="#163D40">動機問卷＋課堂觀察</text></g></g></svg>
