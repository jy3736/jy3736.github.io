  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">把舊知識接到新語法</text><rect x="26" y="110" width="136" height="92" rx="8" fill="#D5E5DF"/><text x="94" y="148" text-anchor="middle" font-size="25" font-weight="800" fill="#167C80">學過的</text><text x="94" y="180" text-anchor="middle" font-size="20" font-weight="600" fill="#163D40">電路、布林</text><rect x="238" y="110" width="136" height="92" rx="8" fill="#F1E2D3"/><text x="306" y="148" text-anchor="middle" font-size="25" font-weight="800" fill="#A85F29">新語言</text><text x="306" y="180" text-anchor="middle" font-size="20" font-weight="600" fill="#163D40">Verilog</text><path d="M64 288 Q200 186 336 288" fill="none" stroke="#167C80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 288 H360" fill="none" stroke="#163D40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M116 256 V288" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 240 V288" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 236 V288" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M240 240 V288" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M284 256 V288" fill="none" stroke="#B5CAC3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="332" text-anchor="middle" font-size="30" font-weight="800" fill="#167C80">並排對照</text><text x="200" y="368" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">是連接兩邊的橋</text></g>
