<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">用並排對照把學過的電路接到新語言 Verilog</title>
  <desc id="desc">把舊知識接到新語法；學過的；電路、布林；新語言；Verilog；並排對照；是連接兩邊的橋</desc>
