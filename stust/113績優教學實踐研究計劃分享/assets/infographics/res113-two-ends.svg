<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">每個階段同時往挑戰與支撐兩端照顧</title>
  <desc id="desc">同一階段，往兩端照顧；一；二、三；四；往前一步：給挑戰；多點支撐：接住</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">同一階段，往兩端照顧</text><path d="M56 230 H348" fill="none" stroke="#163D40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M90 218 V106" fill="none" stroke="#A85F29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><path d="M90 242 V354" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><circle cx="90" cy="230" r="8" fill="#163D40"/><text x="104" y="222" text-anchor="start" font-size="18" font-weight="700" fill="#163D40">一</text><path d="M190 218 V106" fill="none" stroke="#A85F29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><path d="M190 242 V354" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><circle cx="190" cy="230" r="8" fill="#163D40"/><text x="204" y="222" text-anchor="start" font-size="18" font-weight="700" fill="#163D40">二、三</text><path d="M296 218 V106" fill="none" stroke="#A85F29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#gold-arrow)"/><path d="M296 242 V354" fill="none" stroke="#167C80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><circle cx="296" cy="230" r="8" fill="#163D40"/><text x="310" y="222" text-anchor="start" font-size="18" font-weight="700" fill="#163D40">四</text><text x="200" y="86" text-anchor="middle" font-size="24" font-weight="800" fill="#A85F29">往前一步：給挑戰</text><text x="200" y="390" text-anchor="middle" font-size="24" font-weight="800" fill="#167C80">多點支撐：接住</text></g>
</svg>
