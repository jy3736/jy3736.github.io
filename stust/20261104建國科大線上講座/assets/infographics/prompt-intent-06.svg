<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">用背景換取問題方法與標題</title><desc id="desc">以先前討論為輸入，請AI統整問題、方法與參考標題；未提供證據的問題仍是待確認假設。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">先給足背景，再請 AI 統整</text><rect x="60" y="106" width="440" height="77" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="151" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">自己的想法・課堂觀察・問題</text><path d="M280 183 V215" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M95 215 H465" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M95 215 V244" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="12" y="253" width="166" height="100" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="95" y="291" text-anchor="middle" font-size="29" font-weight="600" fill="#163D40">問題</text><text x="95" y="327" text-anchor="middle" font-size="23" font-weight="600" fill="#167C80">想探索什麼</text><path d="M280 215 V244" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="197" y="253" width="166" height="100" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="291" text-anchor="middle" font-size="29" font-weight="600" fill="#163D40">方法</text><text x="280" y="327" text-anchor="middle" font-size="23" font-weight="600" fill="#167C80">如何檢驗</text><path d="M465 215 V244" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="382" y="253" width="166" height="100" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="465" y="291" text-anchor="middle" font-size="29" font-weight="600" fill="#163D40">標題</text><text x="465" y="327" text-anchor="middle" font-size="23" font-weight="600" fill="#167C80">怎麼概括</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">AI 整理的問題，仍要用課堂證據核對</text></g></svg>