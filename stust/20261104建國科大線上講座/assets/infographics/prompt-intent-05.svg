<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">說清楚想保留的核心能力</title><desc id="desc">以看懂運算邏輯為核心，連結演算法、資料結構與硬體；這是教學理念，仍要轉成可觀察與評量的目標。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">先定義 AI 時代仍要學的能力</text><rect x="47" y="107" width="466" height="95" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="148" text-anchor="middle" font-size="28" font-weight="600" fill="#163D40">看懂 C 描述的運算邏輯</text><text x="280" y="181" text-anchor="middle" font-size="22" font-weight="600" fill="#167C80">研究者想保留的核心能力</text><path d="M280 202 V239" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M99 239 H461" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M99 239 V271" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="17" y="280" width="164" height="67" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="99" y="323" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">演算法</text><path d="M280 239 V271" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="198" y="280" width="164" height="67" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="323" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">資料結構</text><path d="M461 239 V271" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="379" y="280" width="164" height="67" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="461" y="323" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">硬體運作</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">下一步：變成看得到、評得到的目標</text></g></svg>