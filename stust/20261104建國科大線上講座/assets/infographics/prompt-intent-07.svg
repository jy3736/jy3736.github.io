<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">用口述重新檢查問題與標題</title><desc id="desc">將既有書面內容改為口述，協助研究者換用聽覺檢查表述；不表示增加證據或更動研究內容。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">換一個管道，聽出不順的地方</text><rect x="25" y="111" width="190" height="118" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="120" y="153" text-anchor="middle" font-size="28" font-weight="600" fill="#163D40">書面內容</text><text x="120" y="193" text-anchor="middle" font-size="24" font-weight="600" fill="#167C80">問題＋標題</text><path d="M220 170 H296" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><circle cx="402" cy="170" r="83" fill="#D5E5DF"/><path d="M351 160.0 V180.0" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M371 148.5 V191.5" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M391 138.0 V202.0" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M411 153.0 V187.0" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M431 143.5 V196.5" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M451 158.5 V181.5" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="402" y="281" text-anchor="middle" font-size="28" font-weight="600" fill="#167C80">請 AI 口述</text><text x="280" y="327" text-anchor="middle" font-size="27" font-weight="600" fill="#163D40">問題清楚嗎？　標題順口嗎？</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">換成聽的，再檢查一次表述</text></g></svg>