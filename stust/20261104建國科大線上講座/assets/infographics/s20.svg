<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">研究程序與資料蒐集時點</title>
  <desc id="desc">把資料蒐集排進流程；準備；選工具、排時點；實施；教學與蒐集資料；完成；分析、撰寫報告；教學與蒐集時點一起安排</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">把資料蒐集排進流程</text><path d="M77 93 V339" fill="none" stroke="#167C80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="77" cy="103" r="13" fill="#167C80"/><text x="119" y="102" text-anchor="start" font-size="28" font-weight="800" fill="#163D40">準備</text><text x="119" y="136" text-anchor="start" font-size="22" font-weight="500" fill="#506764">選工具、排時點</text><circle cx="77" cy="214" r="13" fill="#A85F29"/><text x="119" y="213" text-anchor="start" font-size="28" font-weight="800" fill="#163D40">實施</text><text x="119" y="247" text-anchor="start" font-size="22" font-weight="500" fill="#506764">教學與蒐集資料</text><circle cx="77" cy="325" r="13" fill="#167C80"/><text x="119" y="324" text-anchor="start" font-size="28" font-weight="800" fill="#163D40">完成</text><text x="119" y="358" text-anchor="start" font-size="22" font-weight="500" fill="#506764">分析、撰寫報告</text><g transform="translate(307.0 196.0) scale(0.75)"><path d="M9 4 H39 V44 H9 Z M15 16 L19 20 L26 12 M15 33 L19 37 L26 29 M30 17 H33 M30 34 H33" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M148 389 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">教學與蒐集時點一起安排</text></g>
</svg>
