<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">縮小到基礎C語言課</title><desc id="desc">逐層縮小研究對象，呈現研究者選擇C語言的教學理由；不將語言優劣當成已查證結論。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">逐層縮小，先選一門入門課</text><rect x="30" y="104" width="500" height="225" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="142" text-anchor="middle" font-size="27" font-weight="600" fill="#167C80">程式設計課程</text><rect x="80" y="159" width="400" height="156" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="197" text-anchor="middle" font-size="27" font-weight="600" fill="#167C80">電子系・基礎入門</text><rect x="140" y="216" width="280" height="92" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="254" text-anchor="middle" font-size="27" font-weight="600" fill="#167C80">C 語言</text><text x="280" y="292" text-anchor="middle" font-size="23" font-weight="600" fill="#163D40">連結程式邏輯與硬體</text><text x="280" y="359" text-anchor="middle" font-size="24" font-weight="600" fill="#167C80">說出選課與選語言的理由</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">這是選擇理由，技術比較仍待查證</text></g></svg>