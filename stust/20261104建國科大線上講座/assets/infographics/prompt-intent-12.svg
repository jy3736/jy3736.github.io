<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">列出文獻搜尋方向</title><desc id="desc">由研究問題展開20個候選文獻主題，下一步由研究者篩選；主題與關鍵字還不是已讀文獻。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">先展開搜尋方向，再由自己篩選</text><rect x="20" y="119" width="186" height="136" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="113" y="163" text-anchor="middle" font-size="27" font-weight="600" fill="#163D40">研究問題</text><text x="113" y="203" text-anchor="middle" font-size="23" font-weight="600" fill="#167C80">想理解什麼</text><path d="M216 185 H277" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><circle cx="319" cy="129" r="13" fill="#D5E5DF"/><circle cx="361" cy="129" r="13" fill="#D5E5DF"/><circle cx="403" cy="129" r="13" fill="#D5E5DF"/><circle cx="445" cy="129" r="13" fill="#D5E5DF"/><circle cx="487" cy="129" r="13" fill="#D5E5DF"/><circle cx="319" cy="171" r="13" fill="#D5E5DF"/><circle cx="361" cy="171" r="13" fill="#D5E5DF"/><circle cx="403" cy="171" r="13" fill="#D5E5DF"/><circle cx="445" cy="171" r="13" fill="#D5E5DF"/><circle cx="487" cy="171" r="13" fill="#D5E5DF"/><circle cx="319" cy="213" r="13" fill="#D5E5DF"/><circle cx="361" cy="213" r="13" fill="#D5E5DF"/><circle cx="403" cy="213" r="13" fill="#D5E5DF"/><circle cx="445" cy="213" r="13" fill="#D5E5DF"/><circle cx="487" cy="213" r="13" fill="#D5E5DF"/><circle cx="319" cy="255" r="13" fill="#D5E5DF"/><circle cx="361" cy="255" r="13" fill="#D5E5DF"/><circle cx="403" cy="255" r="13" fill="#D5E5DF"/><circle cx="445" cy="255" r="13" fill="#D5E5DF"/><circle cx="487" cy="255" r="13" fill="#D5E5DF"/><text x="403" y="329" text-anchor="middle" font-size="27" font-weight="600" fill="#167C80">20 個候選主題</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">這是搜尋方向，還不是文獻證據</text></g></svg>