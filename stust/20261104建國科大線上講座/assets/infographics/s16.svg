<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">從課堂觀察收斂為可回答的研究問題</title>
  <desc id="desc">把課堂現象收斂成問題；現場觀察；課堂發生了什麼；問題意識；還有哪些缺口；研究問題；能用資料回答；問題要具體，也要能回答</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">把課堂現象收斂成問題</text><path d="M44.0 70 H356.0 L335.0 148 H65.0 Z" fill="#D5E5DF"/><text x="200" y="101" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">現場觀察</text><text x="200" y="132" text-anchor="middle" font-size="21" font-weight="500" fill="#506764">課堂發生了什麼</text><path d="M200 153 V165" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M75.0 173 H325.0 L304.0 251 H96.0 Z" fill="#D5E5DF"/><text x="200" y="204" text-anchor="middle" font-size="26" font-weight="800" fill="#167C80">問題意識</text><text x="200" y="235" text-anchor="middle" font-size="21" font-weight="500" fill="#506764">還有哪些缺口</text><path d="M200 256 V268" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><path d="M106.0 276 H294.0 L273.0 354 H127.0 Z" fill="#F1E2D3"/><text x="200" y="307" text-anchor="middle" font-size="26" font-weight="800" fill="#A85F29">研究問題</text><text x="200" y="338" text-anchor="middle" font-size="21" font-weight="500" fill="#506764">能用資料回答</text><path d="M148 389 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">問題要具體，也要能回答</text></g>
</svg>
