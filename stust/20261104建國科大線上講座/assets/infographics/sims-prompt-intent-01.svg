<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">先檢查資料，不讓AI猜著改</title><desc id="desc">先提供資料結構與題號對應，檢查缺漏、超出範圍與重複代碼；錯誤由老師回原始表單核對。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">先交代資料，再檢查錯誤</text><rect x="45" y="102" width="470" height="72" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="128" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">學生代碼 × 三次施測 × 16 題</text><text x="280" y="163" text-anchor="middle" font-size="22" font-weight="600" fill="#167C80">先說清楚：題號如何對應構面</text><path d="M280 174 V204" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M99 204 H461" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M99 204 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="17" y="239" width="164" height="69" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="99" y="282" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">缺漏</text><path d="M280 204 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="198" y="239" width="164" height="69" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="282" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">超出範圍</text><path d="M461 204 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="379" y="239" width="164" height="69" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="461" y="282" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">重複代碼</text><text x="280" y="350" text-anchor="middle" font-size="24" font-weight="600" fill="#167C80">AI 標出問題 → 老師回原始表單確認</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">先檢查、不分析，也不讓 AI 自己改數字</text></g></svg>