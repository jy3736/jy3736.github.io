<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">挑五項附關鍵字以便檢索原文</title><desc id="desc">依研究標題與問題篩選主題，再用關鍵字到資料庫檢索；實際回覆未提供要求的評分理由。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">依標題與問題，篩出必要主題</text><circle cx="38" cy="123" r="9" fill="#D5E5DF"/><circle cx="66" cy="123" r="9" fill="#D5E5DF"/><circle cx="94" cy="123" r="9" fill="#D5E5DF"/><circle cx="122" cy="123" r="9" fill="#D5E5DF"/><circle cx="150" cy="123" r="9" fill="#D5E5DF"/><circle cx="38" cy="151" r="9" fill="#D5E5DF"/><circle cx="66" cy="151" r="9" fill="#D5E5DF"/><circle cx="94" cy="151" r="9" fill="#D5E5DF"/><circle cx="122" cy="151" r="9" fill="#D5E5DF"/><circle cx="150" cy="151" r="9" fill="#D5E5DF"/><circle cx="38" cy="179" r="9" fill="#D5E5DF"/><circle cx="66" cy="179" r="9" fill="#D5E5DF"/><circle cx="94" cy="179" r="9" fill="#D5E5DF"/><circle cx="122" cy="179" r="9" fill="#D5E5DF"/><circle cx="150" cy="179" r="9" fill="#D5E5DF"/><circle cx="38" cy="207" r="9" fill="#D5E5DF"/><circle cx="66" cy="207" r="9" fill="#D5E5DF"/><circle cx="94" cy="207" r="9" fill="#D5E5DF"/><circle cx="122" cy="207" r="9" fill="#D5E5DF"/><circle cx="150" cy="207" r="9" fill="#D5E5DF"/><text x="94" y="251" text-anchor="middle" font-size="24" font-weight="600" fill="#167C80">20 項</text><path d="M178 164 L280 201 L178 238" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="280" y="132" text-anchor="middle" font-size="24" font-weight="600" fill="#167C80">標題＋三個問題</text><path d="M292 201 H333" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><circle cx="357" cy="201" r="15" fill="#167C80"/><circle cx="395" cy="201" r="15" fill="#167C80"/><circle cx="433" cy="201" r="15" fill="#167C80"/><circle cx="471" cy="201" r="15" fill="#167C80"/><circle cx="509" cy="201" r="15" fill="#167C80"/><text x="433" y="251" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">5 項＋關鍵字</text><rect x="68" y="284" width="424" height="68" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="326" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">到論文資料庫檢索、閱讀原文</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">要追問：為何選這五項？評分理由呢？</text></g></svg>