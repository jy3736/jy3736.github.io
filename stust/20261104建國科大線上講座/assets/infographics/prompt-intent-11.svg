<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">從背景收斂三個研究問題</title><desc id="desc">三個問題的共同要求是連結現象探究與檢驗方法；圖中不替研究者捏造具體問題或已收集資料。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">把先前討論，收斂成可探究的問題</text><rect x="42" y="103" width="476" height="67" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="145" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">標題＋自己的背景、理念與觀察</text><path d="M280 170 V198" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M94 198 H466" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M94 198 V226" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><circle cx="94" cy="268" r="47" fill="#D5E5DF"/><text x="94" y="277" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">問題 1</text><path d="M280 198 V226" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><circle cx="280" cy="268" r="47" fill="#D5E5DF"/><text x="280" y="277" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">問題 2</text><path d="M466 198 V226" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><circle cx="466" cy="268" r="47" fill="#D5E5DF"/><text x="466" y="277" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">問題 3</text><text x="280" y="349" text-anchor="middle" font-size="24" font-weight="600" fill="#167C80">每題：現象 → 想問什麼 → 如何檢驗</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">方法不能只寫教學實驗，還要想資料</text></g></svg>