<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">交代教學背景與調整需求</title><desc id="desc">既有教學經驗與研究者對AI的觀察匯入課程調整問題，仍需補上學生實際困難。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">交代背景，提出課程調整需求</text><rect x="18" y="110" width="246" height="100" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="141" y="150" text-anchor="middle" font-size="27" font-weight="600" fill="#163D40">多年教程式設計</text><text x="141" y="187" text-anchor="middle" font-size="23" font-weight="600" fill="#167C80">C／Java／Python…</text><rect x="296" y="110" width="246" height="100" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="419" y="150" text-anchor="middle" font-size="27" font-weight="600" fill="#AD672E">AI 加入寫程式</text><text x="419" y="187" text-anchor="middle" font-size="23" font-weight="600" fill="#AD672E">研究者觀察到改變</text><path d="M141 210 V244 H280" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M419 210 V244 H280" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M280 244 V272" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="53" y="280" width="454" height="74" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="326" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">我的程式設計課，可以怎麼改？</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">還要補：學生現在卡在哪裡？</text></g></svg>