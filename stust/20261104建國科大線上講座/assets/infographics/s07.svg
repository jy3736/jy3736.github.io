<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc">
  <title id="title">計畫動機的推進層次</title>
  <desc id="desc">從課堂現象，說明研究動機；觀察到什麼；從自己的課堂開始；想解決什麼；交代問題與背景；為什麼重要；說明影響與價值；讀者要看得出這門課的實際困難</desc>
  <defs><marker id="teal-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs>
  <g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="30" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">從課堂現象，說明研究動機</text><circle cx="61" cy="101" r="30" fill="#D5E5DF"/><g transform="translate(39.879999999999995 79.88) scale(0.88)"><path d="M20 34 A14 14 0 1 0 20 6 A14 14 0 1 0 20 34 M30 30 L44 44" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="113" y="98" text-anchor="start" font-size="26" font-weight="800" fill="#163D40">觀察到什麼</text><text x="113" y="131" text-anchor="start" font-size="21" font-weight="500" fill="#506764">從自己的課堂開始</text><path d="M61 139 V169" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><circle cx="61" cy="208" r="30" fill="#D5E5DF"/><g transform="translate(39.879999999999995 186.88) scale(0.88)"><path d="M4 6 H44 V33 H20 L9 43 V33 H4 Z M12 15 H36 M12 23 H29" fill="none" stroke="#167C80" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="113" y="205" text-anchor="start" font-size="26" font-weight="800" fill="#163D40">想解決什麼</text><text x="113" y="238" text-anchor="start" font-size="21" font-weight="500" fill="#506764">交代問題與背景</text><path d="M61 246 V276" fill="none" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal-arrow)"/><circle cx="61" cy="315" r="30" fill="#F1E2D3"/><g transform="translate(39.879999999999995 293.88) scale(0.88)"><path d="M15 31 Q14 26 10 22 A16 16 0 1 1 38 22 Q34 26 33 31 Z M16 37 H32 M19 43 H29" fill="none" stroke="#A85F29" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="113" y="312" text-anchor="start" font-size="26" font-weight="800" fill="#A85F29">為什麼重要</text><text x="113" y="345" text-anchor="start" font-size="21" font-weight="500" fill="#506764">說明影響與價值</text><path d="M148 389 H252" fill="none" stroke="#B5CAC3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="418" text-anchor="middle" font-size="22" font-weight="600" fill="#506764">讀者要看得出這門課的實際困難</text></g>
