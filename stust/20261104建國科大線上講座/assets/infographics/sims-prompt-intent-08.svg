<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">用審查視角檢查分析限制</title><desc id="desc">以研究設計資料測量及樣本缺漏檢查可能限制；AI的通用建議須由老師結合自己的課程與研究問題判斷。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">換審查視角，找出三個待補處</text><rect x="111" y="104" width="338" height="65" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="146" text-anchor="middle" font-size="28" font-weight="600" fill="#163D40">請 AI 扮審查委員</text><path d="M280 169 V205" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M94 205 H466" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M94 205 V233" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="10" y="243" width="168" height="102" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="94" y="282" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">研究設計</text><text x="94" y="322" text-anchor="middle" font-size="21" font-weight="600" fill="#167C80">能推論到哪裡</text><path d="M280 205 V233" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="196" y="243" width="168" height="102" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="282" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">資料與測量</text><text x="280" y="322" text-anchor="middle" font-size="21" font-weight="600" fill="#167C80">還缺什麼證據</text><path d="M466 205 V233" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="382" y="243" width="168" height="102" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="466" y="282" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">樣本與缺漏</text><text x="466" y="322" text-anchor="middle" font-size="21" font-weight="600" fill="#167C80">如何交代限制</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">AI 提醒一般限制，課程情境要自己補</text></g></svg>