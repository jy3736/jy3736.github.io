<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">指定查找方向，回原文核對</title><desc id="desc">以計畫名稱、主管機關與主要目的三項線索指定查找方向；原對話 AI 回覆未附來源，需回官方文件核對。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167C80"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, sans-serif"><text x="22" y="31" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="76" text-anchor="middle" font-size="28" font-weight="600" fill="#163D40">把查找方向說清楚</text><rect x="10" y="92" width="174" height="82" rx="15" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="97" y="124" text-anchor="middle" font-size="22" font-weight="600" fill="#167C80">計畫名稱</text><text x="97" y="156" text-anchor="middle" font-size="24" font-weight="600" fill="#163D40">教學實踐研究</text><rect x="194" y="92" width="151" height="82" rx="15" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="269" y="124" text-anchor="middle" font-size="22" font-weight="600" fill="#167C80">主管機關</text><text x="269" y="156" text-anchor="middle" font-size="24" font-weight="600" fill="#163D40">臺灣教育部</text><rect x="355" y="92" width="195" height="82" rx="15" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="452" y="124" text-anchor="middle" font-size="22" font-weight="600" fill="#167C80">想知道什麼</text><text x="452" y="156" text-anchor="middle" font-size="24" font-weight="600" fill="#163D40">計畫主要目的</text><path d="M97 174 V198 H280" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M452 174 V198 H280" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M269 174 V198" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M280 198 V224" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><rect x="92" y="230" width="376" height="82" rx="15" fill="#fff" stroke="#167C80" stroke-width="2"/><path d="M120 251 H146 V288 H120 Z M126 260 H140 M126 269 H140 M126 278 H136" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="301" y="263" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">希望查到：官方文件</text><text x="301" y="295" text-anchor="middle" font-size="23" font-weight="600" fill="#167C80">徵件說明／官方簡報</text><text x="280" y="347" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">提問指定方向 ≠ 已查證</text><rect x="9" y="369" width="542" height="53" rx="15" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="403" text-anchor="middle" font-size="25" font-weight="600" fill="#AD672E">AI 未附來源 → 回官方原文核對</text></g></svg>