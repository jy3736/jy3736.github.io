<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">先開口，再補齊背景</title><desc id="desc">第一句只說目的，還沒交代計畫種類；AI 回覆因此猜測需求分析與市場研究。下一句補上計畫名稱。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167C80"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, sans-serif"><text x="22" y="31" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><rect x="70" y="54" width="420" height="69" rx="15" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="98" text-anchor="middle" font-size="26" font-weight="600" fill="#163D40">開口：想用 AI 協助計畫準備</text><path d="M280 123 V151" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrow)"/><rect x="127" y="156" width="306" height="64" rx="15" fill="#fff" stroke="#AD672E" stroke-width="2"/><text x="280" y="197" text-anchor="middle" font-size="26" font-weight="600" fill="#AD672E">缺少：哪一種計畫？</text><path d="M280 220 V237 H139 V258" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="7 6"/><path d="M280 237 H421 V258" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="7 6"/><rect x="29" y="261" width="220" height="62" rx="15" fill="#fff" stroke="#AD672E" stroke-width="2"/><text x="139" y="301" text-anchor="middle" font-size="27" font-weight="600" fill="#AD672E">需求分析？</text><rect x="311" y="261" width="220" height="62" rx="15" fill="#fff" stroke="#AD672E" stroke-width="2"/><text x="421" y="301" text-anchor="middle" font-size="27" font-weight="600" fill="#AD672E">市場研究？</text><text x="280" y="350" text-anchor="middle" font-size="23" font-weight="600" fill="#AD672E">AI 的猜測，還沒對準我的需求</text><rect x="9" y="369" width="542" height="53" rx="15" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="403" text-anchor="middle" font-size="25" font-weight="600" fill="#AD672E">下一句：補上「教學實踐研究」</text></g></svg>