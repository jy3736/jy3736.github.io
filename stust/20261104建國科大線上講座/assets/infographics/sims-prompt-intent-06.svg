<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">用人數描述分布，不揭露學生代碼</title><desc id="desc">依變化分組並回報人數；圖表示分析方向，沒有繪製假想比例或把分布當成教法的因果證據。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">平均之外，再看個別變化的分布</text><rect x="56" y="104" width="448" height="65" rx="14" fill="#D5E5DF" stroke="none" stroke-width="2"/><text x="280" y="146" text-anchor="middle" font-size="27" font-weight="600" fill="#163D40">每位學生：後測 − 前測</text><path d="M280 169 V202" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M94 202 H466" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M94 202 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="10" y="239" width="168" height="102" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="94" y="278" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">升高</text><text x="94" y="318" text-anchor="middle" font-size="25" font-weight="600" fill="#167C80">幾人？</text><path d="M280 202 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="196" y="239" width="168" height="102" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="280" y="278" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">變化較小</text><text x="280" y="318" text-anchor="middle" font-size="25" font-weight="600" fill="#167C80">幾人？</text><path d="M466 202 V230" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="382" y="239" width="168" height="102" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="466" y="278" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">下降</text><text x="466" y="318" text-anchor="middle" font-size="25" font-weight="600" fill="#167C80">幾人？</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">只報人數、不列代碼；分布不能說明原因</text></g></svg>