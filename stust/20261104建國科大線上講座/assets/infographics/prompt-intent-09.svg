<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-labelledby="title desc"><title id="title">把過大的標題承諾改成可執行的研究</title><desc id="desc">依研究者意圖，由設計教學法到實踐與可行性檢驗；尚非已驗證的成果。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#167C80"/></marker></defs><g font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="20" y="32" text-anchor="start" font-size="24" font-weight="700" fill="#167C80">這句在做什麼？</text><text x="280" y="77" text-anchor="middle" font-size="30" font-weight="600" fill="#163D40">讓標題的承諾，回到實際要做的事</text><rect x="145" y="105" width="270" height="68" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="149" text-anchor="middle" font-size="29" font-weight="600" fill="#AD672E">「變革」太大</text><path d="M280 173 V212" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="12" y="233" width="156" height="83" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="90" y="284" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">設計教學法</text><path d="M174 274 H190" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="197" y="233" width="156" height="83" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="275" y="284" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">實踐</text><path d="M359 274 H375" stroke="#167C80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#a)"/><rect x="382" y="233" width="156" height="83" rx="14" fill="#fff" stroke="#167C80" stroke-width="2"/><text x="460" y="284" text-anchor="middle" font-size="25" font-weight="600" fill="#163D40">檢驗可行性</text><text x="280" y="352" text-anchor="middle" font-size="25" font-weight="600" fill="#167C80">這是研究規劃，還不是成效結論</text><rect x="8" y="373" width="544" height="50" rx="14" fill="#F1E2D3" stroke="none" stroke-width="2"/><text x="280" y="405" text-anchor="middle" font-size="24" font-weight="600" fill="#AD672E">標題承諾，要有後續設計與證據支撐</text></g></svg>