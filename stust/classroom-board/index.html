<header><h1>教室公告板</h1><button id="wrap" aria-pressed="true" title="切換公告文字自動換行">自動換行：開</button><button id="qrToggle" aria-pressed="false" title="切換是否為網址顯示 QR Code">QR Code：關</button><label class="view-width" title="調整公告顯示區域的寬度">顯示寬度 <input id="viewWidth" type="range" min="50" max="90" step="5" value="90" aria-label="公告顯示寬度"><output id="viewWidthValue" for="viewWidth">90%</output></label><button id="smaller" aria-label="縮小公告文字">A−</button><button id="larger" aria-label="放大公告文字">A＋</button><button id="projection">全螢幕投影</button></header>
<nav class="board-bar" aria-label="公告板切換"><div id="boardTabs" class="board-tabs" role="tablist" aria-label="公告板"></div><button id="addBoard">＋ 新增公告板</button><button id="clearBoard" title="一鍵清空目前公告板的公告與草稿，可復原">清空此板</button><button id="deleteBoard" title="刪除目前公告板，可復原">刪除此板</button><button id="undoDeleteBoard" hidden>復原刪除</button><details id="exportMenu" class="export-menu"><summary title="匯出公告為獨立 HTML 檔，或匯入先前匯出的檔案">匯入／匯出</summary><div class="export-options"><button type="button" id="exportBoard">匯出此公告板</button><button type="button" id="exportAll">匯出全部公告板</button><button type="button" id="importBoards">匯入 HTML 檔…</button><input type="file" id="importFile" accept=".html,.htm,text/html" multiple hidden></div></details><label class="board-name">名稱 <input id="boardName" maxlength="40" aria-label="公告板名稱"></label></nav>
<div id="imageTools" class="image-tools" hidden><label for="imageSize">圖片大小 <input id="imageSize" type="range" min="10" max="300" step="5" value="100"><output id="imageSizeValue" for="imageSize">100%</output></label><button id="fitImage" aria-pressed="true">適合螢幕</button><button id="originalImage" aria-pressed="false">原始尺寸</button><button id="selectZoom" aria-pressed="false">框選放大</button><span class="hint">框選放大：拖出矩形 · Esc 取消 · 放大後可拖曳移動</span></div>
<main id="stage" aria-label="已發布公告"><div id="welcome"><strong>讓全班看見</strong><p>在下方輸入文字、貼上網址或加入圖片<br>按「發布」，公告就會顯示在這裡。</p></div><div id="content" hidden><div id="message" hidden></div><div id="imageViewport" tabindex="0" role="region" aria-label="圖片顯示區，可用滑鼠拖曳或上下左右捲動" hidden><img id="publishedImage" alt="老師發布的圖片" draggable="false" hidden><div id="selectionBox" aria-hidden="true" hidden></div></div></div><aside id="qrPanel" hidden><div id="qrCode"></div><strong>掃描開啟連結</strong><a id="urlLink" target="_blank" rel="noopener noreferrer"></a></aside></main>
<footer><form id="publisher"><label for="draft">編輯下一則公告</label><div class="draft-row"><textarea id="draft" placeholder="輸入文字或網址（如 example.com），也可以直接貼上圖片…"></textarea><div class="actions"><button type="submit" class="primary" id="publish">發布</button><label class="file-button">加入圖片<input type="file" id="imageFile" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/bmp"></label></div></div><div class="meta"><img id="preview" alt="待發布圖片預覽" hidden><button type="button" id="removeImage" hidden>移除草稿圖片</button><p id="status" role="status">草稿修改後，按「發布」才會更新上方公告。</p><span class="hint">⌘ / Ctrl + Enter 發布 · 圖片可直接貼上 · 重新整理會清空</span></div></form></footer><div id="toast" role="status" aria-live="polite" hidden></div>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;

// Import: newer exports carry the source in data-board; older ones are converted back from the rendered HTML.
function markdownText(text){return text.replace(/[\\`*~\[\]]/g,'\\$&');}
function markdownInline(node){
let out='';
for(const child of node.childNodes){
if(child.nodeType===Node.TEXT_NODE){out+=markdownText(child.textContent);continue;}
if(child.nodeType!==Node.ELEMENT_NODE)continue;
const tag=child.tagName.toLowerCase();
if(tag==='strong'||tag==='b')out+='**'+markdownInline(child)+'**';
else if(tag==='em'||tag==='i')out+='*'+markdownInline(child)+'*';
else if(tag==='del'||tag==='s')out+='~~'+markdownInline(child)+'~~';
else if(tag==='code')out+='`'+child.textContent+'`';
else if(tag==='a')out+='['+markdownInline(child)+']('+(child.getAttribute('href')||'')+')';
else if(tag==='br')out+='\n';
else if(!['ul','ol'].includes(tag))out+=markdownInline(child);
}
return out;
}
function protectLines(text){return text.split('\n').map(line=>line.replace(/^(\s*)([#>+-])/,'$1\\$2').replace(/^(\s*\d+)([.)])/,'$1\\$2')).join('\n');}
function markdownBlocks(element){
const blocks=[];
for(const child of element.children){
const tag=child.tagName.toLowerCase();
if(/^h[1-6]$/.test(tag))blocks.push('#'.repeat(Number(tag[1]))+' '+markdownInline(child));
else if(tag==='hr')blocks.push('---');
else if(tag==='pre')blocks.push('```\n'+child.textContent+'\n```');
else if(tag==='blockquote')blocks.push(markdownBlocks(child).split('\n').map(line=>'> '+line).join('\n'));
else if(tag==='ul'||tag==='ol'){const start=Number(child.getAttribute('start'))||1;blocks.push(Array.from(child.children).map((item,index)=>{const nested=Array.from(item.children).filter(node=>/^(ul|ol)$/i.test(node.tagName)).map(list=>markdownBlocks({children:[list]}).split('\n').map(line=>'  '+line).join('\n'));return (tag==='ul'?'- ':(start+index)+'. ')+markdownInline(item).trim()+(nested.length?'\n'+nested.join('\n'):'');}).join('\n'));}
else blocks.push(protectLines(markdownInline(child)));
}
return blocks.join('\n\n');
}
const imagePattern=/^data:image\/(?:png|jpeg|webp|gif|avif|bmp);base64,[A-Za-z0-9+/=]+$/i;
function boardsFromHtml(html){
const doc=new DOMParser().parseFromString(html,'text/html'),found=[];
for(const section of doc.querySelectorAll('main > section')){
let data=null;try{data=JSON.parse(section.dataset.board||'null');}catch{}
const message=section.querySelector(':scope > .message'),imageSrc=section.querySelector(':scope > img.image')?.getAttribute('src')||'';
const text=typeof data?.text==='string'?data.text:message?markdownBlocks(message):'';
const image=imagePattern.test(imageSrc)?imageSrc:null;
if(!text.trim()&&!image)continue;
const scale=Number(data?.scale??message?.style.getPropertyValue('--scale'));
found.push({name:String(data?.name??section.querySelector(':scope > h2')?.textContent??'').trim().slice(0,40)||'匯入的公告板',draft:'',draftImage:null,text:text.trim(),image,scale:scale>=.5&&scale<=2?scale:1,viewWidth:Math.round(Math.min(90,Math.max(50,Number(data?.viewWidth)||90))/5)*5,wrap:typeof data?.wrap==='boolean'?data.wrap:!message?.classList.contains('no-wrap'),qr:typeof data?.qr==='boolean'?data.qr:Boolean(section.querySelector(':scope > .qr')),imageScale:100,imageMode:'fit'});
}
return found;
}
async function importBoards(files){
if(!files.length)return;
if(imagePending){status('圖片載入中，請稍候再匯入。');return;}
const imported=[],failed=[];
for(const file of files){
if(file.size>100*1024*1024){failed.push(file.name);continue;}
try{const found=boardsFromHtml(await file.text());if(found.length)imported.push(...found);else failed.push(file.name);}catch{failed.push(file.name);}
}
const failure=failed.length?'無法匯入：'+failed.join('、')+'（不是教室公告板匯出的 HTML 檔，或沒有已發布的公告）。':'';
if(!imported.length){status(failure||'沒有可匯入的公告板。');return;}
saveBoard();const first=boards.length;boards.push(...imported);
undoStack.push({kind:'import',boards:imported});
showBoard(first);
status('已匯入 '+imported.length+' 個公告板，加在現有公告板之後。按「復原匯入」可移除。'+(failure?' '+failure:''));

const imageViewport=$('imageViewport');
function endImagePan(event){

function imageProblem(file){if(!/^image\/(png|jpeg|webp|gif|avif|bmp)$/i.test(file.type))return '請選擇 PNG、JPG、WebP、GIF、AVIF 或 BMP 圖片。';if(file.size>20*1024*1024)return '圖片超過 20 MB，請先縮小再加入。';return '';}
