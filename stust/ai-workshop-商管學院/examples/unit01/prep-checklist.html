<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小組報告準備清單</title><style>body{max-width:640px;margin:40px auto;padding:0 20px;background:#f7fafc;color:#18364b;font:18px/1.8 system-ui}label{display:block;padding:10px 12px;margin:8px 0;background:#fff;border:1px solid #cdd9e3;border-radius:8px;cursor:pointer}input{width:20px;height:20px;margin-right:10px;vertical-align:-3px}input:focus-visible{outline:3px solid #137f93}#status{font-size:1.25em;font-weight:700}h1{line-height:1.3}</style><h1>小組報告準備清單</h1><p>每完成一項就勾選，完成數會跟著更新；取消勾選時，完成數也會減少。</p><label><input type="checkbox"> 讀懂題目</label><label><input type="checkbox"> 整理資料</label><label><input type="checkbox"> 準備驗收</label><p id="status" role="status">已完成 0／3</p><p>僅供課堂練習使用；關閉或重新整理頁面後，勾選會回到 0／3。</p><script>document.querySelectorAll('input').forEach(function(input){input.addEventListener('change',function(){var n=document.querySelectorAll('input:checked').length;document.getElementById('status').textContent='已完成 '+n+'／3'+(n===3?'，全部完成！':'');});});</script></html>
