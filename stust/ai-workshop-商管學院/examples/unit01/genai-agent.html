<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Chat to Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;600;700&display=swap">
<style>
/* Companion to "Arkanoid Learns": same arcade look, three levels — next-token generation, reasoning, agents.
   Single deliberate dark look (arcade CRT), so no light-theme blocks. */
:root {
  color-scheme: dark;
  --ink: #0c0f24;
  --panel: #151a3a;
  --line: #2b3266;
  --fg: #e9e7f7;
  --muted: #9198c8;
  --amber: #ffb547;
  --cyan: #5fe1f2;
  --coral: #ff6b7d;
  --lime: #b4f06a;
  --violet: #a98bff;
  --font-display: "Silkscreen", "Noto Sans TC", "Courier New", monospace;
  --font-body: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", "Noto Sans TC", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; padding: 24px 16px 40px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5vw, 40px); letter-spacing: .02em; margin: 0; line-height: 1.1; text-wrap: balance; }
h1 span { color: var(--amber); }
.tag { color: var(--muted); margin: 0; max-width: 56ch; }
.head-r { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lang { font: 600 13px var(--font-body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.lang:hover { border-color: var(--amber); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* level picker + shared speed */
.topbar { grid-template-columns: minmax(0, 1fr) minmax(200px, 260px); align-items: end; }
@media (max-width: 760px) { .topbar { grid-template-columns: minmax(0, 1fr); } }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .levels { grid-template-columns: minmax(0, 1fr); } }
.lvl, .mode { font: 600 14px var(--font-body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 10px 10px; cursor: pointer; text-align: left; display: grid; gap: 2px; }
.lvl b { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--amber); font-weight: 600; }
.lvl small, .mode small { font-weight: 400; font-size: 12px; color: var(--muted); }
.lvl[aria-pressed="true"], .mode[aria-pressed="true"] { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
.lvl:hover, .mode:hover { border-color: var(--muted); }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slider { display: grid; gap: 4px; }
.slider-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); gap: 8px; }
.slider-top output { font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--amber); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--amber); margin: 0; }
.ticks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11px; color: var(--muted); gap: 8px; }

.main { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.side { display: grid; gap: 14px; min-width: 0; }
.level { display: grid; gap: 20px; }
.screen { position: relative; border: 2px solid var(--line); border-radius: 6px; background: var(--ink); overflow: hidden; min-width: 0; }
.screen-top { display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-family: var(--font-display); font-size: 12px; color: var(--muted); }
.screen-top .on { color: var(--cyan); }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 600 13px var(--font-body); color: var(--ink); background: var(--amber); border: 0; border-radius: 5px; padding: 8px 12px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.keys { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; }
.stat { display: grid; }
.stat b { font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.good { color: var(--cyan); } .bad { color: var(--coral); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }

/* LV1: chat screen */
.chatbox { display: flex; flex-direction: column; height: clamp(460px, 72vh, 620px); }
.msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msgs .empty { margin: auto; color: var(--muted); font-size: 14px; text-align: center; max-width: 30ch; }
.msg { max-width: 88%; padding: 9px 12px; border-radius: 10px; font-size: 16px; line-height: 1.65; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: color-mix(in srgb, var(--amber) 15%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 55%, transparent); border-bottom-right-radius: 3px; }
.msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
.msg.ai .who { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--cyan); letter-spacing: .08em; margin-bottom: 2px; }
.tok.seed { color: var(--fg); font-weight: 600; }
.tok.mid { color: var(--amber); }
.tok.lo { color: var(--coral); text-decoration: underline dotted; text-underline-offset: 3px; }
.tok.fresh { animation: pop .35s ease-out; }
@keyframes pop { from { background: color-mix(in srgb, var(--cyan) 40%, transparent); } to { background: transparent; } }
.caret { display: inline-block; width: .5em; height: 1em; background: var(--cyan); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.verdict { display: block; margin-top: 6px; font-size: 13px; line-height: 1.5; }
.verdict.copy { color: var(--cyan); } .verdict.novel { color: var(--coral); }
.seeds { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 13px var(--font-body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.chip:hover { border-color: var(--amber); }
.chip[aria-pressed="true"] { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
.ctx { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin: 0; overflow-wrap: anywhere; }
.ctx mark { background: color-mix(in srgb, var(--violet) 32%, transparent); color: var(--fg); border-radius: 3px; padding: 0 2px; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: minmax(4.5em, 7em) minmax(0, 1fr) 3.4em; gap: 10px; align-items: center; font: 14px var(--font-body); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; cursor: pointer; text-align: left; }
.bar:hover:not(:disabled) { border-color: var(--amber); }
.bar:disabled { cursor: default; }
.bar .w { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 10px; background: color-mix(in srgb, var(--line) 70%, transparent); border-radius: 2px; overflow: hidden; }
.bar .fill { display: block; height: 100%; background: var(--cyan); border-radius: 2px; transition: width .25s; }
.bar .pct { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.bar.picked { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 16%, transparent); }
.bar.picked .fill { background: var(--amber); }
.bars-empty { color: var(--muted); font-size: 14px; margin: 0; }
.corpus { margin: 0; padding-left: 28px; display: grid; gap: 3px; font-size: 14px; color: var(--muted); columns: 2; }
@media (max-width: 760px) { .corpus { columns: 1; } }
.corpus li { break-inside: avoid; }
.corpus li.hit { color: var(--cyan); }

/* LV2: race */
.qtext { font-size: 17px; margin: 0; }
.race { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 720px) { .race { grid-template-columns: minmax(0, 1fr); } }
.lane-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.lane-head h3 { margin: 0; font-size: 16px; }
.lane-head small { color: var(--muted); font-size: 12px; display: block; font-weight: 400; }
.count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.track2 { height: 8px; border-radius: 4px; background: var(--ink); overflow: hidden; }
.track2 i { display: block; height: 100%; width: 0; background: var(--cyan); }
.lane.slow .track2 i { background: var(--violet); }
.think { font-family: var(--font-mono); font-size: 13px; line-height: 1.6; color: var(--muted); border-left: 2px solid var(--violet); padding: 2px 0 2px 10px; white-space: pre-wrap; margin: 0; }
.think .lab { display: block; color: var(--violet); font-size: 11px; letter-spacing: .08em; }
.answer { font-size: 18px; margin: 0; min-height: 1.6em; }
.badge { font: 600 13px var(--font-body); justify-self: start; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; }
.badge.ok { color: var(--cyan); } .badge.no { color: var(--coral); }
.result { border-color: var(--amber); }
.result p { margin: 0; }

/* LV3: agent loop */
#ring { display: block; width: 100%; aspect-ratio: 1 / .82; }
.cap { border-top: 1px solid var(--line); padding: 12px 14px; min-height: 120px; display: grid; gap: 8px; align-content: start; }
.cap p { margin: 0; font-size: 15px; }
.cap code, .log code { font-family: var(--font-mono); font-size: 12.5px; color: var(--cyan); overflow-wrap: anywhere; }
.tg { font: 600 11px var(--font-mono); padding: 1px 7px; border-radius: 3px; color: var(--ink); justify-self: start; white-space: nowrap; }
.tg.think { background: var(--violet); } .tg.act { background: var(--amber); } .tg.obs { background: var(--cyan); }
.tg.err { background: var(--coral); } .tg.done { background: var(--lime); } .tg.chat { background: var(--fg); }
.ask { display: grid; gap: 8px; border: 1px dashed var(--amber); border-radius: 6px; padding: 10px 12px; }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 6px; }
.tool { border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; display: grid; font-size: 12px; color: var(--muted); transition: border-color .2s, background .2s; }
.tool b { font: 600 12.5px var(--font-mono); color: var(--fg); display: flex; justify-content: space-between; gap: 6px; }
.tool b span { color: var(--muted); font-weight: 400; }
.tool.on { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 16%, transparent); }
.files { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.files li { font-family: var(--font-mono); font-size: 13px; padding: 4px 8px; border: 1px solid transparent; border-radius: 4px; display: flex; justify-content: space-between; gap: 8px; }
.files li small { color: var(--muted); }
.files li.read { border-color: var(--cyan); background: color-mix(in srgb, var(--cyan) 10%, transparent); }
.files li.new { border-color: var(--lime); color: var(--lime); }
.files li.out { color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; max-height: 360px; overflow-y: auto; }
.log li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14px; }
.log li .tg { justify-self: stretch; text-align: center; }
.log .none { color: var(--muted); display: block; }
.task { font-size: 16px; margin: 0; }

.how { font-size: 14px; color: var(--muted); }
.how ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.how strong { color: var(--fg); font-weight: 600; }
.how code { font-family: var(--font-mono); font-size: 12.5px; color: var(--cyan); }
.how p { margin: 0; }
.cmp-wrap { overflow-x: auto; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
.cmp th, .cmp td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.cmp thead th { font-family: var(--font-mono); font-size: 12px; color: var(--amber); font-weight: 600; }
.cmp tbody th { color: var(--muted); font-weight: 600; white-space: nowrap; }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
</style>

<div class="wrap">
  <header>
    <h1 data-i18n-html="h1"></h1>
    <div class="head-r">
      <p class="tag" data-i18n="tag"></p>
      <button class="lang" id="lang" aria-label="Switch language / 切換語言">English</button>
    </div>
  </header>

  <section class="card topbar" aria-label="Levels">
    <div class="levels">
      <button class="lvl" data-lvl="1" aria-pressed="true"><b>LV 1</b><span data-i18n="lv1"></span><small data-i18n="lv1Sub"></small></button>
      <button class="lvl" data-lvl="2" aria-pressed="false"><b>LV 2</b><span data-i18n="lv2"></span><small data-i18n="lv2Sub"></small></button>
      <button class="lvl" data-lvl="3" aria-pressed="false"><b>LV 3</b><span data-i18n="lv3"></span><small data-i18n="lv3Sub"></small></button>
    </div>
    <div class="slider">
      <div class="slider-top"><label for="speed" data-i18n="speedL"></label><output id="speedOut" for="speed">1.00×</output></div>
      <input type="range" id="speed" min="-2" max="3" step="0.25" value="0">
      <div class="ticks" aria-hidden="true"><span>0.25×</span><span>1×</span><span>8×</span></div>
    </div>
  </section>

  <!-- ===== LV1: next-token generation ===== -->
  <section class="level" id="lv1">
    <div class="main">
      <div class="screen chatbox">
        <div class="screen-top"><span>MINI-GPT</span><span id="chatState"></span></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
        <div class="seeds"><p class="label" data-i18n="seedsL"></p><div class="chips" id="seeds"></div></div>
      </div>
      <div class="side">
        <section class="card" aria-labelledby="m1-h">
          <p class="label" id="m1-h" data-i18n="modeH"></p>
          <div class="modes">
            <button class="mode" id="m1-manual" aria-pressed="true"><span data-i18n="manual"></span><small data-i18n="manualSub"></small></button>
            <button class="mode" id="m1-auto" aria-pressed="false"><span data-i18n="auto"></span><small data-i18n="autoSub"></small></button>
          </div>
          <div class="slider">
            <div class="slider-top"><label for="temp" data-i18n="tempL"></label><output id="tempOut" for="temp">1.0</output></div>
            <input type="range" id="temp" min="0.1" max="2" step="0.1" value="1">
            <div class="ticks" aria-hidden="true"><span data-i18n="tempLo"></span><span data-i18n="tempHi"></span></div>
          </div>
          <div class="row">
            <button class="btn" id="step1" data-i18n="btnStep1"></button>
            <button class="btn ghost" id="clear1" data-i18n="btnClear"></button>
          </div>
          <p class="keys" id="hint1"></p>
        </section>
        <section class="card" aria-labelledby="p-h">
          <p class="label" id="p-h" data-i18n="probH"></p>
          <p class="ctx" id="ctx"></p>
          <div class="bars" id="bars"></div>
          <div class="legend"><span><i style="background:var(--fg)"></i><span data-i18n="legHi"></span></span><span><i style="background:var(--amber)"></i><span data-i18n="legMid"></span></span><span><i style="background:var(--coral)"></i><span data-i18n="legLo"></span></span></div>
        </section>
        <section class="card" aria-label="Stats">
          <div class="stats">
            <div class="stat"><b id="s1-tok">0</b><span data-i18n="s1Tok"></span></div>
            <div class="stat"><b id="s1-avg">–</b><span data-i18n="s1Avg"></span></div>
            <div class="stat"><b id="s1-ans">0</b><span data-i18n="s1Ans"></span></div>
            <div class="stat"><b id="s1-novel">0</b><span data-i18n="s1Novel"></span></div>
          </div>
        </section>
      </div>
    </div>
    <section class="card" aria-labelledby="corpus-h">
      <p class="label" id="corpus-h" data-i18n="corpusH"></p>
      <ol class="corpus" id="corpus"></ol>
      <p class="note" data-i18n="corpusNote"></p>
    </section>
  </section>

  <!-- ===== LV2: reasoning race ===== -->
  <section class="level" id="lv2" hidden>
    <section class="card" aria-labelledby="q-h">
      <p class="label" id="q-h" data-i18n="qH"></p>
      <div class="chips" id="qchips"></div>
      <p class="qtext" id="qtext"></p>
      <p class="label" data-i18n="guessH"></p>
      <div class="chips" id="guesses"></div>
      <div class="row">
        <button class="btn" id="go2"></button>
        <span class="keys" id="score2"></span>
      </div>
    </section>
    <div class="race">
      <section class="card lane fast" aria-labelledby="fast-h">
        <div class="lane-head"><h3 id="fast-h"><span data-i18n="fastT"></span><small data-i18n="fastSub"></small></h3><span class="count" id="fastCount"></span></div>
        <div class="track2"><i id="fastBar"></i></div>
        <div id="fastOut" style="display:grid;gap:10px"></div>
      </section>
      <section class="card lane slow" aria-labelledby="slow-h">
        <div class="lane-head"><h3 id="slow-h"><span data-i18n="slowT"></span><small data-i18n="slowSub"></small></h3><span class="count" id="slowCount"></span></div>
        <div class="track2"><i id="slowBar"></i></div>
        <div id="slowOut" style="display:grid;gap:10px"></div>
      </section>
    </div>
    <section class="card result" id="result2" aria-live="polite" hidden></section>
    <p class="note" data-i18n="lv2Note"></p>
  </section>

  <!-- ===== LV3: agent loop ===== -->
  <section class="level" id="lv3" hidden>
    <section class="card" aria-labelledby="task-h">
      <p class="label" id="task-h" data-i18n="taskH"></p>
      <p class="task" data-i18n="task"></p>
    </section>
    <div class="main">
      <div class="screen">
        <div class="screen-top"><span id="ringTitle"></span><span id="ringState"></span></div>
        <canvas id="ring" aria-label="Think, act, observe loop"></canvas>
        <div class="cap" id="cap" aria-live="polite"></div>
      </div>
      <div class="side">
        <section class="card" aria-labelledby="m3-h">
          <p class="label" id="m3-h" data-i18n="modeH"></p>
          <div class="modes">
            <button class="mode" id="m3-chat" aria-pressed="false"><span data-i18n="chatMode"></span><small data-i18n="chatModeSub"></small></button>
            <button class="mode" id="m3-agent" aria-pressed="true"><span data-i18n="agentMode"></span><small data-i18n="agentModeSub"></small></button>
          </div>
          <div class="row">
            <button class="btn" id="play3"></button>
            <button class="btn ghost" id="step3" data-i18n="btnStep3"></button>
            <button class="btn ghost" id="reset3" data-i18n="btnReset"></button>
          </div>
          <label class="check"><input type="checkbox" id="approve" checked> <span data-i18n="approveL"></span></label>
          <p class="keys" id="hint3"></p>
        </section>
        <section class="card" aria-label="Stats">
          <div class="stats">
            <div class="stat"><b id="s3-loops">0</b><span data-i18n="s3Loops"></span></div>
            <div class="stat"><b id="s3-tools">0</b><span data-i18n="s3Tools"></span></div>
            <div class="stat"><b id="s3-fix">0</b><span data-i18n="s3Fix"></span></div>
            <div class="stat"><b id="s3-ctx">0</b><span data-i18n="s3Ctx"></span></div>
          </div>
        </section>
        <section class="card" aria-labelledby="tools-h">
          <p class="label" id="tools-h" data-i18n="toolsH"></p>
          <div class="tools" id="tools"></div>
        </section>
        <section class="card" aria-labelledby="ws-h">
          <p class="label" id="ws-h" data-i18n="wsH"></p>

// LV1 · a tiny "longest-match" n-gram language model
// For each context length k (1..6) count which word followed. The longest
// matching context dominates; shorter ones leak in with small weight, which
// is what lets the model stitch facts from different sentences together.
// =====================================================================
const MAXK = 6, BACKOFF = 0.12;

function buildModel() {
  const sents = D().corpus.map(s => s.split(' '));

  for (const s of sents) for (let i = 0; i < s.length - 1; i++) for (let k = 1; k <= Math.min(MAXK, i + 1); k++) {
    const key = s.slice(i - k + 1, i + 1).join('\u0001');
    let m = maps[k].get(key); if (!m) maps[k].set(key, m = new Map());
    m.set(s[i + 1], (m.get(s[i + 1]) || 0) + 1);

}

  for (let k = Math.min(MAXK, ctx.length); k >= 1; k--) { const m = model.maps[k].get(ctx.slice(-k).join('\u0001')); if (m) levels.push({ k, m }); }
  if (!levels.length) return null;
  const acc = new Map(); let w = 1, ws = 0;
  for (const { m } of levels) {
    let c = 0; for (const v of m.values()) c += v;
    for (const [tok, v] of m) acc.set(tok, (acc.get(tok) || 0) + w * v / c);
    ws += w; w *= BACKOFF;
  }
  const list = [...acc].map(([tok, p]) => ({ tok, p: p / ws }));
  let z = 0; for (const o of list) { o.q = Math.pow(o.p, 1 / temp); z += o.q; }
  for (const o of list) o.q /= z;

const s2 = { q: 1, guess: -1, run: false, t: 0, done: false, score: { a: 0, b: 0 }, shown: -1 };

    } else html += `<p class="answer">${esc(part.join(''))}${started && part.length < seg.u.length && part.length > 0 ? '<span class="caret"></span>' : ''}</p>`;
  }

});

// =====================================================================
// LV3 · agent loop: think → act → observe (scripted, interactive approval)
// =====================================================================
const PHASE_MS = 1500;
const s3 = { mode: 'agent', play: false, i: 0, ph: 0, acc: 0, wait: false, approved: null, log: [], files: [], outbox: 0,
  used: {}, tool: null, last: -1, finished: false, chatT: 0, stats: { loops: 0, tools: 0, fix: 0, ctx: 0 } };
function reset3() {
  Object.assign(s3, { play: false, i: 0, ph: 0, acc: 0, wait: false, approved: null, log: [], outbox: 0, used: {}, tool: null,
    last: -1, finished: false, chatT: 0, stats: { loops: 0, tools: 0, fix: 0, ctx: 0 } });
  s3.files = FILES.map(name => ({ name, state: '' }));
  render3();
}
const approveOn = () => $('approve').checked;
function flashFiles(names) {
  for (const f of s3.files) if (names.includes(f.name) && f.state !== 'new') {
    f.state = 'read'; setTimeout(() => { if (f.state === 'read') { f.state = ''; renderFiles(); } }, 1600 / Math.min(speedMul, 2));
  }
}
function advance() {
  if (s3.finished || s3.wait) return;
  if (s3.i >= STEPS.length) {
    s3.log.push({ kind: 'final' }); s3.finished = true; s3.play = false; s3.last = -1; s3.tool = null;
    render3(); return;
  }
  const st = STEPS[s3.i];
  if (s3.ph === 0) {
    s3.log.push({ kind: 'think', i: s3.i, noAsk: st.ask && !approveOn() }); s3.stats.loops++; s3.tool = null; s3.ph = 1;
  } else if (s3.ph === 1) {
    s3.log.push({ kind: 'act', i: s3.i }); s3.stats.tools++; s3.used[st.tool] = (s3.used[st.tool] || 0) + 1; s3.tool = st.tool;
    if (st.ask && approveOn()) { s3.wait = true; s3.approved = null; } else { s3.approved = true; s3.ph = 2; }
  } else {
    const deny = st.ask && s3.approved === false;
    const text = I18N[lang].steps[s3.i][deny ? 'obDeny' : 'ob'];
    if (st.read) flashFiles(st.read);
    if (st.write && !s3.files.some(f => f.name === st.write)) s3.files.push({ name: st.write, state: 'new' });
    if (st.ask && !deny) s3.outbox++;
    if (st.fix) s3.stats.fix++;
    s3.stats.ctx += text.length;
    s3.log.push({ kind: 'obs', i: s3.i, deny, err: !!st.err });
    s3.ph = 0; s3.i++;
  }
  s3.last = s3.log[s3.log.length - 1].kind === 'think' ? 0 : s3.log[s3.log.length - 1].kind === 'act' ? 1 : 2;
  render3();
}
function entryHTML(e) {
  const T = I18N[lang], st = STEPS[e.i];
  if (e.kind === 'think') return [`<span class="tg think">${esc(t('tgThink'))}</span>`, esc(e.noAsk ? T.steps[e.i].thNoAsk : T.steps[e.i].th)];
  if (e.kind === 'act') return [`<span class="tg act">${esc(t('tgAct'))}</span>`, `<code>${esc(st.tool)}(${esc(st.arg)})</code>`];
  if (e.kind === 'obs') return [`<span class="tg ${e.err ? 'err' : 'obs'}">${esc(t(e.err ? 'tgErr' : 'tgObs'))}</span>`, esc(T.steps[e.i][e.deny ? 'obDeny' : 'ob'])];
  if (e.kind === 'final') return [`<span class="tg done">${esc(t('tgDone'))}</span>`, esc(t(s3.approved === false ? 'finalDeny' : 'final'))];
  return [`<span class="tg chat">${esc(t('tgChat'))}</span>`, esc(t('chatReply'))];
}
function renderFiles() {
  $('files').innerHTML = s3.files.map(f => `<li class="${f.state}"><span>${esc(f.name)}</span>${f.state === 'new' ? '<small>new</small>' : ''}</li>`).join('') +
    `<li class="out"><span>${esc(fill('outbox', { n: s3.outbox }))}</span></li>`;
}
function renderCap() {
  const cap = $('cap');
  if (s3.mode === 'chat') {
    const full = Array.from(t('chatReply')), n = Math.min(full.length, Math.floor(s3.chatT * (lang === 'zh' ? 18 : 60)));
    cap.innerHTML = n ? `<span class="tg chat">${esc(t('tgChat'))}</span><p>${esc(full.slice(0, n).join(''))}${n < full.length ? '<span class="caret"></span>' : ''}</p>` : `<p class="keys">${esc(t('hint3Chat'))}</p>`;
    return;
  }
  const e = s3.log[s3.log.length - 1];
  if (!e) { cap.innerHTML = `<p class="keys">${esc(t('capReady'))}</p>`; return; }
  const [tag, body] = entryHTML(e);
  cap.innerHTML = tag + `<p>${body}</p>` + (s3.wait ? `<div class="ask"><p>${esc(fill('ask', { who: STEPS[s3.i].arg }))}</p><div class="row"><button class="btn" id="allow">${esc(t('allow'))}</button><button class="btn ghost" id="deny">${esc(t('deny'))}</button></div></div>` : '');
}
function render3() {
  $('m3-chat').setAttribute('aria-pressed', s3.mode === 'chat');
  $('m3-agent').setAttribute('aria-pressed', s3.mode === 'agent');
  $('hint3').textContent = t(s3.mode === 'chat' ? 'hint3Chat' : 'hint3Agent');
  $('play3').textContent = t(s3.play ? 'pause' : 'play');
  $('step3').disabled = s3.mode === 'chat' || s3.finished || s3.wait;
  $('approve').disabled = s3.mode === 'chat';
  $('ringTitle').textContent = t(s3.mode === 'chat' ? 'ringChat' : 'ringAgent');
  const done = s3.finished || (s3.mode === 'chat' && s3.chatT > 0 && !s3.play);
  const st = $('ringState');
  st.textContent = t(s3.wait ? 'stWait' : done ? 'stDone' : s3.play ? 'stRun' : 'stReady');
  st.className = s3.wait ? 'bad' : s3.play ? 'on' : '';
  $('s3-loops').textContent = s3.stats.loops; $('s3-tools').textContent = s3.stats.tools;
  $('s3-fix').textContent = s3.stats.fix; $('s3-ctx').textContent = s3.stats.ctx.toLocaleString();
  const tools = I18N[lang].tools;
  $('tools').innerHTML = TOOL_NAMES.map(n => `<div class="tool${s3.tool === n ? ' on' : ''}"><b>${n}<span>${s3.used[n] ? '×' + s3.used[n] : ''}</span></b>${esc(tools[n])}</div>`).join('');
  renderFiles();
  renderCap();
  const log = s3.mode === 'chat' ? (s3.chatT > 0 ? [{ kind: 'chat' }] : []) : s3.log;
  $('log').innerHTML = log.length ? log.map(e => { const [tag, body] = entryHTML(e); return `<li>${tag}<span>${body}</span></li>`; }).join('') : `<li><span></span><span class="none">${esc(t('logEmpty'))}</span></li>`;
  $('log').scrollTop = $('log').scrollHeight;
}
function tick3(dt) {
  if (!s3.play) return;
  if (s3.mode === 'chat') {
    s3.chatT += dt / 1000 * speedMul;
    const len = Array.from(t('chatReply')).length;
    if (s3.chatT * (lang === 'zh' ? 18 : 60) >= len) { s3.play = false; render3(); } else renderCap();
    return;
  }
  if (s3.wait) return;
  s3.acc += dt * speedMul;
  if (s3.acc >= PHASE_MS) { s3.acc = 0; advance(); }
}
$('play3').addEventListener('click', () => {
  if (s3.mode === 'chat') { if (!s3.play && s3.chatT > 0) s3.chatT = 0; s3.play = !s3.play; render3(); return; }
  if (s3.finished) reset3();
  s3.play = !s3.play;
  if (s3.play && !s3.log.length) { s3.acc = 0; advance(); }
  render3();
});
$('step3').addEventListener('click', () => { s3.play = false; s3.acc = 0; advance(); render3(); });
$('reset3').addEventListener('click', reset3);
$('cap').addEventListener('click', e => {
  if (!s3.wait || !e.target.closest('#allow, #deny')) return;
  s3.approved = e.target.closest('#allow') !== null; s3.wait = false; s3.ph = 2; s3.acc = 0;
  advance(); render3();
});
const setMode3 = m => { s3.mode = m; reset3(); };
$('m3-chat').addEventListener('click', () => setMode3('chat'));
$('m3-agent').addEventListener('click', () => setMode3('agent'));

// Ring canvas: three nodes on a circle with the language model in the middle; a dot travels to the next phase.
function fitCanvas(cv, ctx) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return false;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); cv.cssW = w; cv.cssH = h;
  return true;
}
const ring = $('ring'), rg = ring.getContext('2d');
const PH_COL = () => [C.violet, C.amber, C.cyan];
const ANG = [-90, 30, 150].map(a => a * Math.PI / 180);
function drawRing(now) {
  if (!fitCanvas(ring, rg)) return;
  const w = ring.cssW, h = ring.cssH, S = Math.min(w, h * 1.1), cx = w / 2, cy = h / 2 + S * 0.03;
  const R = S * 0.33, nr = S * 0.105, cr = S * 0.13, chat = s3.mode === 'chat', cols = PH_COL();
  rg.fillStyle = C.ink; rg.fillRect(0, 0, w, h);
  rg.strokeStyle = C.line; rg.globalAlpha = .35; rg.lineWidth = 1;
  for (let x = 40; x < w; x += 40) { rg.beginPath(); rg.moveTo(x + .5, 0); rg.lineTo(x + .5, h); rg.stroke(); }
  rg.globalAlpha = chat ? .25 : 1;
  // ring arcs with clockwise arrowheads
  rg.strokeStyle = C.line; rg.lineWidth = 3; rg.beginPath(); rg.arc(cx, cy, R, 0, Math.PI * 2); rg.stroke(); rg.lineWidth = 1;
  for (let k = 0; k < 3; k++) {
    const a = ANG[k] + Math.PI / 3, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a), d = a + Math.PI / 2, s = S * 0.025;
    rg.fillStyle = C.muted; rg.beginPath();
    rg.moveTo(x + s * Math.cos(d), y + s * Math.sin(d));
    rg.lineTo(x + s * Math.cos(d + 2.5), y + s * Math.sin(d + 2.5));
    rg.lineTo(x + s * Math.cos(d - 2.5), y + s * Math.sin(d - 2.5)); rg.closePath(); rg.fill();
  }
  // spoke from the model to the active node
  if (!chat && s3.last >= 0) {
    const a = ANG[s3.last];
    rg.strokeStyle = cols[s3.last]; rg.setLineDash([4, 5]); rg.beginPath();
    rg.moveTo(cx + cr * Math.cos(a), cy + cr * Math.sin(a)); rg.lineTo(cx + (R - nr) * Math.cos(a), cy + (R - nr) * Math.sin(a)); rg.stroke(); rg.setLineDash([]);
  }
  // nodes
  rg.textAlign = 'center'; rg.textBaseline = 'middle';
  for (let k = 0; k < 3; k++) {
    const x = cx + R * Math.cos(ANG[k]), y = cy + R * Math.sin(ANG[k]), on = !chat && s3.last === k;
    if (on) { rg.fillStyle = cols[k]; rg.globalAlpha = .18 + .1 * Math.sin(now / 200); rg.beginPath(); rg.arc(x, y, nr * 1.35, 0, Math.PI * 2); rg.fill(); rg.globalAlpha = 1; }
    rg.fillStyle = on ? cols[k] : C.panel; rg.beginPath(); rg.arc(x, y, nr, 0, Math.PI * 2); rg.fill();
    rg.strokeStyle = cols[k]; rg.lineWidth = 2; rg.stroke(); rg.lineWidth = 1;
    rg.fillStyle = on ? C.ink : C.fg; rg.font = fBody(Math.round(S * (lang === 'zh' ? 0.06 : 0.042)), 700);
    rg.fillText(t('ph' + k), x, y - S * 0.012);
    rg.fillStyle = on ? C.ink : C.muted; rg.font = fMono(Math.max(10, Math.round(S * 0.026)));
    rg.fillText(t('ph' + k + 's'), x, y + S * 0.042);
  }
  // tool label next to the act node
  if (!chat && s3.tool) {
    const x = cx + R * Math.cos(ANG[1]), y = cy + R * Math.sin(ANG[1]) + nr + S * 0.05;
    rg.font = fMono(Math.max(11, Math.round(S * 0.03))); rg.fillStyle = C.amber;
    rg.textAlign = x + 80 > w ? 'right' : 'center'; rg.fillText(s3.tool + '()', Math.min(x, w - 8), Math.min(y, h - 12)); rg.textAlign = 'center';
  }
  // travelling dot
  if (!chat && s3.play && !s3.wait && !s3.finished && s3.last >= 0) {
    const f = Math.min(1, s3.acc / PHASE_MS), a = ANG[s3.last] + f * (2 * Math.PI / 3);
    rg.fillStyle = C.fg; rg.shadowColor = C.fg; rg.shadowBlur = 12;
    rg.beginPath(); rg.arc(cx + R * Math.cos(a), cy + R * Math.sin(a), S * 0.018, 0, Math.PI * 2); rg.fill(); rg.shadowBlur = 0;
  }
  rg.globalAlpha = 1;
  // the language model in the centre
  const talk = chat && s3.play;
  rg.fillStyle = chat ? color(C.amber, talk ? .3 + .15 * Math.sin(now / 150) : .2) : C.panel;
  rg.beginPath(); rg.arc(cx, cy, cr, 0, Math.PI * 2); rg.fill();
  rg.strokeStyle = chat ? C.amber : C.muted; rg.lineWidth = 2; rg.stroke(); rg.lineWidth = 1;
  rg.fillStyle = C.fg; rg.font = `700 ${Math.round(S * 0.05)}px Silkscreen, monospace`; rg.fillText('LLM', cx, cy - S * 0.015);
  rg.fillStyle = C.muted; rg.font = fBody(Math.max(10, Math.round(S * 0.028))); rg.fillText(t('llm'), cx, cy + S * 0.04);
  if (chat) { rg.fillStyle = C.amber; rg.font = fBody(Math.max(11, Math.round(S * 0.032)), 600); rg.fillText(t('chatNoLoop'), cx, Math.min(h - 14, cy + R + nr + S * 0.06)); }
  else { rg.textAlign = 'left'; rg.textBaseline = 'top'; rg.fillStyle = C.muted; rg.font = fMono(12); rg.fillText(`${t('s3Loops')} ${s3.stats.loops}`, 12, 10); }
}
function color(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// =====================================================================
// shared: level switch, speed, language, main loop
// =====================================================================
function setLevel(n) {
  level = n;
  document.querySelectorAll('.lvl').forEach(b => b.setAttribute('aria-pressed', +b.dataset.lvl === n));
  for (const k of [1, 2, 3]) $('lv' + k).hidden = k !== n;
  try { localStorage.setItem('genai-agent-level', n); } catch (e) {}
  renderHow();
}
function renderHow() {
  $('how-h').textContent = t('how' + level + 'H');
  $('howList').innerHTML = t('how' + level);
  $('howNote').textContent = t('how' + level + 'Note');
}
document.querySelectorAll('.lvl').forEach(b => b.addEventListener('click', () => setLevel(+b.dataset.lvl)));
function setSpeed() {
  speedMul = 2 ** +$('speed').value;
  $('speedOut').textContent = (speedMul < 10 ? speedMul.toFixed(2) : speedMul.toFixed(0)) + '×';
}
$('speed').addEventListener('input', setSpeed);

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-Hant-TW' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  $('lang').textContent = t('langBtn');
  // The language model and the race are language-specific: start them fresh.
  buildModel();
  s1.conv = []; s1.cur = null; s1.hit = -1; s1.autoNext = 600;
  refreshDist(); renderChat(); renderSeeds(); renderCorpus(); renderStats1();
  $('hint1').textContent = t(s1.mode === 'auto' ? 'hint1Auto' : 'hint1Manual');
  reset2();
  render3();
  renderHow();
}
$('lang').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('genai-agent-lang', lang); } catch (e) {}
  applyLang();
});

let lastT = performance.now();
function loop(now) {
  const dt = Math.min(100, now - lastT); lastT = now;
  if (level === 1) tick1(dt);
  else if (level === 2) tick2(dt);
  else { tick3(dt); drawRing(now); }
  requestAnimationFrame(loop);
}

setSpeed();
reset3();
applyLang();
let startLevel = 1;
try { const v = +localStorage.getItem('genai-agent-level'); if ([1, 2, 3].includes(v)) startLevel = v; } catch (e) {}
setLevel(startLevel);
requestAnimationFrame(loop);
})();
</script>
