","晚班"]},{"姓名":"佛羅多・巴金斯","主要職務":"倉儲理貨人員","技能":["補貨","庫存整理"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"山姆・詹吉","主要職務":"倉儲理貨人員","技能":["補貨","商品搬運"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"湯姆・索耶","主要職務":"倉儲理貨人員","技能":["收貨","商品搬運"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"瑪麗・包萍","主要職務":"清潔人員","技能":["賣場清潔","環境維護"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"珂賽特","主要職務":"清潔人員","技能":["賣場清潔","環境維護"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"海蒂","主要職務":"清潔人員","技能":["賣場清潔","環境維護"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"貝絲・馬奇","主要職務":"清潔人員","技能":["賣場清潔","環境維護"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"夏洛克・福爾摩斯","主要職務":"保全人員","技能":["現場巡查","安全觀察"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"艾琳・艾德勒","主要職務":"保全人員","技能":["出入口秩序","安全通報"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"哈克・芬","主要職務":"保全人員","技能":["現場巡查","出入口秩序"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"露西・佩文西","主要職務":"保全人員","技能":["現場巡查","安全通報"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"阿提克斯・芬奇","主要職務":"主管","技能":["班表管理","現場協調"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"彼得・潘","主要職務":"收銀人員","技能":["收銀","顧客服務"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"愛德蒙・佩文西","主要職務":"收銀人員","技能":["收銀","帳務核對"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"勞拉・英格斯","主要職務":"收銀人員","技能":["收銀","結帳引導"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"小王子","主要職務":"賣場服務人員","技能":["顧客引導","商品介紹"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"魯濱遜・克魯索","主要職務":"倉儲理貨人員","技能":["收貨","庫存整理"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"波莉阿姨","主要職務":"清潔人員","技能":["賣場清潔","環境維護"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]},{"姓名":"亞森・羅蘋","主要職務":"保全人員","技能":["現場巡查","出入口秩序"],"可排班日":["星期一","星期二","星期三","星期四","星期五","星期六","星期日"],"可排時段":["早班","中班","晚班"]}];
const DAYS=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'];
const SHIFTS=[['早班','08:00–12:00'],['中班','12:00–16:00'],['晚班','16:00–20:00']];
const ROLES=[['主管',1],['收銀人員',2],['賣場服務人員',1],['倉儲理貨人員',1],['清潔人員',1],['保全人員',1]];
const ROLE_SKILLS={'主管':['班表管理'],'收銀人員':['收銀'],'賣場服務人員':['顧客引導','商品介紹','顧客服務'],'倉儲理貨人員':['收貨','補貨','庫存整理','商品搬運'],'清潔人員':['賣場清潔','環境維護'],'保全人員':['現場巡查','安全觀察','出入口秩序','安全通報']};
let baseSchedule=makeSchedule();
let overrides={};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(d,sh,r){return `${d}|${sh}|${r}`}
function validFor(p,d,sh,r){return p['主要職務']===r && p['可排班日'].includes(DAYS[d]) && p['可排時段'].includes(sh) && ROLE_SKILLS[r].some(skill=>p['技能'].includes(skill))}
function makeSchedule(){
 const result={}; const counts=STAFF.map(()=>0); const byDay=STAFF.map(()=>new Set());
 for(let d=0;d<7;d++) for(const [sh] of SHIFTS) for(const [role,need] of ROLES){
  const k=key(d,sh,role); result[k]=[];
  for(let seat=0;seat<need;seat++){
   const candidate=STAFF.map((p,i)=>({p,i})).filter(({p,i})=>validFor(p,d,sh,role)&&counts[i]<6&&!byDay[i].has(d)&&!result[k].includes(i)).sort((a,b)=>counts[a.i]-counts[b.i]||a.i-b.i)[0];
   if(!candidate) break;
   result[k].push(candidate.i); counts[candidate.i]++; byDay[candidate.i].add(d);
  }
 }
 return result;
}
function effective(){const x=Object.fromEntries(Object.entries(baseSchedule).map(([k,v])=>[k,v.slice()]));for(const [k,v] of Object.entries(overrides)){x[k]=v;}return x;}
function countAssignments(schedule,i){return Object.values(schedule).reduce((n,list)=>n+list.filter(j=>j===i).length,0)}
function render(){
 const schedule=effective(); const out=document.querySelector('#schedule');let gap=0,filled=0,total=0;
 out.innerHTML=DAYS.map((day,d)=>`<article class="daycard"><h3>${day}</h3>${SHIFTS.map(([sh,time])=>`<div class="shift"><h4>${sh} <span class="muted">${time}</span></h4>${ROLES.map(([role,need])=>{const ids=schedule[key(d,sh,role)]||[];filled+=ids.length;total+=need;gap+=Math.max(0,need-ids.length);return `<div class="assignment"><span class="role">${role}（${ids.length}/${need}）</span><span>${ids.length?ids.map(i=>esc(STAFF[i]['姓名'])).join('、'):`<span class="short">缺 ${need-ids.length} 人</span>`}</span></div>`}).join('')}</div>`).join('')}</article>`).join('');
 document.querySelector('#stats').innerHTML=`<div class="stat"><span class="muted">虛構職員</span><strong>${STAFF.length} 人</strong></div><div class="stat"><span class="muted">每週需求</span><strong>${total} 人次</strong></div><div class="stat"><span class="muted">已安排</span><strong>${filled} 人次</strong></div><div class="stat"><span class="muted">待補缺額</span><strong class="${gap?'short':''}">${gap} 人次</strong></div>`;
}
['#generate','#regenerate'].forEach(id=>document.querySelector(id).addEventListener('click',()=>{baseSchedule=makeSchedule();overrides={};document.querySelector('#status').textContent='已依固定順序重新計算。';render();if(window.refreshAbsenceChoices)window.refreshAbsenceChoices();}));
document.querySelector('#theme').addEventListener('click',()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';});

render();
</script>
