<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的專業工具練習</title><style>body{max-width:820px;margin:40px auto;padding:0 20px;background:#f7fafc;color:#18364b;font:18px/1.8 system-ui}img{width:100%;height:auto}label{display:block;padding:8px}input{width:20px;height:20px}a{color:#096b73}input:focus-visible{outline:3px solid #137f93}h1{line-height:1.3}</style><h1>我的專業工具練習</h1><p>我要做醫檢稀釋換算器。這一版只記錄用途與準備情況，下一單元才加入計算。</p><ul><li>原液濃度 C₁（與 C₂ 使用相同濃度單位）</li><li>目標濃度 C₂</li><li>目標最終體積 V₂（mL 或 µL）</li></ul><img src="assets/醫檢稀釋換算邏輯圖.png" alt="原液 5 mL 加稀釋液 20 mL，得到最終體積 25 mL 的課堂示意圖"><h2>我的準備</h2><label><input type="checkbox"> 讀懂公式</label><label><input type="checkbox"> 完成手算</label><label><input type="checkbox"> 準備驗收案例</label><p id="status" role="status">已完成 0／3</p><p>僅供虛構資料的課堂練習。</p><script>document.querySelectorAll('input').forEach(function(input){input.addEventListener('change',function(){document.getElementById('status').textContent='已完成 '+document.querySelectorAll('input:checked').length+'／3';});});</script></html>
