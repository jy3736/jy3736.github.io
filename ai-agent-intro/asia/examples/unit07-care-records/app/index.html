<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照護紀錄簿</title><style>
:root{--ink:#193044;--green:#16645c;--bg:#f3f6f8;--line:#d9e2e8;--muted:#607384;--red:#b52c36}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:1240px;margin:auto;padding:0 28px 40px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:22px 0}.brand{border:0;background:none;color:var(--green);font-weight:700;font-size:21px;cursor:pointer}.brand b{display:inline-grid;place-items:center;background:var(--green);color:white;width:34px;height:34px;border-radius:9px;margin-right:10px}.local{font-size:14px;color:var(--muted)}h1{font-size:28px;margin:30px 0 4px}.lead{color:var(--muted);margin:0 0 20px}.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{border:0;background:none;padding:13px 18px;font-size:16px;color:var(--muted);cursor:pointer}.tab.active{color:var(--green);border-bottom:3px solid var(--green)}.steps{font-size:14px;color:var(--muted);margin-bottom:18px}.steps span{color:var(--green);font-weight:600}.grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:23px}h2{font-size:19px;margin:0 0 16px}label{font-size:14px;font-weight:600;display:block;margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #bdcbd5;border-radius:8px;background:white;padding:10px 12px;font:inherit;color:var(--ink)}textarea{resize:vertical}.source{min-height:240px;background:#f8fafb;line-height:1.9}.row{border-top:1px solid var(--line);padding:13px 0}.row:first-of-type{border-top:0}.units{display:grid;grid-template-columns:1fr 140px;gap:8px}.bp{grid-template-columns:1fr 1fr 140px}.btn{border:1px solid var(--green);border-radius:8px;padding:10px 17px;font:inherit;font-weight:650;cursor:pointer;background:white;color:var(--green)}.primary{background:var(--green);color:white;width:100%;margin-top:16px}.entity-row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:stretch}.entity-row .btn{white-space:nowrap}.save{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;background:white;border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-top:20px}.save-main{flex:1;min-width:260px}.save .actions .btn:last-child{background:var(--green);color:white}.error{border:2px solid var(--red)!important;box-shadow:0 0 0 2px #b52c3620}.msg{display:none;padding:12px 16px;border-radius:8px;margin-bottom:18px}.msg.on{display:block}.msg.bad{background:#fff0f1;color:#90242c;border:1px solid #edc1c5}.msg.good{background:#e8f5ee;color:#216345;border:1px solid #c5e5d3}.history{display:none}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.filters label{min-width:200px}.tablewrap{overflow:auto;margin-top:20px}table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;border-bottom:1px solid var(--line);padding:12px;font-size:14px}th{background:#edf3f4}.empty{text-align:center;color:var(--muted);padding:36px}.actions{display:flex;gap:10px;margin-left:auto}.hint{font-size:13px;color:var(--muted);margin:7px 0}.required{color:var(--red)}dialog{width:min(430px,calc(100% - 28px));border:0;border-radius:14px;padding:0;box-shadow:0 24px 80px #122c3b45;color:var(--ink)}dialog::backdrop{background:#15293680}.dialog-body{padding:25px}.dialog-body h2{margin-bottom:6px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.dialog-actions .confirm{background:var(--green);color:white}@media(max-width:850px){.grid{grid-template-columns:1fr}.save{align-items:flex-start;flex-wrap:wrap}}@media(max-width:520px){.wrap{padding:0 14px 28px}.units,.bp,.entity-row{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}}
</style></head><body><main class="wrap"><header><button class="brand" id="reset"><b>＋</b>照護紀錄簿</button><span class="local" id="codexStatus">純前端版 · 正在偵測 Codex</span></header><h1 id="title">記錄這一次照護</h1><p class="lead">直接貼上敘述，整理後可請 Codex 協助回填，再由照護人員確認資料歸屬。</p><div id="msg" class="msg"></div><nav class="tabs"><button class="tab active" data-tab="edit">新增紀錄</button><button class="tab" data-tab="history">紀錄查詢與匯出</button></nav>
<section id="edit"><div class="steps"><span>01 貼上敘述</span>　→　02 整理欄位　→　03 確認個案　→　04 儲存</div><div class="grid"><section class="panel"><h2>照護敘述</h2><label for="author">登錄／確認人員</label><div class="entity-row"><select id="author"><option value="">請選擇照護人員（人名 · 編號）</option></select><button class="btn" id="addAuthor" type="button">＋ 新增</button></div><label for="source">貼上本次照護內容</label><textarea id="source" class="source" maxlength="8000" placeholder="例如：今天早上去幫王阿伯量了一下……"></textarea><p class="hint">原文可以修改，整理時會完整保留。</p><button class="btn primary" id="extract">擷取欄位</button></section>
<section class="panel"><h2>整理結果</h2><p class="hint">請核對內容；原文沒有提供的資料請保持空白。</p><div class="row"><label for="date">照護日期 <span class="required">＊必填</span></label><input id="date" type="date"></div><div class="row"><label for="time">照護時間</label><input id="time" placeholder="例如：早上、08:30"></div><div class="row"><label for="appetite">食慾</label><input id="appetite" placeholder="例如：食慾不振"></div><div class="row"><label for="intake">進食量</label><textarea id="intake" rows="2" placeholder="例如：半個饅頭、三分之一杯豆漿"></textarea></div><div class="row"><label>血壓</label><div class="units bp"><input id="sys" type="number" placeholder="收縮壓"><input id="dia" type="number" placeholder="舒張壓"><select id="bpunit"><option value="">選擇單位</option><option>mmHg</option><option>kPa</option></select></div></div><div class="row"><label>心跳</label><div class="units"><input id="pulse" type="number" placeholder="數值"><select id="pulseunit"><option value="">選擇單位</option><option value="bpm">bpm（次／分）</option></select></div></div><div class="row"><label>體溫</label><div class="units"><input id="temp" type="number" step="0.1" placeholder="數值"><select id="tempunit"><option value="">選擇單位</option><option value="°C">°C</option><option value="°F">°F</option></select></div></div><div class="row"><label for="notes">備註</label><textarea id="notes" rows="3" placeholder="其他照護內容"></textarea></div></section></div>
<section class="save"><div class="save-main"><label for="person">請照護人員確認：這是誰的資料？ <span class="required">＊必填</span></label><div class="entity-row"><select id="person"><option value="">請選擇個案（人名 · 編號）</option></select><button class="btn" id="addPerson" type="button">＋ 新增</button></div><p class="hint">請從下拉選單選擇；沒有這位個案時按「新增」。</p></div><div class="actions"><button class="btn" id="sample">帶入範例</button><button class="btn" id="save">確認並儲存</button></div></section></section>
<section id="history" class="history"><section class="panel"><h2>紀錄查詢與匯出</h2><div class="filters"><label>個案<select id="filterPerson"><option value="">全部個案</option></select></label><label>日期<input id="filterDate" type="date"></label><button class="btn" id="export">匯出 CSV</button></div><div class="tablewrap"><table><thead><tr><th>日期／時間</th><th>個案</th><th>食慾／進食</th><th>血壓</th><th>心跳</th><th>體溫</th><th>備註</th></tr></thead><tbody id="rows"></tbody></table></div></section></section></main><dialog id="entityDialog"><form id="entityForm" class="dialog-body"><h2 id="entityTitle">新增人員</h2><p class="hint">輸入姓名後，系統會自動建立編號。</p><label for="entityName">姓名 <span class="required">＊必填</span></label><input id="entityName" autocomplete="off" maxlength="80" placeholder="請輸入姓名"><p id="entityError" class="hint required" role="alert"></p><div class="dialog-actions"><button class="btn" id="cancelEntity" type="button">取消</button><button class="btn confirm" type="submit">確認新增</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id),ids=['source','author','date','time','appetite','intake','sys','dia','bpunit','pulse','pulseunit','temp','tempunit','notes','person'];let records=JSON.parse(localStorage.getItem('careRecords.v1')||'[]');const normalize=(list,prefix)=>list.map((x,i)=>typeof x==='string'?{name:x,code:prefix+String(i+1).padStart(3,'0')}:x).filter(x=>x&&x.name&&x.code);let people=normalize(JSON.parse(localStorage.getItem('carePeople.v1')||'[]'),'P');for(const name of records.map(r=>r.person).filter(Boolean))if(!people.some(x=>x.name===name||entityLabel(x)===name))people.push({name,code:'P'+String(people.length+1).padStart(3,'0')});let authors=normalize(JSON.parse(localStorage.getItem('careAuthors.v1')||'[]'),'C');
function localDate(offset=0){const d=new Date(Date.now()+offset*864e5);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(d)}function chineseNumber(text){if(!text)return '';if(/^\d+(?:\.\d+)?$/.test(text))return text;const digits={零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};const parts=text.split(/[點点]/);let whole=0,current=0;if(/[十百]/.test(parts[0])){for(const c of parts[0]){if(c==='百'||c==='十'){whole+=(current||1)*(c==='百'?100:10);current=0}else if(c in digits)current=digits[c];else return ''}whole+=current}else{const joined=[...parts[0]].map(c=>c in digits?digits[c]:c).join('');whole=Number(joined)}const fraction=parts[1]?[...parts[1]].map(c=>c in digits?digits[c]:c).join(''):'';return Number.isFinite(whole)?String(whole)+(fraction?'.'+fraction:''):''}function val(id,v){$(id).value=v||''}function notify(text,bad=false){$('msg').textContent=text;$('msg').className='msg on '+(bad?'bad':'good');$('msg').scrollIntoView({behavior:'smooth',block:'center'})}function clearErrors(){document.querySelectorAll('.error').forEach(x=>x.classList.remove('error'))}function first(re,s){const m=s.match(re);return m?m[1]||m[0]:''}
function extract(){const s=$('source').value.trim();if(!s){$('source').classList.add('error');notify('請先貼上照護敘述',true);return}clearErrors();if(/今天|今日/.test(s))val('date',localDate());else if(/昨天|昨日/.test(s))val('date',localDate(-1));else{let m=s.match(/(\d{4})[年\/-](\d{1,2})[月\/-](\d{1,2})日?/);if(m)val('date',m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'));else{m=s.match(/(\d{1,2})月(\d{1,2})日/);if(m)val('date',new Date().getFullYear()+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0'))}}val('time',first(/((?:早上|上午|中午|下午|晚上|清晨|凌晨)(?:\s*[0-9一二兩三四五六七八九十]{1,3}[點時](?:半|\d{1,2}分)?)?|(?:[01]?\d|2[0-3]):[0-5]\d)/,s));val('appetite',first(/((?:食慾|胃口)[^，。；\n]{0,16}|不太想吃|不想吃|沒什麼胃口)/,s));const food=s.split(/[，。；\n]/).map(x=>x.trim()).filter(x=>/(吃|喝|扒|進食)/.test(x)&&/(半|\d+|一|二|兩|三|四|五|六|七|八|九|十|幾|三分之一|四分之一).{0,10}(個|碗|口|成|杯|塊|片|匙|毫升|ml|cc|%|％)/i.test(x));val('intake',food.join('；'));const numberText='[0-9一二兩三四五六七八九十百點点〇零]+';let m=s.match(new RegExp('(?:血壓|BP)\\s*(?:量(?:起來)?|測(?:起來)?|是|為|[:：])?\\s*('+numberText+')\\s*(?:[／/]|跟|和)\\s*('+numberText+')(?:\\s*(mmHg|kPa|毫米汞柱))?','i'));if(m){val('sys',chineseNumber(m[1]));val('dia',chineseNumber(m[2]));val('bpunit',m[3]?(/kPa/i.test(m[3])?'kPa':'mmHg'):'')}m=s.match(new RegExp('(?:心跳|心率|脈搏)\\s*(?:(?:每|一)?分鐘)?\\s*(?:是|為|[:：])?\\s*('+numberText+')(?:\\s*(BPM|次|下))?','i'));if(m){val('pulse',chineseNumber(m[1]));val('pulseunit',m[2]?'bpm':'')}m=s.match(new RegExp('體溫\\s*(?:量到|量起來|測到|是|為|[:：])?\\s*('+numberText+')(?:\\s*(度\\s*[CF]|°\\s*[CF]|℃|℉|度))?','i'));if(m){val('temp',chineseNumber(m[1]));val('tempunit',/[F℉]/i.test(m[2]||'')?'°F':/[C℃]/i.test(m[2]||'')?'°C':'')}val('notes',s);notify('欄位已整理，請核對內容並確認這是誰的資料。')}
function save(){clearErrors();const missing=[];if(!$('date').value)missing.push('date');if(!$('person').value)missing.push('person');[['sys','bpunit'],['dia','bpunit'],['pulse','pulseunit'],['temp','tempunit']].forEach(([a,b])=>{if($(a).value&&!$(b).value)missing.push(b)});if(missing.length){[...new Set(missing)].forEach(x=>$(x).classList.add('error'));$(missing[0]).scrollIntoView({behavior:'smooth',block:'center'});notify('資料尚未完整，請補齊紅框標示的必要欄位。',true);return}const r={id:crypto.randomUUID(),created:new Date().toISOString()};ids.forEach(x=>r[x]=$(x).value.trim());records.unshift(r);localStorage.setItem('careRecords.v1',JSON.stringify(records));notify('紀錄已儲存在這台裝置的瀏覽器。');setTimeout(reset,700)}function reset(){ids.forEach(x=>val(x,''));clearErrors();$('msg').className='msg';updateEntities();window.scrollTo({top:0,behavior:'smooth'})}function entityLabel(x){return x.name+' · '+x.code}function fillSelect(id,list,placeholder,selected=''){const el=$(id);el.innerHTML='<option value="">'+placeholder+'</option>'+list.map(x=>'<option value="'+esc(entityLabel(x))+'">'+esc(entityLabel(x))+'</option>').join('');if(selected&&[...el.options].some(o=>o.value===selected))el.value=selected}function updateEntities(){const person=$('person').value,author=$('author').value,filter=$('filterPerson').value;fillSelect('person',people,'請選擇個案（人名 · 編號）',person);fillSelect('author',authors,'請選擇照護人員（人名 · 編號）',author);fillSelect('filterPerson',people,'全部個案',filter)}function nextCode(list,prefix){const highest=list.reduce((max,x)=>{const m=String(x.code).match(new RegExp('^'+prefix+'(\\d+)$','i'));return m?Math.max(max,Number(m[1])):max},0);return prefix+String(highest+1).padStart(3,'0')}let pendingEntityType='';function openEntityDialog(type){pendingEntityType=type;const title=type==='person'?'個案':'照護人員';$('entityTitle').textContent='新增'+title;$('entityName').value='';$('entityName').classList.remove('error');$('entityError').textContent='';$('entityDialog').showModal();requestAnimationFrame(()=>$('entityName').focus())}function closeEntityDialog(){$('entityDialog').close();pendingEntityType=''}function confirmEntity(event){event.preventDefault();const isPerson=pendingEntityType==='person',title=isPerson?'個案':'照護人員',list=isPerson?people:authors,prefix=isPerson?'P':'C',cleanName=$('entityName').value.trim();if(!cleanName){$('entityName').classList.add('error');$('entityError').textContent='請輸入姓名';return}const existing=list.find(x=>x.name===cleanName);if(existing){closeEntityDialog();updateEntities();val(isPerson?'person':'author',entityLabel(existing));notify('「'+entityLabel(existing)+'」已在名單中，已自動選取。');return}const item={name:cleanName,code:nextCode(list,prefix)};list.push(item);localStorage.setItem(isPerson?'carePeople.v1':'careAuthors.v1',JSON.stringify(list));closeEntityDialog();updateEntities();val(isPerson?'person':'author',entityLabel(item));notify('已新增'+title+'「'+entityLabel(item)+'」，編號已自動建立。')}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const p=$('filterPerson').value.trim().toLowerCase(),d=$('filterDate').value;const list=records.filter(r=>(!p||r.person.toLowerCase().includes(p))&&(!d||r.date===d));$('rows').innerHTML=list.length?list.map(r=>`<tr><td>${esc(r.date)}<small> ${esc(r.time)}</small></td><td>${esc(r.person)}</td><td>${esc(r.appetite)}<br>${esc(r.intake)}</td><td>${esc(r.sys)}${r.dia?' / '+esc(r.dia):''} ${esc(r.bpunit)}</td><td>${esc(r.pulse)} ${esc(r.pulseunit)}</td><td>${esc(r.temp)} ${esc(r.tempunit)}</td><td>${esc(r.notes)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">目前沒有符合條件的紀錄</td></tr>'}function csv(){render();const p=$('filterPerson').value.trim().toLowerCase(),d=$('filterDate').value,list=records.filter(r=>(!p||r.person.toLowerCase().includes(p))&&(!d||r.date===d));if(!list.length){notify('目前沒有可匯出的紀錄',true);return}const cols=['date','time','person','appetite','intake','sys','dia','bpunit','pulse','pulseunit','temp','tempunit','notes','source','author'],q=x=>'"'+String(x||'').replaceAll('"','""')+'"',data=['日期,時間,個案,食慾,進食量,收縮壓,舒張壓,血壓單位,心跳,心跳單位,體溫,體溫單位,備註,原文,確認人員',...list.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+data],{type:'text/csv'}));a.download='照護紀錄_'+localDate()+'.csv';a.click();URL.revokeObjectURL(a.href)}
$('extract').onclick=extract;$('save').onclick=save;$('reset').onclick=reset;$('addPerson').onclick=()=>openEntityDialog('person');$('addAuthor').onclick=()=>openEntityDialog('author');$('cancelEntity').onclick=closeEntityDialog;$('entityForm').onsubmit=confirmEntity;$('sample').onclick=()=>{val('source','今天早上去幫王阿伯量了一下，他說昨晚沒睡好，早上看起來有點沒精神。早餐本來說不太想吃，後來有吃半個饅頭，豆漿大概喝了三分之一杯。血壓量起來是145／88 mmHg，心跳每分鐘96下，體溫36.8°C。走路時說膝蓋有點痠，其他沒有特別不舒服。');extract()};$('export').onclick=csv;$('filterPerson').oninput=render;$('filterDate').oninput=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));const hist=b.dataset.tab==='history';$('edit').style.display=hist?'none':'block';$('history').style.display=hist?'block':'none';$('title').textContent=hist?'每一次照護，都有紀錄':'記錄這一次照護';if(hist)render()});
async function registerCodexTools(){
 const mc=document.modelContext;
 if(typeof mc?.registerTool!=='function'){$('codexStatus').textContent='純前端版 · 請用 Codex 內建瀏覽器開啟';return}
 await mc.registerTool({name:'read_care_narrative',description:'讀取照護人員目前在頁面輸入、尚未確認儲存的照護敘述。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:async()=>({source:$('source').value})});
 await mc.registerTool({name:'fill_extracted_care_fields',description:'根據目前照護敘述回填整理欄位，供照護人員人工核對。只填原文有依據的資料；缺少資料要留空。此工具不會確認個案或儲存紀錄。',inputSchema:{type:'object',properties:{date:{type:'string',description:'YYYY-MM-DD'},time:{type:'string'},appetite:{type:'string'},intake:{type:'string'},systolic:{type:'string'},diastolic:{type:'string'},blood_pressure_unit:{type:'string',enum:['','mmHg','kPa']},pulse:{type:'string'},pulse_unit:{type:'string',enum:['','bpm']},temperature:{type:'string'},temperature_unit:{type:'string',enum:['','°C','°F']},notes:{type:'string'}},additionalProperties:false},execute:async input=>{const map={date:'date',time:'time',appetite:'appetite',intake:'intake',systolic:'sys',diastolic:'dia',blood_pressure_unit:'bpunit',pulse:'pulse',pulse_unit:'pulseunit',temperature:'temp',temperature_unit:'tempunit',notes:'notes'};for(const [key,id] of Object.entries(map))if(Object.hasOwn(input,key))val(id,String(input[key]??''));clearErrors();notify('Codex 已回填整理結果，請人工核對並確認個案後再儲存。');return {updated_fields:Object.keys(input),saved:false,requires_human_review:true}}});
 await mc.registerTool({name:'list_local_care_records',description:'查詢目前瀏覽器本機保存的照護紀錄。可依個案文字與日期篩選。',inputSchema:{type:'object',properties:{person:{type:'string'},date:{type:'string',description:'YYYY-MM-DD'}},additionalProperties:false},annotations:{readOnlyHint:true},execute:async input=>{const filtered=records.filter(r=>(!input.person||r.person.includes(input.person))&&(!input.date||r.date===input.date));const keys=['id','date','time','person','appetite','intake','sys','dia','bpunit','pulse','pulseunit','temp','tempunit','notes','author'];return {records:filtered.map(r=>Object.fromEntries(keys.map(k=>[k,r[k]||'']))),storage:'browser_localStorage'}}});
 $('codexStatus').textContent='純前端版 · Codex 已連結（3 個工具）';
}
updateEntities();registerCodexTools().catch(()=>{$('codexStatus').textContent='純前端版 · Codex 工具連結失敗'});
</script></body></html>
