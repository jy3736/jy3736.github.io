<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智慧排班</title>
<style>
:root{--g:#1f7a55;--g2:#165c40;--gs:#e6f4ec;--ink:#183a2c;--mut:#5f7569;--line:#d4e3da;--bg:#f3f8f5;--bad:#a4410b;--badbg:#fdf0e6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 1.4rem;background:#fff;border-bottom:1px solid var(--line)}
header b{font-size:1.2rem;color:var(--g)}
header span{font-size:.85rem;color:var(--g);background:var(--gs);border-radius:99px;padding:.15rem .7rem}
main{max-width:1180px;margin:0 auto;padding:1.2rem}
nav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
nav button{flex:1 1 9rem;display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
nav button i{font-style:normal;display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--gs);color:var(--g);font-weight:700;font-size:.85rem}
nav button[aria-current="step"]{border-color:var(--g);background:var(--g);color:#fff}
nav button[aria-current="step"] i{background:#fff}
nav button:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;margin-bottom:1rem}
.card h2{margin:0 0 .3rem;font-size:1.15rem}
.card h3{margin:.2rem 0 .5rem;font-size:1rem}
.muted{color:var(--mut);font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn{display:inline-block;border:1px solid var(--g);background:var(--g);color:#fff;border-radius:8px;padding:.5rem 1rem;font:inherit;cursor:pointer}
.btn:hover{background:var(--g2)}
.btn.light{background:#fff;color:var(--g)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.file input{position:absolute;opacity:0;width:1px;height:1px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:1.6rem;text-align:center;color:var(--mut);background:#fafcfb}
.msg{border-radius:10px;padding:.7rem 1rem;margin-bottom:1rem;border:1px solid}
.msg.ok{background:var(--gs);border-color:#b9dcc8;color:#1d5c40}
.msg.bad{background:var(--badbg);border-color:#efcfb6;color:var(--bad)}
.msg ul{margin:.3rem 0 0;padding-left:1.2rem}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:#f1f7f3}
td.cell{vertical-align:top}
td.cell.badcell{background:var(--badbg)}
select,input{font:inherit;padding:.3rem .4rem;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
td.cell select{display:block;width:100%;min-width:6.5rem;margin:.1rem 0}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.7rem}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:.25rem .9rem;font:inherit;cursor:pointer}
.tabs button.on{background:var(--g);border-color:var(--g);color:#fff}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.8rem 0}
.bar .status{margin-right:auto;font-weight:700}
.settings{display:flex;flex-wrap:wrap;gap:1rem}
.settings label{display:flex;flex-direction:column;font-size:.9rem;color:var(--mut)}
.rules{margin:.3rem 0 0;padding-left:1.2rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:end}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:1rem}
@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:.8rem}}
</style>
</head>
<body>
<header><b>＋ 智慧排班</b><span>純前端・資料只在這個分頁</span></header>
<main>
<nav id="steps" aria-label="排班步驟"></nav>
<div id="msg"></div>
<section id="view"></section>
</main>
<footer>資料不會上傳到任何伺服器；重新整理或關閉分頁後會清空。</footer>
<script>
const STEPS = ['人員與班別', '需求與限制', '自動排班', '檢查與調整', '發布班表'];
const S = {
  step: 0,
  msg: null
};
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function say(type, text, list) { S.msg = { type, text, list: list || [] }; }





/* ---------- 畫面 ---------- */
function unlocked(i) {
  return true;
}
function go(i) { if (unlocked(i)) { S.step = i; S.msg = null; render(); } }
const later = text => '<div class="empty">' + text + '</div>';
const next = (i, label, on) => '<p><button class="btn" ' + (on === false ? 'disabled ' : '') + 'onclick="go(' + i + ')">' + label + ' →</button></p>';

function view0() {
  return '<div class="card"><h2>1. 人員與班別</h2><p class="muted">目前沒有任何資料。</p><div class="grid">' +
    '<div><h3>人員資料</h3>' + later('尚無人員<br>（匯入功能尚未加入）') + '</div>' +
    '<div><h3>班別與需求</h3>' + later('尚無班別<br>（匯入功能尚未加入）') + '</div></div>' + next(1, '下一步：需求與限制') + '</div>';
}

function view1() {
  return '<div class="card"><h2>2. 需求與限制</h2>' + later('尚無班別需求與限制') + next(2, '下一步：自動排班') + '</div>';
}

function view2() {
  return '<div class="card"><h2>3. 自動排班</h2>' + later('自動排班功能尚未加入') + next(3, '下一步：檢查與調整') + '</div>';
}

function view3() {
  return '<div class="card"><h2>4. 檢查與調整</h2>' + later('尚無班表') + next(4, '下一步：發布班表') + '</div>';
}

function view4() {
  return '<div class="card"><h2>5. 發布班表</h2>' + later('發布功能尚未加入') + '</div>';
}

function render() {
  $('#steps').innerHTML = STEPS.map((n, i) => '<button ' + (i === S.step ? 'aria-current="step" ' : '') + (unlocked(i) ? '' : 'disabled ') + 'onclick="go(' + i + ')"><i>' + (i + 1) + '</i>' + n + '</button>').join('');
  $('#msg').innerHTML = S.msg ? '<div class="msg ' + S.msg.type + '">' + esc(S.msg.text) + (S.msg.list.length ? '<ul>' + S.msg.list.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</div>' : '';
  $('#view').innerHTML = [view0, view1, view2, view3, view4][S.step]();
}
render();
</script>
</body>
</html>
