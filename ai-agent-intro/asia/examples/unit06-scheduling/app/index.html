<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智慧排班｜純前端版</title><style>
:root{--coffee:#6b4636;--coffee2:#51362c;--green:#33805c;--greenbg:#e7f4ec;--ink:#3f332d;--muted:#796b63;--line:#e4d9d1;--bg:#f7f3ef;--white:#fffdfb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Microsoft JhengHei',sans-serif;font-size:16px}.app{max-width:1440px;margin:auto;padding:0 28px 45px}header{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--white);padding:0 max(28px,calc((100vw - 1440px)/2));color:var(--coffee)}.brand{display:flex;align-items:center;gap:11px}.mark{width:38px;height:38px;border-radius:10px;background:var(--coffee);color:white;display:grid;place-items:center;font-size:20px}.brand div{display:flex;flex-direction:column}.brand small{color:var(--muted);font-size:12px}.offline{font-size:12px;border:1px solid var(--line);padding:6px 10px;border-radius:20px;color:var(--green);background:var(--greenbg)}.title{display:flex;justify-content:space-between;align-items:end;padding:30px 0 20px}.title h1{margin:2px 0 4px;font-size:29px}.title p{margin:0;color:var(--muted);font-size:14px}.kicker{font-size:11px!important;letter-spacing:.12em;color:var(--coffee)!important;font-weight:700}.actions{display:flex;gap:8px}.btn{border:1px solid var(--coffee);background:var(--coffee);color:#fff;border-radius:8px;padding:10px 15px;font:inherit;font-size:14px;font-weight:650;cursor:pointer}.btn:hover{background:var(--coffee2)}.btn.secondary{background:#fff;color:var(--coffee);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.steps{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 22px;margin:0 0 18px;overflow:auto}.step{display:flex;align-items:center;flex:1;white-space:nowrap;color:#92877f;font-size:13px}.step:after{content:'';height:1px;background:var(--line);flex:1;margin:0 13px;min-width:18px}.step:last-child:after{display:none}.step b{width:24px;height:24px;border-radius:50%;background:#eee9e5;display:grid;place-items:center;margin-right:8px;font-size:12px}.step.active{color:var(--coffee);font-weight:700}.step.active b{background:var(--coffee);color:white}.step.done{color:var(--green)}.step.done b{background:var(--greenbg)}.notice{display:none;padding:11px 15px;border-radius:8px;margin-bottom:16px;font-size:14px}.notice.show{display:block}.notice.ok{background:var(--greenbg);color:#246947;border:1px solid #c7e4d3}.notice.warn{background:#fff2dd;color:#805a16;border:1px solid #eed9ae}.card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:20px}.stage-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}.stage-head h2{font-size:19px;margin:0 0 4px}.stage-head p{margin:0;color:var(--muted);font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.import-title{display:flex;align-items:center;gap:10px}.icon{width:40px;height:40px;border-radius:9px;background:#f1e5dc;color:var(--coffee);display:grid;place-items:center;font-size:19px}.import-title h3{font-size:16px;margin:0}.import-title p{margin:2px 0 0;color:var(--muted);font-size:12px}.tag{margin-left:auto;background:#f2efec;color:#7a6e67;border-radius:20px;padding:4px 8px;font-size:11px}.tag.ready{background:var(--greenbg);color:var(--green)}.file{display:inline-flex;margin:18px 0;align-items:center;gap:7px;background:var(--coffee);color:#fff;border-radius:7px;padding:9px 12px;font-size:13px;font-weight:650;cursor:pointer}.file input{display:none}.empty{min-height:190px;border:1px dashed #cabdb5;border-radius:8px;background:#fcfaf8;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;color:#9b8e86}.empty b{color:#655850;font-size:14px}.empty span{font-size:12px}.mini{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:220px}.mini div{display:grid;grid-template-columns:1fr 1fr 1fr;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12px}.mini .head{background:#f8f5f2;color:var(--muted);font-weight:650}.rules{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}.rules h3{font-size:15px;margin:0 0 14px}.need{display:grid;grid-template-columns:70px repeat(4,1fr);gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12px}.need span{background:#f7f3ef;padding:7px;border-radius:5px}.checklist{list-style:none;padding:0;margin:0;display:grid;gap:12px}.checklist li:before{content:'✓';display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--greenbg);color:var(--green);margin-right:8px;font-size:11px}.focus{min-height:390px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.focus .icon{background:var(--greenbg);color:var(--green);width:50px;height:50px}.focus h2{margin:16px 0 5px}.focus p{color:var(--muted);max-width:650px;font-size:13px}.stats{display:flex;gap:35px;margin:18px 0}.stats span{font-size:12px;color:var(--muted)}.stats b{display:block;font-size:20px;color:var(--ink)}.result{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}.side h3{font-size:15px;margin:0 0 13px}.side section{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.side p,.side li{font-size:12px;color:var(--muted)}.side ul{padding-left:18px}.roles{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}.roles button{border:0;border-radius:6px;padding:8px 10px;color:var(--muted);background:#f3efec;cursor:pointer}.roles button.active{background:var(--coffee);color:white}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:10px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;text-align:left}thead th{background:#f8f5f2;text-align:center}tbody th{width:115px}select{width:100%;border:1px solid transparent;border-radius:6px;background:#f5f2ef;padding:8px 6px;color:var(--ink)}.checkbar{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--greenbg);color:#246947;font-size:13px}.checkbar.bad{background:#fff2dd;color:#805a16}.hidden{display:none!important}@media(max-width:900px){.grid2,.rules,.result{grid-template-columns:1fr}.app{padding:0 15px 35px}.title{align-items:flex-start;flex-direction:column;gap:15px}.stage-head{align-items:flex-start;flex-direction:column}.actions{flex-wrap:wrap}.stats{gap:15px;flex-wrap:wrap}.need{grid-template-columns:70px 1fr 1fr}}
</style><style>:root{--green:#2f7654;--greenbg:#e7f4ec}.mark,.btn,.file,.step.active b,.roles button.active{background:#2f7654;border-color:#2f7654}.btn:hover{background:#245f43}.btn.secondary{background:#fff;color:#2f7654}.brand,.step.active,.kicker{color:#2f7654!important}.title h1,.stage-head h2,.import-title h3{color:#5a3d31}</style><style>:root{--coffee:#2f7654;--coffee2:#245f43;--green:#2f7654;--greenbg:#e7f4ec;--ink:#19392c;--muted:#61766c;--line:#d8e4de;--bg:#f2f7f4;--white:#fff}.title h1,.stage-head h2,.import-title h3{color:#19392c!important}.setting-foot,.csv-hint{background:#eaf4ee!important;color:#345f4a!important}.card,.steps,header{background:#fff}.empty{background:#f8fbf9;border-color:#bad0c4;color:#71877b}.mini .head,thead th{background:#f1f7f3}</style></head><body><header><div class="brand"><span class="mark">＋</span><div><strong>安程照護</strong><small>智慧排班</small></div></div><span class="offline">純前端・離線可用</span></header><main class="app"><section class="title"><div><p class="kicker">WEEKLY SCHEDULING</p><h1 id="title">設定人員與班別</h1><p id="subtitle">目前沒有任何資料，請先匯入兩份 CSV。</p></div><div class="actions hidden" id="topActions"><button class="btn secondary" id="download">下載班表 CSV</button><button class="btn secondary" id="save">保存草稿</button><button class="btn" id="publish">發布班表</button></div></section><nav class="steps" id="steps"></nav><div class="notice" id="notice"></div><section id="content"></section></main><script>
const roles=['住院醫師','護理人員','照護人員','清潔人員'],days=[['週一','10/12'],['週二','10/13'],['週三','10/14'],['週四','10/15'],['週五','10/16'],['週六','10/17'],['週日','10/18']],fixed=[['白班','08:00–16:00'],['小夜','16:00–00:00'],['大夜','00:00–08:00']],state={step:1,staff:[],shifts:[],assign:{},role:'護理人員',published:false};const $=s=>document.querySelector(s),key=(d,s,r)=>d+'|'+s+'|'+r;
function csv(text){return text.replace(/^\uFEFF/,'').trim().split(/\r?\n/).map(line=>{let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur.trim());cur=''}else cur+=c}out.push(cur.trim());return out})}
function tell(text,bad=false){let n=$('#notice');n.textContent=text;n.className='notice show '+(bad?'warn':'ok')}
function eligible(p,d,s,a){if(p.noNight&&s==='大夜')return false;if(p.noWeekend&&d>=5)return false;if(p.only&& !p.only.includes(d))return false;if(fixed.some(x=>a[key(d,x[0],p.role)]===p.id))return false;if(d>0&&s==='白班'&&a[key(d-1,'小夜',p.role)]===p.id)return false;return true}
function generate(){let a={},errors=[];for(const role of roles){let people=state.staff.filter(p=>p.role===role),counts=Object.fromEntries(people.map(p=>[p.id,0]));for(let d=0;d<7;d++)for(const s of ['大夜','小夜','白班']){let c=people.filter(p=>eligible(p,d,s,a)).sort((x,y)=>counts[x.id]-counts[y.id]||x.name.localeCompare(y.name));if(!c.length)errors.push(days[d][0]+s+'：'+role+'無可排人員');else{a[key(d,s,role)]=c[0].id;counts[c[0].id]++}}}state.assign=a;state.step=4;render();tell(errors.length?'無法產生合格班表：'+errors[0]:'已產生班表，所有必要限制均已通過。',!!errors)}
function issues(){let x=[];for(let d=0;d<7;d++)for(const [s] of fixed)for(const r of roles){let p=state.staff.find(q=>q.id===state.assign[key(d,s,r)]);if(!p)x.push(days[d][0]+s+'缺少'+r);else{if(p.noNight&&s==='大夜')x.push(p.name+'不可值大夜');if(p.noWeekend&&d>=5)x.push(p.name+'假日不可上班');if(p.only&&!p.only.includes(d))x.push(p.name+'不在指定時段')}}for(const p of state.staff)for(let d=0;d<7;d++){let n=fixed.filter(([s])=>state.assign[key(d,s,p.role)]===p.id).length;if(n>1)x.push(p.name+'於'+days[d][0]+'超過每日一班');if(d&&state.assign[key(d,'白班',p.role)]===p.id&&state.assign[key(d-1,'小夜',p.role)]===p.id)x.push(p.name+'休息不足')}return [...new Set(x)]}
function importStaff(file){let rd=new FileReader;rd.onload=()=>{let rows=csv(rd.result).slice(1),p=rows.map((v,i)=>({id:v[0]||'p'+i,name:v[1],role:v[2],noNight:v[3]==='是',noWeekend:v[4]==='是',only:v[5]?v[5].split('|').map(n=>+n-1):null})).filter(p=>p.name&&roles.includes(p.role));if(!p.length)return tell('人員檔案格式不正確。',true);state.staff=p;render();tell('已匯入 '+p.length+' 名人員。')};rd.readAsText(file,'utf-8')}
function importShifts(file){let rd=new FileReader;rd.onload=()=>{let rows=csv(rd.result).slice(1);if(!['白班','小夜','大夜'].every(n=>rows.some(r=>r[0]===n)))return tell('班別檔案需包含白班、小夜與大夜。',true);state.shifts=rows;render();tell('已匯入 3 個固定班別與需求。')};rd.readAsText(file,'utf-8')}
function download(){let rows=[['日期','星期','班別','時間','職類','人員編號','人員姓名']];for(let d=0;d<7;d++)for(const s of fixed)for(const r of roles){let p=state.staff.find(x=>x.id===state.assign[key(d,s[0],r)]);rows.push(['2026/'+days[d][1],days[d][0],s[0],s[1],r,p?.id||'',p?.name||'未安排'])}let body='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),u=URL.createObjectURL(new Blob([body],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='智慧排班_2026-10-12_至_2026-10-18.csv';a.click();URL.revokeObjectURL(u);tell('班表 CSV 已下載。')}
function render(){let names=['人員與班別','需求與限制','自動排班','檢查與調整','發布班表'];$('#steps').innerHTML=names.map((n,i)=>'<div class="step '+(i+1<state.step?'done':i+1===state.step?'active':'')+'"><b>'+(i+1<state.step?'✓':i+1)+'</b>'+n+'</div>').join('');let titles=['','設定人員與班別','設定需求與限制','自動排班','檢查與調整','班表已發布'];$('#title').textContent=titles[state.step];$('#subtitle').textContent=state.step===1?'目前沒有任何資料，請先匯入兩份 CSV。':state.step===5?'班表已發布，可下載 CSV 留存或分享。':'依序完成設定、排班、檢查與發布。';$('#topActions').classList.toggle('hidden',state.step<4);$('#save').classList.toggle('hidden',state.published);$('#publish').classList.toggle('hidden',state.published);let c=$('#content');if(state.step===1){let staff=state.staff.length,shift=state.shifts.length;c.innerHTML='<div class="stage-head card"><div><h2>1. 匯入人員與班別</h2><p>資料只會留在目前的瀏覽器頁面，不會上傳。</p></div><button id="next" class="btn" '+(!(staff&&shift)?'disabled':'')+'>下一步：需求與限制 →</button></div><div class="grid2"><article class="card"><div class="import-title"><span class="icon">♙</span><div><h3>人員資料</h3><p>'+(staff?staff+' 人':'尚未匯入')+'</p></div><span class="tag '+(staff?'ready':'')+'">'+(staff?'已匯入':'空白')+'</span></div><label class="file">↑ 選擇人員 CSV<input id="staffFile" type="file" accept=".csv"></label>'+(staff?'<div class="mini"><div class="head"><span>姓名</span><span>職類</span><span>限制</span></div>'+state.staff.map(p=>'<div><b>'+p.name+'</b><span>'+p.role+'</span><small>'+(p.noNight?'不值夜班':p.noWeekend?'假日不上班':p.only?'指定日期':'—')+'</small></div>').join('')+'</div>':'<div class="empty"><b>尚無人員</b><span>請匯入人員 CSV</span></div>')+'</article><article class="card"><div class="import-title"><span class="icon">◷</span><div><h3>班別與需求</h3><p>'+(shift?'3 個固定班別':'尚未匯入')+'</p></div><span class="tag '+(shift?'ready':'')+'">'+(shift?'已匯入':'空白')+'</span></div><label class="file">↑ 選擇班別 CSV<input id="shiftFile" type="file" accept=".csv"></label>'+(shift?'<div class="mini">'+fixed.map(s=>'<div><b>'+s[0]+'</b><span>'+s[1]+'</span><small>各職類至少 1 人</small></div>').join('')+'</div>':'<div class="empty"><b>尚無班別</b><span>請匯入班別 CSV</span></div>')+'</article></div>';$('#staffFile').onchange=e=>importStaff(e.target.files[0]);$('#shiftFile').onchange=e=>importShifts(e.target.files[0]);if(staff&&shift)$('#next').onclick=()=>{state.step=2;render()}}
else if(state.step===2)c.innerHTML='<div class="stage-head card"><div><h2>2. 確認需求與必要限制</h2><p>必要限制不會自動放寬。</p></div><button id="next" class="btn">下一步：自動排班 →</button></div><div class="rules"><article class="card"><h3>每班最低人數</h3>'+fixed.map(s=>'<div class="need"><b>'+s[0]+'</b>'+roles.map(r=>'<span>'+r+' 1</span>').join('')+'</div>').join('')+'</article><article class="card"><h3>必要限制</h3><ul class="checklist"><li>每日最多 1 班</li><li>班間至少休息 8 小時</li><li>不值夜班</li><li>假日不可上班</li><li>指定時段可上班</li></ul></article></div>',$('#next').onclick=()=>{state.step=3;render()};
else if(state.step===3)c.innerHTML='<div class="card focus"><span class="icon">✓</span><h2>設定完成，可以開始排班</h2><p>系統先滿足必要限制，再盡量平均分配班數。所有計算都在這台裝置的瀏覽器內完成。</p><div class="stats"><span><b>'+state.staff.length+'</b> 名人員</span><span><b>3</b> 個班別</span><span><b>7</b> 天</span><span><b>5</b> 類限制</span></div><button id="go" class="btn">▶ 開始自動排班</button></div>',$('#go').onclick=generate;
else{let list=state.staff.filter(p=>p.role===state.role),problem=issues();c.innerHTML='<div class="result"><aside class="card side"><h3>排班設定</h3><p>人員 '+state.staff.length+' 人<br>固定班別 3 班<br>排班範圍 7 天</p><section><h3>必要限制</h3><ul><li>每日最多 1 班</li><li>班間至少 8 小時</li><li>個人夜班與假日限制</li></ul></section></aside><article class="card"><div class="roles">'+roles.map(r=>'<button data-role="'+r+'" class="'+(r===state.role?'active':'')+'">'+r+'</button>').join('')+'</div><div class="table-wrap"><table><thead><tr><th>班別</th>'+days.map(d=>'<th>'+d[0]+'<br>'+d[1]+'</th>').join('')+'</tr></thead><tbody>'+fixed.map(s=>'<tr><th>'+s[0]+'<br><small>'+s[1]+'</small></th>'+days.map((d,di)=>'<td><select data-d="'+di+'" data-s="'+s[0]+'"><option value="">未安排</option>'+list.map(p=>'<option value="'+p.id+'" '+(state.assign[key(di,s[0],state.role)]===p.id?'selected':'')+'>'+p.name+'</option>').join('')+'</select></td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="checkbar '+(problem.length?'bad':'')+'">'+(problem.length?problem.length+' 項限制未通過：'+problem.slice(0,3).join('、'):'✓ 限制檢查通過')+'</div></article></div>';document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{state.role=b.dataset.role;render()});document.querySelectorAll('select').forEach(s=>s.onchange=()=>{state.assign[key(+s.dataset.d,s.dataset.s,state.role)]=s.value;state.published=false;render();tell('已重新檢查手動調整。',issues().length>0)})}}
$('#download').onclick=download;$('#save').onclick=()=>tell('草稿保留在目前頁面中。');$('#publish').onclick=()=>{let p=issues();if(p.length)return tell('仍有 '+p.length+' 項限制未通過，無法發布。',true);state.published=true;state.step=5;render();tell('班表已發布。')};render();
</script></body></html>
