<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智慧排班｜本機學習包</title>
  <style>
    :root{--green:#176b43;--deep:#104d32;--pale:#edf8f1;--line:#c8e3d2;--ink:#17382a;--muted:#587166}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7fcf9,#e4f4ea);color:var(--ink);font:16px/1.65 system-ui,"Noto Sans TC",sans-serif}
    main{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:64px 0}.eyebrow{color:var(--green);font-weight:800;letter-spacing:.12em}
    h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.12;margin:.25em 0}.lead{max-width:720px;color:var(--muted);font-size:1.08rem}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:38px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 14px 38px #176b4312}
    .card h2{margin:0 0 8px;font-size:1.28rem}.card p{color:var(--muted);min-height:78px}.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;padding:11px 18px;border-radius:10px;font-weight:750}.btn:hover{background:var(--deep)}
    .download{background:#fff;color:var(--green);border:1px solid var(--green);margin:4px 6px 4px 0}.note{margin-top:28px;padding:18px 22px;background:var(--pale);border-left:5px solid var(--green);border-radius:12px}
    @media(max-width:760px){main{padding:38px 0}.grid{grid-template-columns:1fr}.card p{min-height:auto}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">純前端・本機可用</div>
    <h1>智慧排班學習包</h1>
    <p class="lead">從範例資料開始，體驗人員與班別設定、限制條件、自動排班、檢查調整，以及班表下載；同時可搭配講義逐步實作。</p>
    <section class="grid">
      <article class="card"><h2>智慧排班系統</h2><p>匯入人員與班別，設定必要限制，產生並下載一週班表。</p><a class="btn" href="app/index.html">開啟排班系統</a></article>
      <article class="card"><h2>操作與實作講義</h2><p>依照教學流程，理解功能設計並使用提示詞建立自己的版本。</p><a class="btn" href="guide/index.html">閱讀完整講義</a></article>
      <article class="card"><h2>範例匯入資料</h2><p>先下載兩份 CSV，再到排班系統第一步依序匯入。</p><a class="btn download" href="samples/智慧排班_範例人員.csv" download>人員 CSV</a><a class="btn download" href="samples/智慧排班_範例班別.csv" download>班別 CSV</a></article>
    </section>
    <div class="note"><strong>資料留在本機：</strong>此 package 不會把人員、限制或班表上傳到伺服器。請在關閉頁面前下載重要班表。</div>
  </main>
</body>
</html>
