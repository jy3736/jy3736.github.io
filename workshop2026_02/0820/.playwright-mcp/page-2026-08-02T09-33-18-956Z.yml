        - code [ref=f3e73]: "# AGENTS.md ## Project This is a simple writing project. ## Language - Use Traditional Chinese. - Keep the wording clear and natural. - Avoid overly formal or technical language. ## Working Rules - Read the file before editing it. - Keep the original meaning unless the user asks to change it. - Make focused edits. - Do not remove examples unless they are clearly unrelated. ## Verification - Check that the revised text is readable. - Check that headings and lists still make sense. - Summarize the main changes after editing."
