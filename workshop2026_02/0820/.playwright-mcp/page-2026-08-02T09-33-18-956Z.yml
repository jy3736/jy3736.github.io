      - paragraph [ref=f3e27]:
        - code [ref=f3e28]: AGENTS.md
        - text: 是放在 Codex 專案最上層的文字檔。它的用途很簡單：告訴 Codex 在這個專案中應該怎麼工作。先在 ChatGPT 選擇 Codex 來處理專案任務，再讓它讀取這份規則。
      - paragraph [ref=f3e29]: 這份講義只討論最簡單的 Codex project。假設你的 project 裡只有目前要處理的檔案，目標是讓 Codex 知道基本工作規則。
      - heading "AGENTS.md 是什麼" [level=2] [ref=f3e30]
      - paragraph [ref=f3e31]:
        - text: 當你用 Codex 開啟一個 project 時，Codex 會在這個 project 裡讀取、建立或修改檔案。
        - code [ref=f3e32]: AGENTS.md
        - text: 就是寫給 Codex 的專案規則。
      - paragraph [ref=f3e33]: 它可以說明：
      - list [ref=f3e34]:
        - listitem [ref=f3e35]: 這個專案要做什麼。
        - listitem [ref=f3e36]: Codex 回答時要用什麼語氣。
        - listitem [ref=f3e37]: Codex 修改檔案時要注意什麼。
        - listitem [ref=f3e38]: 哪些事情需要先問使用者。
        - listitem [ref=f3e39]: 完成後要怎麼檢查。
      - paragraph [ref=f3e40]:
        - code [ref=f3e41]: AGENTS.md
        - text: 不需要寫得很長。能讓 Codex 少猜一點，就是有用的規則。
      - heading "最簡單的 Codex AGENTS.md" [level=2] [ref=f3e42]
      - paragraph [ref=f3e43]: 下面是一份非常簡單的版本。它只描述 Codex 在目前 project 裡的基本工作方式。
      - generic [ref=f3e44]:
        - generic "AGENTS.md 範本語言切換" [ref=f3e45]:
          - button "中文" [ref=f3e46] [cursor=pointer]
          - button "English" [pressed] [ref=f3e47] [cursor=pointer]
          - button "📋 複製" [ref=f3e48] [cursor=pointer]:
            - generic [ref=f3e49]: 📋
            - generic [ref=f3e50]: 複製
        - code [ref=f3e52]: "# AGENTS.md ## Project This is a simple Codex project. ## Language - Use Traditional Chinese by default. - Use clear and beginner-friendly wording. ## Working Rules - Read the relevant file before editing it. - Make small and focused changes. - Do not rewrite the whole file unless the user asks. - Do not delete files unless the user clearly asks. - Ask before making broad changes. ## Output - Keep new files in this project folder unless the user asks for another location. - Use clear filenames. - Explain what changed after finishing. ## Verification - Check that edited or created files exist. - Check that the content matches the user's request. - Tell the user if something could not be checked."
      - paragraph [ref=f3e53]: 這份規則適合大多數練習。它的重點不是限制 Codex，而是讓 Codex 知道：要先看檔案、改小一點、不要亂刪、完成後要回報。
      - heading "可以怎麼改" [level=2] [ref=f3e54]
      - paragraph [ref=f3e55]: 你可以依自己的專案，把上面的規則稍微改成更明確的版本。例如：
      - list [ref=f3e56]:
        - listitem [ref=f3e57]:
          - text: 如果你希望 Codex 一律用繁體中文，就保留
          - code [ref=f3e58]: Use Traditional Chinese by default.
        - listitem [ref=f3e59]:
          - text: 如果你希望 Codex 不要大幅重寫文章，就保留
          - code [ref=f3e60]: Do not rewrite the whole file unless the user asks.
        - listitem [ref=f3e61]: 如果你只是做短練習，可以把規則維持在 20 行以內。
      - paragraph [ref=f3e62]: 不要一開始就寫太多規則。規則越多，越難看懂，也越不容易維護。
      - heading "範例一：簡單文字修改專案" [level=2] [ref=f3e63]
