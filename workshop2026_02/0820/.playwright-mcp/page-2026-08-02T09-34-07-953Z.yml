      - heading "Codex 統測試題切題與答案鍵練習" [level=1] [ref=f6e20]
      - heading "練習目標" [level=2] [ref=f6e21]
      - paragraph [ref=f6e22]: Module 3 全部練習預計 30～40 分鐘完成，本頁是第二部分，接續第一部分下載好的試題與標準答案 PDF。這次要練習用一段自然語言指令，請 Codex 把試題 PDF 逐題裁切成一張一張的圖片，並依你指定的檔名規則命名，再對照標準答案 PDF 建立一份 JSON 格式的答案鍵。跟第一部分「照著網址、連結點下去」不同，這次 Codex 得自己判斷每一題在頁面上從哪裡開始、到哪裡結束。
      - paragraph [ref=f6e23]: 完成後你應該能夠：
      - list [ref=f6e24]:
        - listitem [ref=f6e25]: 用一段自然語言指令，請 Codex 把試題 PDF 轉成圖片，再逐題裁切成一張一張的獨立圖片。
        - listitem [ref=f6e26]:
          - text: 請 Codex 依你指定的檔名規則（
          - code [ref=f6e27]: <學年度>Q<題號>.png
          - text: ）為每張圖片命名，並依學年度整理成資料夾。
        - listitem [ref=f6e28]: 請 Codex 對照標準答案 PDF，用同一套命名規則當作 key，建立一份 JSON 格式的答案鍵。
        - listitem [ref=f6e29]: 檢查切題結果是否齊全：圖片張數是否等於題數，JSON 裡的 key 是否跟圖片檔名一一對應。
        - listitem [ref=f6e30]: 比較精確版、詳細版與簡易版 Prompt 的差異——尤其是當任務需要「用眼睛判斷」而不是「照著固定網址走」時，把細節寫死還可不可靠。
      - heading "練習範圍與資料夾結構" [level=2] [ref=f6e31]
      - paragraph [ref=f6e32]: 本次練習延續第一部分的下載範圍，但只取其中一科試題，避免題號重複：
      - table [ref=f6e34]:
        - rowgroup [ref=f6e35]:
          - row [ref=f6e36]:
            - columnheader "項目" [ref=f6e37]
            - columnheader "內容" [ref=f6e38]
        - rowgroup [ref=f6e39]:
          - row [ref=f6e40]:
            - cell "輸入檔案" [ref=f6e41]
            - cell [ref=f6e42]:
              - text: 第一部分練習下載好的
              - code [ref=f6e43]: <學年度>/專業一題目.pdf
              - text: （試題）與
              - code [ref=f6e44]: <學年度>/專業一答案.pdf
              - text: （標準答案）
          - row [ref=f6e45]:
            - cell "科目群" [ref=f6e46]
            - cell "電機與電子群資電類・專業科目(一)" [ref=f6e47]
          - row [ref=f6e48]:
            - cell "學年度" [ref=f6e49]
            - cell "111、112、113、114、115（共 5 個學年度）" [ref=f6e50]
          - row [ref=f6e51]:
            - cell "輸出圖片檔名規則" [ref=f6e52]
            - cell [ref=f6e53]:
              - code [ref=f6e54]: <學年度>Q<題號>.png
              - text: （例如
              - code [ref=f6e55]: 111Q1.png
              - text: 、
              - code [ref=f6e56]: 111Q23.png
              - text: ）
          - row [ref=f6e57]:
            - cell "輸出答案鍵檔案" [ref=f6e58]
            - cell [ref=f6e59]:
              - code [ref=f6e60]: answer_key.json
              - text: ，key 與圖片檔名（不含副檔名）完全相同
      - paragraph [ref=f6e61]: 切題完成後，請 Codex 依照學年度建立資料夾，例如：
      - code [ref=f6e63]: images/ 111/ 111Q1.png 111Q2.png ... 111Q40.png 112/ ... 115/（同樣依題數各自產生檔案） answer_key.json
      - code [ref=f6e65]: "{ \"111Q1\": \"C\", \"111Q2\": \"D\", \"111Q3\": \"C\", \"112Q1\": \"B\" }"
      - blockquote [ref=f6e66]:
        - paragraph [ref=f6e67]:
          - text: 因為專業科目(二)的題號也是從 1 開始編，如果兩科都用同一套
          - code [ref=f6e68]: <學年度>Q<題號>
          - text: 規則命名，會互相撞名。這次練習先只處理專業科目(一)；要不要、以及怎麼把兩科都納入，留給反思問題討論。輸入的 PDF 都是第一部分練習已經下載好的本機檔案，這次不需要重新連線到官網。
      - heading "參考 Prompt" [level=2] [ref=f6e69]
      - heading "精確版" [level=3] [ref=f6e70]
      - paragraph [ref=f6e71]: 如果想寫得像傳統批次處理腳本一樣精確，可以連要用什麼工具把 PDF 轉成圖片、解析度多少、裁切範圍怎麼判斷都寫清楚。這種寫法在試卷版面穩定、一題接一題乾淨分隔時最省事，但統測試題本身沒有網址或連結文字可以寫死，唯一能寫死的是流程與工具——換一個學年度、版面忽然變雙欄，或某一題橫跨兩頁，寫死的流程還是得靠 Codex 臨場判斷。
      - button "📋 複製" [ref=f6e73] [cursor=pointer]:
        - generic [ref=f6e74]: 📋
        - generic [ref=f6e75]: 複製
      - code [ref=f6e77]: "請依照以下步驟，把 115 學年度「電機與電子群資電類」的試題 PDF（專業科目(一)與專業科目(二)）切成一題一張圖片，並整理出 JSON 格式答案鍵： 1. 讀取 115/專業一題目.pdf 與 115/專業二題目.pdf（已下載好的檔案）。使用 pdftoppm 或同等工具，把每份 PDF 的每一頁轉成一張 300 DPI 的 PNG 圖片，暫存在一個工作資料夾中。 2. 依序檢視轉出的頁面圖片，找出每一題（例如「1.」「2.」這種題號開頭）在頁面上的起始與結束位置。一題的範圍包含題幹、所有選項，以及題目附帶的圖或表，直到下一題題號出現為止。 3. 用你判斷出的範圍，把每一題從頁面圖片中裁切出來，另存成一張獨立的 PNG，檔名為 <學年度>專業<1 或 2>Q<題號>.png（例如 115專業1Q1.png、115專業2Q23.png），放到 ./<學年度>/assets/ 資料夾中。 4. 讀取 115/專業一答案.pdf 與 115/專業二答案.pdf（標準答案），找出每一題對應的正確選項（A/B/C/D）。 5. 把兩個科目所有題目的答案整理成一個 JSON 檔 ./<學年度>/<學年度>keys.json，格式為 { \"115專業1Q1\": \"C\", \"115專業1Q2\": \"D\", ... }，key 要跟第 3 步產生的圖片檔名（不含副檔名）完全一致。 6. 如果某一題在頁面上找不到明確的題號、題目橫跨兩頁、或某一題被官方公告不予計分／一律給分，請停下來、告訴我實際狀況，不要憑猜測硬裁或亂填答案。"
      - heading "詳細版" [level=3] [ref=f6e78]
      - paragraph [ref=f6e79]: 先看一個把規則和驗收標準都講清楚、但不規定用哪個工具的版本：說明輸入檔案在哪裡、裁切與命名規則、答案要以標準答案 PDF 為準，並要求 Codex 遇到例外要主動回報、完成後給一份數量核對。
      - button "📋 複製" [ref=f6e81] [cursor=pointer]:
        - generic [ref=f6e82]: 📋
        - generic [ref=f6e83]: 複製
      - code [ref=f6e85]: "請幫我把 115 學年度統測「電機與電子群資電類」的試題（專業科目(一)與專業科目(二)），從已下載好的 PDF 中，切成一題一張圖片，並建立對應的 JSON 答案鍵。 輸入檔案：115/專業一題目.pdf、115/專業一答案.pdf、115/專業二題目.pdf、115/專業二答案.pdf，都已經下載好。 請針對兩個科目： 1. 把試題 PDF 中的每一題（含題幹、選項、附圖或附表）各自裁切成一張獨立的 PNG 圖片。 2. 圖片檔名請用 <學年度>專業<1 或 2>Q<題號>.png 的格式，例如 115專業1Q1.png、115專業2Q15.png。 3. 把所有圖片放進 ./<學年度>/assets/ 資料夾。 4. 從標準答案 PDF 中找出每一題的正確答案（A/B/C/D），整理成一個 JSON 檔 ./<學年度>/<學年度>keys.json，key 用跟圖片檔名相同的字串（不含 .png），例如 \"115專業1Q1\": \"C\"。 處理過程請注意： - 每張圖片只能包含一題，不要把兩題的內容裁在同一張圖裡，也不要把同一題切成兩張圖。 - 答案請以官方標準答案 PDF 為準，不要自己作答猜測。 - 如果題號不連續、有缺頁，或某一題被官方公告不計分／一律給分，請明確告訴我是哪一科、哪一題，不要略過不提。 - 全部處理完成後，請列出兩個科目各自切出的圖片張數，並確認 <學年度>keys.json 裡的 key 數量與圖片數量一致。"
      - heading "簡易版" [level=3] [ref=f6e86]
      - paragraph [ref=f6e87]: 同一個任務也可以只講你要的結果，把「怎麼切、用什麼工具」留給 Codex 自己判斷：
      - button "📋 複製" [ref=f6e89] [cursor=pointer]:
        - generic [ref=f6e90]: 📋
        - generic [ref=f6e91]: 複製
      - code [ref=f6e93]: 請幫我把下載好的 115 學年度試題 PDF，每一題切成一張圖片，檔名使用 ./<學年度>/assets/<學年度>專業<1 或 2>Q<題號>.png。 然後對照標準答案 PDF，製作 ./<學年度>/<學年度>keys.json。JSON 的 key 使用與圖片檔名完全相同的字串，value 填入正確答案。
      - blockquote [ref=f6e94]:
        - paragraph [ref=f6e95]:
          - strong [ref=f6e96]: 三種寫法怎麼選？
          - text: 「精確版」把要用的工具、解析度、裁切範圍的判斷邏輯都寫清楚，這種寫法在試卷版面穩定、題目一題接一題乾淨分隔時最省事——但統測試題不像網站，沒有網址或連結文字可以寫死，唯一能寫死的是流程與工具本身；如果某年題目橫跨兩頁、或版面忽然變成雙欄，寫死的流程還是得靠 Codex 臨場判斷，這時候精確版不見得比詳細版更可靠。「詳細版」只講規則和驗收標準（一題一圖、檔名規則、答案要以官方 PDF 為準、遇到例外怎麼辦），不規定要用哪個工具、DPI 多少，Codex 可以自己選最適合的做法，工具版本或介面變化也不會卡住整段 Prompt。「簡易版」連規則都不講，只講你要的結果，怎麼切、用什麼工具完全交給 Codex 決定，最省事但也最難確認做得夠不夠完整。多數時候，介於詳細版和簡易版之間最實用：講清楚一題一圖、檔名規則、答案要對照官方 PDF，但不用規定 Codex 該用哪一套裁圖工具。
      - heading "檢查重點" [level=2] [ref=f6e97]
      - list [ref=f6e98]:
        - listitem [ref=f6e99]: 每個學年度資料夾裡的圖片數量，是否等於該年度試題的實際題數（可以用答案 PDF 或試題目次核對）。
        - listitem [ref=f6e100]: 每張圖片是否恰好對應一題：沒有兩題擠在同一張圖裡，也沒有同一題被切成兩張圖或漏了附圖、附表。
        - listitem [ref=f6e101]:
          - code [ref=f6e102]: answer_key.json
          - text: 裡的 key 是否與圖片檔名（去掉
          - code [ref=f6e103]: .png
          - text: ）一一對應，沒有多餘或缺少的 key。
        - listitem [ref=f6e104]: 答案是否來自標準答案 PDF，而不是 Codex 自己作答；抽查幾題比對原始 PDF 確認正確性。
        - listitem [ref=f6e105]: 若有題目被官方公告不予計分／一律給分，Codex 有沒有明確標註，而不是自己隨便給一個答案。
      - heading "反思問題" [level=2] [ref=f6e106]
      - list [ref=f6e107]:
        - listitem [ref=f6e108]: 如果用固定的頁面座標去裁切每一題，換一個學年度、版面編排不同時，這個做法還能用嗎？為什麼第一部分的「網站操作版」可以把連結整個寫死，但這裡沒辦法把裁切座標整個寫死？
        - listitem [ref=f6e109]:
          - text: 如果要把專業科目(一)和專業科目(二)都做這個練習，兩科的題號都從 1 開始，
          - code [ref=f6e110]: <學年度>Q<題號>
          - text: 這個檔名規則會發生什麼問題？你會怎麼修改命名規則來避免衝突？
        - listitem [ref=f6e111]: 你要怎麼在不用肉眼看完所有圖片的情況下，快速確認 Codex 沒有把任何一題的附圖漏掉、或裁到隔壁題的內容？
        - listitem [ref=f6e112]: 為什麼答案鍵要讓 Codex 去讀標準答案 PDF，而不是直接請 Codex 看著題目圖片自己作答？這兩種做法的可靠度有什麼差別？
    - contentinfo [ref=f6e113]: 智慧雨林產業創生人才育成計畫 (南臺科技大學 電子系 楊榮林 教授)