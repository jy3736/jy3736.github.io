      - heading "一、系列定位與脈絡" [level=2] [ref=e94]
      - paragraph [ref=e95]:
        - text: 本場是「AI Agent 教學應用工作坊」系列三場中的第二場，面向非工程背景的大學教師。系列以三場循序漸進的實作，協助教師理解 AI 已從單純的對話與提示詞工具，逐步發展為能協助處理電腦與雲端工作流程的 AI Agent；核心學習方法可遷移到不同 AI 工具：
        - strong [ref=e96]: 先說清楚目標、情境、限制與完成標準；再檢查成果、提出修正，並以小步迭代完成工作。
      - table [ref=e98]:
        - rowgroup [ref=e99]:
          - row [ref=e100]:
            - columnheader "階段" [ref=e101]
            - columnheader "工作坊" [ref=e102]
            - columnheader "核心問題" [ref=e103]
            - columnheader "當次成果" [ref=e104]
        - rowgroup [ref=e105]:
          - row [ref=e106]:
            - cell "1. 學會與 AI 協作" [ref=e107]
            - cell "工作坊（一）" [ref=e108]
            - cell "如何把模糊教學想法變成可檢查、可完成的任務？" [ref=e109]
            - cell "AI 協作任務卡、一次教材或截圖分析與修訂紀錄" [ref=e110]
          - row [ref=e111]:
            - cell "2. 做出自主練習小工具" [ref=e112]
            - cell "工作坊（二）〔本場〕" [ref=e113]
            - cell "如何把自己的教材轉為題組與學生可使用的練習小工具？" [ref=e114]
            - cell "選擇題題組、靜態 HTML 自主練習小工具、測試紀錄" [ref=e115]
          - row [ref=e116]:
            - cell "3. 延伸為課堂形成性評量" [ref=e117]
            - cell "工作坊（三）" [ref=e118]
            - cell "如何用最低必要功能，在課堂中快速掌握學生的概念理解？" [ref=e119]
            - cell "學生課堂作答原型、簡易教師 Dashboard、班級答題彙整與初步分析" [ref=e120]
      - paragraph [ref=e121]: 本場承接工作坊（一）建立的 AI 協作方法，把教師的教學內容轉化為學生可在課後自主練習的題組與小工具；完成的題組格式與作答／回饋邏輯，會在工作坊（三）延伸為課堂形成性評量原型。
      - heading "二、工作坊簡介" [level=2] [ref=e122]
      - paragraph [ref=e123]: 上一場工作坊，我們練習把教學需求說清楚，並與 AI Agent 協作完成可檢查、可修正的小任務。這一場將把這個能力真正做成一個可用的教學工具：教師帶著自己正在教授的主題、教材、講義或簡報進場，與 AI Agent 協作產生一份多題式選擇題題組（例如 10、20 或 30 題），再以 vibe coding 的方式，把題組與功能需求交給 AI，製作一個可在個人電腦本機開啟的靜態 HTML 自主練習小工具。
      - paragraph [ref=e124]: 選擇題作為起點，是因為規則清楚、容易批閱，對初次嘗試的教師與學生都較友善。AI 可協助教師整理與初步產生題組，但題目是否符合學習目標、答案是否正確、題幹是否清楚、選項是否合理，仍必須由教師檢核——這個過程正是在練習把教學專業轉為可以交給 AI 協助處理、但仍由人負責驗收的內容。
      - paragraph [ref=e125]: 學生開啟網站時只看得到題目與選項，作答期間不會看到答案；完成作答並按下「送出並查看結果」後，網站才根據題組中的答案自動批閱，顯示答對題數、總分與逐題對錯，並可重新作答，反覆練習。學生也能把答錯的題目帶去與 AI 對話，追問為什麼答錯、正確概念是什麼、可能誤解了哪裡，形成「教材 → 題組 → 自主作答 → 自動回饋 → AI 釐清迷思 → 再次練習」的學習循環。
      - paragraph [ref=e126]: 本場的目標不是做出一套正式考試系統，而是完成一個可實際試用的自主學習原型。教師將親手體驗：只要能把需求說清楚，AI Agent 就能協助把教學想法逐步做成工具，也能在日後持續依自己的教學需要延伸與修改。
      - heading "三、適合參與者" [level=2] [ref=e127]
      - list [ref=e128]:
        - listitem [ref=e129]: 已參與工作坊（一），或能以「目標、情境、限制、完成標準」簡要描述自己的教學需求者。
        - listitem [ref=e130]: 想把自己正在教授的主題、教材、講義或簡報，轉化為學生可自主練習的選擇題題組與網頁工具者。
        - listitem [ref=e131]: 想讓學生在課後依自己的節奏反覆練習、獲得即時回饋並釐清迷思概念者。
        - listitem [ref=e132]: 希望先完成一個小而完整、可在本機使用的教學原型，而非從複雜系統開始者。
      - heading "四、學習成果" [level=2] [ref=e133]
      - paragraph [ref=e134]: 完成本場後，您將能夠：
      - list [ref=e135]:
        - listitem [ref=e136]: 依自己的課程主題或教材，與 AI Agent 協作產生一份多題式選擇題題組，並檢核題目、答案與選項的品質。
        - listitem [ref=e137]: 將自我測驗需求拆成題庫資料、畫面、互動規則與驗收條件，並以 vibe coding 的方式與 AI 協作建立、修改一個單頁 HTML 自主練習小工具。
        - listitem [ref=e138]: 設計「送出前不顯示答案，送出後才提供分數、逐題對錯與回饋」的基本學習流程。
        - listitem [ref=e139]: 說明學生如何以批閱結果為起點，利用 AI 對話釐清答錯原因與未學會的概念。
        - listitem [ref=e140]: 以試用與驗收清單檢查網站是否符合原先的教學需求。
      - heading "五、工作坊重點與最小可行功能" [level=2] [ref=e141]
      - paragraph [ref=e142]: 工作坊重點：
      - list [ref=e143]:
        - listitem [ref=e144]: 從教材、講義或簡報，與 AI Agent 協作整理成可練習的選擇題題組，維持題庫與網頁的清楚分工。
        - listitem [ref=e145]: 建立題目與選項畫面，記錄學生作答。
        - listitem [ref=e146]: 以 vibe coding 方式完成送出、計分、逐題正誤與正確答案回饋。
        - listitem [ref=e147]: 加入重新作答功能，讓學生可反覆練習。
        - listitem [ref=e148]: 設計學生利用 AI 釐清答錯原因、補強觀念的使用情境。
        - listitem [ref=e149]: 以同儕試用找出操作不清楚或需修正的地方。
      - paragraph [ref=e150]: 最小可行功能（當次驗收基準）：
      - list [ref=e151]:
        - listitem [ref=e152]: 教師可依教材建立一份多題式選擇題題組。
        - listitem [ref=e153]: 小工具可載入題目、選項與答案資料。
        - listitem [ref=e154]: 學生作答與送出前不顯示答案、分數或逐題提示。
        - listitem [ref=e155]: 送出後顯示答對題數、分數與逐題對錯。
        - listitem [ref=e156]: 可重新作答，讓學生反覆練習。
        - listitem [ref=e157]: 題組資料與網頁程式保持清楚分工，方便日後更換教材或修改題目。
      - heading "六、事前準備" [level=2] [ref=e158]
      - list [ref=e159]:
        - listitem [ref=e160]: 請攜帶筆記型電腦，並確認可使用網頁瀏覽器。
        - listitem [ref=e161]: 請準備自己正在教授的教材、講義或簡報片段，作為產生題組的素材；也可先使用講師提供的範例題庫。
        - listitem [ref=e162]: 題目、答案與學習目標仍須由教師自行檢核；不使用學生個資、完整成績或其他機敏資料。
        - listitem [ref=e163]: 若曾參加工作坊（一），請攜帶或整理當時完成的 AI 協作任務卡與需求草稿。
      - paragraph [ref=e164]: 若需要在現場前先複習工作坊（一）的環境與設定基礎，可參考：
      - generic [ref=e165]:
        - link "ChatGPT Work 與 Codex 設定指南 先選擇 Chat、ChatGPT Work 或 Codex；使用 Codex 時，先限制工作區並採用先要求核准。" [ref=e166] [cursor=pointer]:
          - /url: codex-app-settings-guide.html
          - strong [ref=e167]: ChatGPT Work 與 Codex 設定指南
          - generic [ref=e168]: 先選擇 Chat、ChatGPT Work 或 Codex；使用 Codex 時，先限制工作區並採用先要求核准。
        - link "Module 1：Windows 11 環境建置 Vibe coding 與 AI Agent 工作環境的一鍵安裝、手動安裝與驗證任務。" [ref=e169] [cursor=pointer]:
          - /url: module1/windows11-vibe-coding-setup.html
          - strong [ref=e170]: Module 1：Windows 11 環境建置
          - generic [ref=e171]: Vibe coding 與 AI Agent 工作環境的一鍵安裝、手動安裝與驗證任務。
      - paragraph [ref=e172]: 本場兩個核心階段——從教材到題組、vibe coding 建置自主練習小工具——也各自備有逐步操作的實作教學，可作為現場節奏之外的自學參考或會後複習：
      - generic [ref=e173]:
        - link "Module 2：考古題下載、切題與清理實作教學 對應「從教材到題組」階段：用 Claude Code 的三個 skill，把 PDF 考古題轉為一題一張乾淨圖片與標準答案 JSON。" [ref=e174] [cursor=pointer]:
          - /url: module2/exam-paper-pipeline-tutorial.html
          - strong [ref=e175]: Module 2：考古題下載、切題與清理實作教學
          - generic [ref=e176]: 對應「從教材到題組」階段：用 Claude Code 的三個 skill，把 PDF 考古題轉為一題一張乾淨圖片與標準答案 JSON。
        - link "Module 3：從問題集資料夾產生自主測驗網頁實作教學 對應「vibe coding 建置」階段：用 build-quiz-app skill，把問題集資料夾變成雙擊即用的學生自測網頁與教師端成績彙整頁。" [ref=e177] [cursor=pointer]:
          - /url: module3/quiz-app-tutorial.html
          - strong [ref=e178]: Module 3：從問題集資料夾產生自主測驗網頁實作教學
          - generic [ref=e179]: 對應「vibe coding 建置」階段：用 build-quiz-app skill，把問題集資料夾變成雙擊即用的學生自測網頁與教師端成績彙整頁。
      - heading "七、使用定位與範圍" [level=2] [ref=e180]
      - paragraph [ref=e181]:
        - text: 本場產出定位為學生課後的自主練習小工具，
        - strong [ref=e182]: 不作為正式成績判定或高風險測驗
        - text: 。學生是否真實投入練習，仍取決於其學習動機；學生也可能利用 AI 取得答案。因此，本工具的價值在於提供可反覆練習、即時回饋與觀念釐清的學習機會，而不是取代教師對正式評量的設計與判斷。
      - list [ref=e183]:
        - listitem [ref=e184]: 先完成小而可驗收的版本，再依使用經驗改進；不在時間有限的現場追求技術複雜度。
        - listitem [ref=e185]: 題目、答案、學習目標對應都必須由教師檢核，不可自動採用 AI 產出。
        - listitem [ref=e186]: 不在 AI 對話中貼入學生個資或完整成績；素材以教師自身教材、講義或簡報為主。
        - listitem [ref=e187]: 若日後需要正式評量、跨班長期使用、個資處理、資料庫、權限或即時追蹤，應另行規劃資料治理、資安、無障礙、維運與校內程序。
      - heading "八、預期帶走的成果" [level=2] [ref=e188]
      - list [ref=e189]:
        - listitem [ref=e190]: 一份由自身教材發展、結構清楚的選擇題題組。
        - listitem [ref=e191]: 一個可在本機開啟的靜態 HTML 自主練習小工具。
        - listitem [ref=e192]: 一個送出後才顯示答案、分數與逐題回饋的完整流程。
        - listitem [ref=e193]: 一份測試與修正紀錄，可作為後續教學改版的起點。
        - listitem [ref=e194]: 一套可延續到其他教材、單元或教學工具的 AI Agent 協作開發流程。
      - heading "九、銜接工作坊（三）" [level=2] [ref=e195]
      - paragraph [ref=e196]: 工作坊（三）「從自主練習到課堂形成性評量」會延續本場的題組格式與學生作答介面，把課後自主練習帶回教室：學生在課堂中透過教師提供的網址載入指定題庫，填寫班級座號或匿名代碼等最小必要識別資料後完成作答；交卷後系統自動批閱並回傳個人結果。教師端會有一個刻意維持最低必要功能的 Dashboard，只在學生登入開始作答與交卷後顯示必要資訊，全班交卷後可查看各題答對率、錯誤率與常見錯誤分布，並可交給 AI 協助整理成簡單的學習分析。
      - paragraph [ref=e197]: 因此，本場完成的題組資料格式、送出前不顯示答案、送出後自動批閱與逐題回饋等設計，會直接沿用到下一場，請妥善保留當次產出的題庫檔案與小工具程式碼。
      - heading "十、報名資訊" [level=2] [ref=e198]
      - paragraph [ref=e199]: 請由〔報名連結／QR Code〕完成報名。活動日期、時間與場地以本頁公告為準；如有準備上的問題，請於報名後依主辦單位通知辦理。
