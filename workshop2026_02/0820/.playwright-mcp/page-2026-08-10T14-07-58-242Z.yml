    - paragraph [ref=e46]: 做完這份教學，你應該能夠：
    - list [ref=e47]:
      - listitem [ref=e48]: 用 Claude Code，把技專校院入學測驗中心（統測）的考古題 PDF，轉成一題一張的乾淨圖片，加上一份標準答案 JSON。
      - listitem [ref=e49]: 知道下載、切題、清理這三個階段各自在做什麼、為什麼要驗收、以及每個階段各自的能力邊界在哪裡。
      - listitem [ref=e50]: 看得懂「乾跑（dry-run）先確認、沒問題才正式執行」這個安全習慣，並知道為什麼清理階段一定要先乾跑。
      - listitem [ref=e51]: 自己換一個學年度／科目，獨立重跑一次完整流程。
    - heading "先備條件" [level=2] [ref=e52]
    - list [ref=e53]:
      - listitem [ref=e54]:
        - text: 已經能開啟並使用 Claude Code。若還沒設定好工作環境，請先參考
        - link "Module 1：Windows 11 環境建置" [ref=e55] [cursor=pointer]:
