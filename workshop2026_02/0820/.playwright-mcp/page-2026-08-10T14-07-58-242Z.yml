    - list [ref=e139]:
      - listitem [ref=e140]:
        - text: 4 個檔案都出現，而且執行時每個檔案那一行都印出
        - code [ref=e141]: verify_pdf() OK
        - text: （不是
        - code [ref=e142]: MISMATCH
        - text: ）。
      - listitem [ref=e143]: 試題 PDF 大約 12 頁（50 題的專業科目考卷），標準答案 PDF 大約 1 頁 —— 頁數差太多要留意。
      - listitem [ref=e144]:
        - text: 如果看到
        - code [ref=e145]: MISMATCH
        - text: ，先用 Claude Code 的 Read 工具打開那份 PDF，用肉眼確認群類、科目對不對，不要急著往下一步。
      - listitem [ref=e146]:
        - text: 如果答案 PDF 裡有「答案變更為…」這類更正說明，先留意一下，切題階段的答案解析會自動把多重答案（如
        - code [ref=e147]: "\"AD\""
        - text: ）收進去，但值得事後對照原文確認有沒有真的收進表格。
    - heading "步驟二：切成單題圖片＋答案 JSON" [level=2] [ref=e148]
    - paragraph [ref=e149]: skill：slice-exam-pdf
    - paragraph [ref=e150]: 這一步把整份 PDF 切成一題一張的 PNG 圖片，並且對照標準答案 PDF，做出一份「圖片檔名 → 正確答案」的 JSON。
    - heading "用一句話請 Claude Code 做" [level=3] [ref=e151]
    - generic [ref=e152]:
      - button "📋 複製" [ref=e154] [cursor=pointer]:
        - generic [ref=e155]: 📋
        - generic [ref=e156]: 複製
      - code [ref=e158]: 請幫我把 module2/raw/115 底下 115 學年度試題 PDF，每一題切成一張圖片， 檔名用 module2/repo/115/115專業<1或2>Q<題號>.png。 再對照標準答案 PDF，做出 module2/repo/115/115keys.json， key 要跟圖片檔名完全一樣（含 .png），value 放正確答案字母。
    - heading "或者，自己直接下指令" [level=3] [ref=e159]
    - generic [ref=e160]:
      - button "📋 複製" [ref=e162] [cursor=pointer]:
        - generic [ref=e163]: 📋
        - generic [ref=e164]: 複製
      - code [ref=e166]: python3 .claude/skills/slice-exam-pdf/scripts/slice_exam_pdf.py \ --year 115 \ --subject "1:module2/raw/115/115專業一試題.pdf:module2/raw/115/115專業一答案.pdf" \ --subject "2:module2/raw/115/115專業二試題.pdf:module2/raw/115/115專業二答案.pdf" \ --out-dir module2/repo/115
    - paragraph [ref=e167]:
      - strong [ref=e168]: 產出：
      - code [ref=e169]: module2/repo/115/115專業1Q1.png
      - text: ～
      - code [ref=e170]: 115專業1Q50.png
      - text: 、
      - code [ref=e171]: 115專業2Q1.png
      - text: ～
      - code [ref=e172]: 115專業2Q50.png
      - text: ，加上一份
      - code [ref=e173]: 115keys.json
      - text: ，內容像這樣：
    - code [ref=e176]: "{ \"115專業1Q1.png\": \"B\", \"115專業1Q10.png\": \"B\", \"115專業1Q11.png\": \"A\", ... }"
    - heading "共同科目（例如數學）：題數不是 50 題，且檔名要手動改" [level=3] [ref=e177]
    - paragraph [ref=e178]:
      - text: 共同科目考卷通常是 25 題，不是 50 題，要另外加
      - code [ref=e179]: "--total"
      - text: ；而且
      - code [ref=e180]: slice-exam-pdf
      - text: 的輸出檔名固定寫死「專業」兩個字，即使
      - code [ref=e181]: "--subject"
      - text: 標籤換成字母也一樣，所以切完數學卷之後，檔名還是會叫
      - code [ref=e182]: 115專業BQ<n>.png
      - text: ，必須手動改名成
      - code [ref=e183]: 115數學BQ<n>.png
      - text: ，
      - code [ref=e184]: keys.json
      - text: 裡的 key 也要同步改：
    - generic [ref=e185]:
      - button "📋 複製" [ref=e187] [cursor=pointer]:
        - generic [ref=e188]: 📋
        - generic [ref=e189]: 複製
      - code [ref=e191]: python3 .claude/skills/slice-exam-pdf/scripts/slice_exam_pdf.py \ --year 115 \ --subject "B:module2/raw/math-115b/115數學B試題.pdf:module2/raw/math-115b/115數學B答案.pdf" \ --total 25 \ --out-dir module2/repo/math-115b
    - paragraph [ref=e192]: 改名這件事同樣可以直接請 Claude Code 做，不用自己手動一個一個改：
    - generic [ref=e193]:
      - button "📋 複製" [ref=e195] [cursor=pointer]:
        - generic [ref=e196]: 📋
        - generic [ref=e197]: 複製
      - code [ref=e199]: 剛剛切出來的檔名是 115專業BQ<n>.png，這其實是數學科， 麻煩幫我全部重新命名成 115數學BQ<n>.png， keys.json 裡對應的 key 也要同步改成新檔名。
    - heading "驗收重點" [level=3] [ref=e200]
    - list [ref=e201]:
      - listitem [ref=e202]:
        - text: 圖片張數符合預期題數（專業科目通常 50 題、共同科目通常 25 題），
        - code [ref=e203]: keys.json
        - text: 的筆數要一樣多。
      - listitem [ref=e204]: 如果考卷有「▲閱讀下文，回答第 X-Y 題」這種題組，挑題組的第一題和後面某一題各看一次，確認共用的閱讀文章有出現、沒有被截斷或重複貼兩次。
      - listitem [ref=e205]: 挑一題有電路圖／圖表的題目，確認圖片右邊沒有被切掉。
      - listitem [ref=e206]: 看最後一題，確認內容完整沒被切斷，如果原本有「【以下空白】」的提示，這裡應該還留著（要等清理階段才會被裁掉）。
      - listitem [ref=e207]: 隨機抽 2、3 題的答案，跟標準答案 PDF 肉眼核對一次。
    - heading "步驟三：清理圖片" [level=2] [ref=e208]
    - paragraph [ref=e209]: skill：clean-exam-question-images
    - paragraph [ref=e210]: 切出來的圖片下緣常常會多留一小段空白，甚至帶到下一題的一小段殘影；題號（像「50.」「11.」）也還印在題目最前面。這一步做兩件事：
    - list [ref=e211]:
      - listitem [ref=e212]:
        - strong [ref=e213]: Pass 1：
        - text: 裁掉每張圖下面多餘的空白（包含「【以下空白】」的殘留），但不動真正的內容。
      - listitem [ref=e214]:
        - strong [ref=e215]: Pass 2：
        - text: 把題號（如「50.」「11.」）塗白，但選項 (A)(B)(C)(D) 完全不能動。
    - paragraph [ref=e216]: 這個 skill 沒有獨立的腳本檔，兩段清理邏輯直接寫在 skill 說明裡，由 Claude Code 讀取後即場執行 —— 也就是說，這一步一定要透過 Claude Code 對話來做。
    - heading "用一句話請 Claude Code 做" [level=3] [ref=e217]
    - generic [ref=e218]:
      - button "📋 複製" [ref=e220] [cursor=pointer]:
        - generic [ref=e221]: 📋
        - generic [ref=e222]: 複製
      - code [ref=e224]: 對 module2/repo/115 資料夾裡的每張 *.png： 1. 裁掉下面多餘的空白（含「以下空白」殘影），但不要裁到真正的內容。 2. 清掉題號（像「50.」「11.」），但 (A)(B)(C)(D) 選項不要動。 執行 Pass 2 之前，先「乾跑」一次，把每張圖偵測到的題號區塊印出來讓我看過， 確認每張圖都剛好抓到 1 個題號區塊之後，才正式塗白存檔。
    - blockquote [ref=e225]:
      - strong [ref=e226]: 為什麼一定要先乾跑：
      - text: Pass 2 判斷「這是不是題號」用的是像素座標的門檻值（例如題號要在 x≤220 開始），這組門檻是針對這個考卷範本量身調校的。萬一某一年、某一科的版面跟預期不同，門檻可能會抓錯 —— 乾跑只印出偵測結果、不會真的動任何像素，讓你能在「真的塗白存檔」之前先發現異常，避免一次做壞整批圖片。
    - heading "驗收重點" [level=3] [ref=e227]
    - list [ref=e228]:
      - listitem [ref=e229]:
        - text: 乾跑結果：每個檔案都剛好偵測到
        - strong [ref=e230]: "1"
        - text: 個題號區塊。0 個代表版面跟預期不同，≥2 個代表誤判 —— 兩種情況都要先停下來人工檢查，不要跳過。
      - listitem [ref=e231]: 抽查一題個位數題號（如 Q1）、一題兩位數題號（如 Q50），確認題號真的不見了，而且沒有留下半個數字的殘影。
      - listitem [ref=e232]: 抽查至少一張有 (A)～(D) 選項的圖，確認選項字母都完整保留。
      - listitem [ref=e233]: 抽查一張原本有「【以下空白】」的圖，確認空白已裁掉、內容緊貼底部並留一點呼吸空間。
      - listitem [ref=e234]:
        - text: 整個資料夾掃一次：找找看有沒有圖片底部還留著一整行、跟前後文完全不相關的文字（不是幾個像素的小雜訊）—— 這種情況不是清理階段能安全處理的，代表切題階段的邊界抓錯了，要回頭用
        - code [ref=e235]: slice-exam-pdf
        - text: 重新切那一題，而不是在清理階段硬加規則修。
