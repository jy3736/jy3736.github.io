        - text: 。
      - listitem [ref=e56]:
        - text: 本機已安裝 Python 3，並安裝好三個 skill 腳本需要的套件：
        - generic [ref=e57]:
          - button "📋 複製" [ref=e59] [cursor=pointer]:
            - generic [ref=e60]: 📋
            - generic [ref=e61]: 複製
          - code [ref=e63]: pip install pymupdf pillow numpy
      - listitem [ref=e64]:
        - text: 能開啟終端機（Terminal／PowerShell），並且知道如何切換到專案根目錄（也就是能看到
        - code [ref=e65]: module2/
        - text: 、
        - code [ref=e66]: .claude/
        - text: 這兩個資料夾的那一層）下指令。
      - listitem [ref=e67]: 下載階段（步驟一）需要網路連線，因為要連到技專校院入學測驗中心的網站。
