    - paragraph [ref=e105]:
      - text: 兩組範例資料剛好示範了兩種起點：115 學年度電機與電子群資電類是「從零開始」，三個階段都跑過一次；115 數學(B) 則是「PDF 已經在手上」，直接從步驟二開始 —— 這是因為
      - code [ref=e106]: download-exam-pdf
      - text: 目前只認得「專業科目(一)(二)」，抓不到數學這種共同科目，這一點在步驟一會再說明。
    - heading "步驟一：下載試題與標準答案 PDF" [level=2] [ref=e107]
    - paragraph [ref=e108]: skill：download-exam-pdf
    - paragraph [ref=e109]:
      - text: 這一步的產出，是接下來切題階段要用的原始 PDF。
      - strong [ref=e110]: 如果你手上已經有 PDF 了（例如老師自己保存的考古題），可以直接跳到步驟二。
    - blockquote [ref=e111]:
      - strong [ref=e112]: 目前的能力邊界：
      - text: 這個 skill 只認得成績單頁面上「專業科目(一)」「專業科目(二)」這兩個列標籤，抓不到「數學(A)/(B)/(C)」這類共同科目 —— 這正是範例資料裡數學(B)直接跳過這一步、從切題開始的原因。如果你要練習的是共同科目，請自行到網站上手動下載 PDF，再從步驟二開始。
    - heading "用一句話請 Claude Code 做" [level=3] [ref=e113]
    - generic [ref=e114]:
      - button "📋 複製" [ref=e116] [cursor=pointer]:
