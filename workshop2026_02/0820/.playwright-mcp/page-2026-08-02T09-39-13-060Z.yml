          - text: 如果你希望 Codex 一律用繁體中文，就保留
          - code [ref=f2e57]: Use Traditional Chinese by default.
        - listitem [ref=f2e58]:
          - text: 如果你希望 Codex 不要大幅重寫文章，就保留
          - code [ref=f2e59]: Do not rewrite the whole file unless the user asks.
        - listitem [ref=f2e60]: 如果你只是做短練習，可以把規則維持在 20 行以內。
      - paragraph [ref=f2e61]: 不要一開始就寫太多規則。規則越多，越難看懂，也越不容易維護。
