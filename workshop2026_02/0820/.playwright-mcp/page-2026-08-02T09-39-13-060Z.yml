            - generic [ref=f2e49]: 複製
        - code [ref=f2e51]: "# AGENTS.md ## Project This is a simple Codex project. ## Language - Use Traditional Chinese by default. - Use clear and beginner-friendly wording. ## Working Rules - Read the relevant file before editing it. - Make small and focused changes. - Do not rewrite the whole file unless the user asks. - Do not delete files unless the user clearly asks. - Ask before making broad changes. ## Output - Keep new files in this project folder unless the user asks for another location. - Use clear filenames. - Explain what changed after finishing. ## Verification - Check that edited or created files exist. - Check that the content matches the user's request. - Tell the user if something could not be checked."
      - paragraph [ref=f2e52]: 這份規則適合大多數練習。它的重點不是限制 Codex，而是讓 Codex 知道：要先看檔案、改小一點、不要亂刪、完成後要回報。
