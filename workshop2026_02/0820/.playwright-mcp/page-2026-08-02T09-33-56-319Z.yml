      - heading "練習目標" [level=2] [ref=f5e20]
      - paragraph [ref=f5e21]:
        - text: Module 3 全部練習預計 30～40 分鐘完成，本頁是第一部分：練習用一段自然語言指令，請 Codex 到官方網站下載統測歷屆考古題，並依年份整理成資料夾。不需要先設計複雜的分步驟 prompt，直接告訴 Codex 你要什麼結果就好。完成本頁後，可以接著做第二部分：
        - link "Codex 統測試題切題與答案鍵練習" [ref=f5e22] [cursor=pointer]:
          - /url: codex-exam-question-crop-practice.html
        - text: ，把下載好的試題 PDF 切成一題一張圖片，並建立 JSON 格式答案鍵。
      - paragraph [ref=f5e23]: 完成後你應該能夠：
      - list [ref=f5e24]:
        - listitem [ref=f5e25]: 用一段自然語言指令，請 Codex 到技專校院入學測驗中心官網下載指定學年度、指定科目群的試題與標準答案。
        - listitem [ref=f5e26]: 請 Codex 依你指定的規則，把下載的檔案依年份整理成資料夾。
        - listitem [ref=f5e27]: 檢查下載結果是否齊全：每個學年度該有的檔案是不是都在。
        - listitem [ref=f5e28]: 比較簡易版、詳細版與網站操作版 Prompt 的差異，判斷什麼時候該把細節講清楚、什麼時候該把「怎麼做」留給 Codex 自己判斷。
      - heading "練習範圍與資料夾結構" [level=2] [ref=f5e29]
      - paragraph [ref=f5e30]: 本次練習以下面的範圍為例，你也可以換成別的科目群：
      - table [ref=f5e32]:
        - rowgroup [ref=f5e33]:
          - row [ref=f5e34]:
            - columnheader "項目" [ref=f5e35]
            - columnheader "內容" [ref=f5e36]
        - rowgroup [ref=f5e37]:
          - row [ref=f5e38]:
            - cell "考試" [ref=f5e39]
            - cell "四技二專統一入學測驗（統測）" [ref=f5e40]
          - row [ref=f5e41]:
            - cell "科目群" [ref=f5e42]
            - cell "電機與電子群資電類" [ref=f5e43]
          - row [ref=f5e44]:
            - cell "學年度" [ref=f5e45]
            - cell "111、112、113、114、115（共 5 個學年度）" [ref=f5e46]
          - row [ref=f5e47]:
            - cell "要下載的檔案" [ref=f5e48]
            - cell "專業科目(一)試題、專業科目(二)試題、專業科目(一)答案、專業科目(二)答案（每個學年度 4 個檔案）" [ref=f5e49]
      - paragraph [ref=f5e50]: 下載完成後，請 Codex 依照學年度建立資料夾，例如：
      - code [ref=f5e52]: 111/ 專業一題目.pdf 專業二題目.pdf 專業一答案.pdf 專業二答案.pdf 112/ ... 115/（同樣四個檔案）
      - blockquote [ref=f5e53]:
        - paragraph [ref=f5e54]: 這些試題與答案是技專校院入學測驗中心官網公開、免登入提供的考古題資料，練習時不需要繞過任何登入或驗證碼。
      - heading "參考 Prompt" [level=2] [ref=f5e55]
      - heading "網站操作版" [level=3] [ref=f5e56]
      - paragraph [ref=f5e57]: 如果想寫得像傳統爬蟲腳本一樣精確，甚至可以連網址、要點哪一個連結都寫死。這種寫法在網站介面沒變的時候最可靠，但只要官網改版、連結文字換了，整段 Prompt 就可能直接卡住。
      - button "📋 複製" [ref=f5e59] [cursor=pointer]:
        - generic [ref=f5e60]: 📋
        - generic [ref=f5e61]: 複製
      - code [ref=f5e63]: "請依照以下步驟操作，下載 111 到 115 學年度統測「電機與電子群資電類」的專業科目(一)(二)試題與標準答案： 1. 開啟 https://www.tcte.edu.tw/index.php?mod=TVETest%2Fdown_exam4y 這是「技專校院入學測驗中心：四技二專試題下載」列表頁，裡面是一個依學年度排列的表格。 2. 對於每個目標學年度（111、112、113、114、115），在表格中找到「年度」欄等於該學年度的那一列， 點擊該列「試題答案及組距」欄位的「查閱」連結。 這會開啟 https://web1.tcte.edu.tw/EXAM/{學年度}_4y/ 這個頁面（例如 115 學年度是 https://web1.tcte.edu.tw/EXAM/115_4y/）。 3. 在該學年度頁面中，找到「04 電機與電子群資電類」這個科目群的區塊，裡面會列出： - 專業科目(一)試題 - 專業科目(一)標準答案 - 專業科目(二)試題 - 專業科目(二)標準答案 每個項目通常同時提供 PDF 和 Word（docx）兩種格式；如果兩種都有，請下載 PDF， 因為官網有註明「請以PDF檔案為準」。只有在沒有 PDF 時才下載 Word 檔。 4. 下載完成後，依照學年度整理成資料夾，資料夾名稱用學年度數字（111、112、113、114、115）， 每個資料夾裡放該學年度的「專業一題目」「專業二題目」「專業一答案」「專業二答案」四個檔案。 5. 如果某個學年度的頁面版面跟上面描述的不一樣（例如連結文字換了、找不到「查閱」連結、 科目群代碼不是 04），請停下來、描述你實際看到的畫面，不要用猜的硬點下去，也不要跳過。"
      - heading "詳細版" [level=3] [ref=f5e64]
      - paragraph [ref=f5e65]: 先看一個把細節都寫清楚的版本：說明要去哪裡找、限定科目群與學年度範圍、逐一列出每年要下載的 4 個檔案、交代資料夾與檔名規則，並要求 Codex 遇到缺漏要主動回報、完成後給一份檢查清單。
      - button "📋 複製" [ref=f5e67] [cursor=pointer]:
        - generic [ref=f5e68]: 📋
        - generic [ref=f5e69]: 複製
      - code [ref=f5e71]: 請到「技專校院入學測驗中心」官方網站，找到四技二專統一入學測驗（統測）的歷屆試題／考古題下載頁面。 目標科目群：電機與電子群資電類 目標學年度：111、112、113、114、115 學年度（共 5 個學年度） 請依序處理每個學年度，下載以下 4 個檔案： 1. 專業科目(一)試題 2. 專業科目(二)試題 3. 專業科目(一)標準答案 4. 專業科目(二)標準答案 其他科目（例如共同科目、術科、其他群別）不用下載。 下載完成後，請依照學年度整理成資料夾，資料夾名稱直接用學年度數字（111、112、113、114、115）， 每個資料夾裡放該學年度的「專業一題目」「專業二題目」「專業一答案」「專業二答案」四個檔案， 檔名請清楚標示是題目還是答案、是專業一還是專業二。 處理過程請注意： - 這些資料是官網公開、免登入即可下載的考古題，不需要登入帳號、繞過驗證碼，也不要嘗試存取任何需要權限的頁面。 - 如果某個學年度在官網上找不到對應檔案（例如尚未公告或格式不同），請明確告訴我是哪個學年度、哪個檔案缺漏，不要略過不提。 - 全部下載整理完成後，請列出一份檢查清單，逐一確認 5 個學年度、20 個檔案是否都已到位。
      - heading "簡易版" [level=3] [ref=f5e72]
      - paragraph [ref=f5e73]: 同一個任務也可以只講你要的結果，把「怎麼做」留給 Codex 自己判斷：
      - button "📋 複製" [ref=f5e75] [cursor=pointer]:
        - generic [ref=f5e76]: 📋
        - generic [ref=f5e77]: 複製
      - code [ref=f5e79]: 請到技專校院入學測驗中心的網站，幫我下載 111 到 115 學年度統測「電機與電子群資電類」的資料。 我只需要專業科目(一)、專業科目(二)的試題，還有這兩科的標準答案。 下載好之後，依照學年度整理，一個學年度一個資料夾，資料夾名稱用 111、112 這樣， 裡面放專業一題目、專業二題目、專業一答案、專業二答案。
      - blockquote [ref=f5e80]:
        - paragraph [ref=f5e81]:
          - strong [ref=f5e82]: 三種寫法怎麼選？
          - text: 「網站操作版」把網址、要點哪個連結都寫死，這就是傳統爬蟲腳本的寫法——網站介面不變時最穩定，但官網一旦改版、連結文字或版面換了，整段 Prompt 可能直接卡住，因為它被綁死在你當初看到的那個畫面上。「詳細版」只講規則和驗收標準（科目群、學年度範圍、要幾個檔案、遇到缺漏怎麼辦），不綁定網站的操作細節，Codex 可以自己判斷去哪裡找、按鈕文字換了也能自己摸索。「簡易版」連規則都不講，只講你要的結果，把「怎麼做」完全留給 Codex——它有最大的空間自己摸索網站介面、嘗試不同做法，有時候反而能找到更好的路徑，但驗收標準也最模糊，比較難確認做得夠不夠完整。多數時候，介於詳細版和簡易版之間最實用：講清楚你要什麼結果、什麼算做完，但不要規定 Codex 該怎麼操作網站。
      - heading "檢查重點" [level=2] [ref=f5e83]
      - list [ref=f5e84]:
        - listitem [ref=f5e85]: 5 個學年度都有各自的資料夾，資料夾名稱一致（例如「111」）。
        - listitem [ref=f5e86]: 每個學年度資料夾裡有 4 個檔案：專業一題目、專業二題目、專業一答案、專業二答案。
        - listitem [ref=f5e87]: 如果某個學年度找不到檔案，Codex 有明確說明，而不是悄悄跳過。
        - listitem [ref=f5e88]: Codex 沒有嘗試登入、繞過驗證碼或存取非公開頁面。
      - heading "反思問題" [level=2] [ref=f5e89]
      - list [ref=f5e90]:
        - listitem [ref=f5e91]: 如果只用瀏覽器手動下載，這 5 個學年度、20 個檔案要花多少時間？跟請 Codex 做比起來差在哪裡？
        - listitem [ref=f5e92]: 如果要換成別的科目群（例如機械群），這段 Prompt 只需要改哪一個詞？
        - listitem [ref=f5e93]: 詳細版把步驟都寫清楚，一定比簡易版可靠嗎？如果詳細版寫的步驟跟官網實際介面不符，會發生什麼事？
        - listitem [ref=f5e94]: 如果技專校院入學測驗中心明年改版，把「查閱」改成別的字、頁面版面也不一樣了，網站操作版的 Prompt 會發生什麼事？簡易版又會發生什麼事？
    - contentinfo [ref=f5e95]: 智慧雨林產業創生人才育成計畫 (南臺科技大學 電子系 楊榮林 教授)