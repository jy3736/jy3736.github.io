        - text: 修改設定檔（例如
        - code [ref=e164]: config.json
        - text: ）裡的答案檔檔名與考試名稱，指到新的一週。
      - listitem [ref=e165]: 回到「本機測試你的網頁」重新測試一次，確認換題庫後網頁不用改程式碼就能正常運作。
    - blockquote [ref=e166]: 如果任務卡 1 做出來的網頁沒有這種「設定檔」，題庫檔名是寫死在程式碼裡，可以用任務卡 4（除錯任務卡）請 AI Agent 補上：「情境：目前題庫檔名寫死在程式碼裡，我想改成一個設定檔案，換題目時不用改程式碼」。
    - heading "打包成單一檔案，方便發送" [level=2] [ref=e167]
    - paragraph [ref=e168]: 前面提過，瀏覽器會擋掉本機網頁讀取本機 JSON／圖片檔的行為，所以「一個 HTML 檔案＋一個資料夾」的形式並不適合直接發給學員雙擊使用。實際要發送時，建議打包成一個「圖片都內嵌在裡面」的單一 HTML 檔案。
    - heading "做法 A：直接使用現成的打包程式（推薦）" [level=3] [ref=e169]
    - code [ref=e171]: cd module1/app python3 build_bundle.py
    - paragraph [ref=e172]:
      - text: 執行後，
      - code [ref=e173]: dist/
      - text: 資料夾底下會出現一個以考試名稱命名的
      - code [ref=e174]: .html
      - text: 檔案，圖片都已經內嵌在檔案裡（這份題庫打包後大約 15 MB）。學員只要拿到這一個檔案，雙擊就能開啟使用，不需要另外附上圖片資料夾或架設伺服器。
    - heading "做法 B：想自己練習 vibe coding，讓 AI Agent 幫你寫打包程式" [level=3] [ref=e175]
    - generic [ref=e176]:
      - button "📋 複製" [ref=e178] [cursor=pointer]:
        - generic [ref=e179]: 📋
        - text: 複製
      - code [ref=e181]: 目標：請幫我寫一支 Python 腳本，把 quiz.html、設定檔、指定的 keys.json 和 assets/repo 底下用到的圖片，全部打包成一個獨立的 HTML 檔案。 限制： - 圖片要轉成 base64 內嵌進去，讓使用者不需要伺服器、直接雙擊這個檔案就能 開啟並正常運作。 - 輸出檔案放在 dist/ 資料夾，檔名包含考試名稱。 - 原本的 quiz.html（可讀取本機檔案的版本）保持不動，方便我平常編輯測試。 完成標準：執行這支腳本後，dist/ 底下產生的 HTML 檔案可以直接雙擊開啟， 題目圖片正常顯示，作答與批閱功能都正常。
    - heading "驗收清單" [level=2] [ref=e182]
    - list [ref=e183]:
      - listitem [ref=e184]: ☐ 打開網頁可以看到全部題目與 A/B/C/D 選項按鈕。
      - listitem [ref=e185]: ☐ 可以輸入姓名、設定題數，按「開始作答」後隨機抽題。
      - listitem [ref=e186]: ☐ 送出前，畫面上完全看不到任何答案、分數或對錯提示。
      - listitem [ref=e187]: ☐ 送出後顯示：答對題數、總分、每一題的正確答案與對錯（多選題要「完全符合」才算對）。
      - listitem [ref=e188]: ☐ 可以「重新測驗」，換一組新題目再作答一次。
      - listitem [ref=e189]: ☐ 可以把成績單下載成 CSV。
      - listitem [ref=e190]: ☐ 老師端彙整頁可以匯入多份 CSV，顯示每位學生分數與每題全班答對率。
      - listitem [ref=e191]: ☐ 題庫資料（圖片、keys.json、設定檔）與網頁程式碼是分開的檔案，方便下週換題庫。
      - listitem [ref=e192]: ☐ 全程不需要連網、不需要伺服器、不需要登入帳號。
