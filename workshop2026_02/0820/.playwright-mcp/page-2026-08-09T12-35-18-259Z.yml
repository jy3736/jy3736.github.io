    - heading "使用定位提醒" [level=2] [ref=e229]
    - list [ref=e230]:
      - listitem [ref=e231]: 本工具定位為課後自主練習，不是正式成績判定或高風險測驗。
      - listitem [ref=e232]: 學員可能直接用 AI 找到答案，這是自主練習環境本來就存在的限制，不需要用複雜的技術強行防堵。
      - listitem [ref=e233]: 題目與答案的正確性，最終仍須由教師檢核；不要把 AI 產生或修改過的內容未經確認就直接當作正式評量使用。
