      - listitem [ref=e98]: ☐ 送出後才顯示：總分、每一題「你的答案 / 正確答案 / 對或錯」。
      - listitem [ref=e99]: ☐ 可以「重新測驗」，換一組新題目再作答一次。
      - listitem [ref=e100]: ☐ 可以把成績單下載成檔案（例如 CSV），方便回傳給老師。
      - listitem [ref=e101]: ☐ 老師端有另一個網頁，可以匯入很多份成績單，看到全班成績與每題答對率。
      - listitem [ref=e102]: ☐ 全程不需要連網、不需要伺服器、不需要任何登入帳號。
      - listitem [ref=e103]: ☐ 題庫資料（圖片、正確答案）與網頁程式碼放在不同檔案，方便以後換題目。
    - heading "任務卡工作流程（4 張，建議依序使用）" [level=2] [ref=e104]
    - paragraph [ref=e105]: 每張任務卡都採用「目標／情境／限制／完成標準」的固定格式：先讓 AI Agent 知道要做什麼、給它必要的背景，明確畫出限制的紅線，最後用「完成標準」逐條驗收，而不是畫面「看起來能動」就結束。把任務卡內容複製貼給你的 AI Agent，並附上題庫檔案或路徑說明即可。
    - heading "任務卡 1：產生第一版練習網頁" [level=3] [ref=e106]
    - generic [ref=e107]:
      - button "📋 複製" [ref=e109] [cursor=pointer]:
        - generic [ref=e110]: 📋
        - text: 複製
      - code [ref=e112]: 目標：請幫我用一個 HTML 檔案（搭配題庫的 JSON/JS 檔）做一個靜態網頁自主練習小工具， 讓使用者能從題庫中隨機抽題作答。 情境：使用者是我的學生，用筆電或手機瀏覽器開啟這個網頁，不需連網、不需伺服器、 不需安裝任何軟體。題庫是圖片檔（每題一張 PNG，題幹和選項都已經印在圖片裡）， 不是純文字題目。 限制： - 純前端（HTML+CSS+JS），不使用需要網路或伺服器的功能。 - 題庫資料（圖片檔案清單、正確答案）與網頁程式碼分開放，方便我之後更換題目。 - 題庫資料夾格式：assets/repo/ 底下是題目圖片，檔名規則是「學年度專業科目Q題號.png」 （例如 115專業1Q7.png）；assets/115keys.json 是檔名對正確答案的對照表，答案通常是 單一字母（A/B/C/D），但可能出現兩個字母（例如 "AD"），要能同時處理單選和多選。 - 畫面上要有：讓使用者輸入姓名或學號、選擇本次要練習幾題（可以少於題庫全部題數）。 - 每題用 4 個可點選的按鈕（A/B/C/D）讓使用者選答案，不要限制只能選一個， 因為可能是多選題。 - 學生作答與送出前，畫面上不能出現任何答案、分數或對錯提示。 完成標準（我會逐條測試）： 1. 打開網頁可以看到題目圖片與 A/B/C/D 四個按鈕。 2. 可以輸入姓名、選擇題數，按「開始作答」後隨機抽出指定題數的題目。 3. 送出前，畫面上找不到任何答案或分數資訊。 4. 題庫資料和網頁程式碼是分開的兩個檔案（例如 quiz.html 和 config.json / keys.json）。 ［附上你的 module1/assets/115keys.json 內容，或直接說明檔名規則與存放路徑］
    - heading "任務卡 2：加上「送出後才批閱」邏輯（安全底線）" [level=3] [ref=e113]
    - generic [ref=e114]:
      - button "📋 複製" [ref=e116] [cursor=pointer]:
        - generic [ref=e117]: 📋
        - text: 複製
      - code [ref=e119]: 目標：請在剛剛的練習網頁上，加上「送出作答」按鈕，送出後才批改並顯示結果。 情境：這是今天最重要的功能——送出前絕對不能洩漏答案，送出後才顯示批改結果， 讓學生可以看到自己哪裡答錯、正確答案是什麼。 限制： - 送出前：畫面上不能出現任何答案、分數、對錯提示。 - 送出後才顯示：本次總分（答對題數／總題數）、每一題「你的答案」、「正確答案」、 「答對／答錯」。 - 判斷對錯時，如果正確答案是多個字母（例如 "AD"），必須「完全符合」（選到的字母 組合和正確答案的字母組合一模一樣）才算對，不是選到其中一個字母就算對。 例如 115專業2Q8.png 正確答案是 AD，只選 A 或只選 D 都要算答錯。 - 加上「重新測驗」按鈕，按下後可以換一組新的隨機題目重新作答。 - 只調整送出、批閱、重新測驗這幾個部分，不要更動已經正常運作的功能 （例如抽題、答案按鈕）。 完成標準（我會逐條測試）： 1. 作答到一半重新整理網頁前，畫面上都看不到任何答案或分數。 2. 送出後，畫面顯示總分與每一題的「你的答案 / 正確答案 / 對或錯」。 3. 刻意漏答一題再送出，這一題會被判定為答錯，不會讓程式當掉或跳過。 4. 按下「重新測驗」，畫面回到未作答狀態，且抽到的題目和上一輪不完全相同。
    - blockquote [ref=e120]: 這是今天「非改不可」的項目——送出前答案外洩，會讓整個自主練習失去意義，值得優先確保這張任務卡完全過關，其餘美化可以晚一點再做。
    - heading "任務卡 3：加上下載成績單與教師彙整頁" [level=3] [ref=e121]
    - generic [ref=e122]:
      - button "📋 複製" [ref=e124] [cursor=pointer]:
        - generic [ref=e125]: 📋
        - text: 複製
      - code [ref=e127]: 目標：請幫我加上兩個功能：(1) 學生可以把剛剛的批改結果下載成一份 CSV 成績單； (2) 另外做一個給老師用的網頁，可以把很多份學生的 CSV 成績單匯整成一份 全班成績報表。 情境：這個練習小工具沒有連網、沒有伺服器，學生各自在自己電腦上作答；老師要收集 全班成績，只能靠學生把「下載的成績單檔案」傳回來（例如用班級群組、雲端硬碟）， 老師端需要一個同樣不需連網、不需伺服器的網頁把這些檔案在瀏覽器裡合併起來看。 限制： - 學生端「下載成績單」：按下後產生一份 CSV 檔案，內容至少包含：姓名、時間、 每一題的題號、我的答案、正確答案、對或錯、總分。檔名要包含姓名和時間， 避免多人下載時互相覆蓋。 - 老師端彙整頁是另一個獨立的 HTML 檔案（例如 report-aggregator.html）， 不需要伺服器，用「選擇檔案」或「拖曳檔案」的方式一次匯入多份學生的 CSV。 - 彙整頁要能顯示：每位學生的分數列表、以及每一題全班的答對率（方便老師知道 哪一題大家普遍答錯）。 - 老師端也不用連網、不上傳到任何伺服器，所有整理都在瀏覽器裡完成。 完成標準（我會逐條測試）： 1. 送出作答後，按下「下載成績單」會下載一份看得懂的 CSV 檔案。 2. 把兩、三份不同姓名的 CSV 檔案丟進彙整頁，畫面會顯示每位學生的分數， 以及每一題的全班答對率。 3. 彙整頁重新整理或關掉瀏覽器後再打開，不會用到任何登入或伺服器， 仍然可以正常匯入 CSV。
    - heading "任務卡 4：除錯任務卡（卡關時使用）" [level=3] [ref=e128]
    - generic [ref=e129]:
      - button "📋 複製" [ref=e131] [cursor=pointer]:
        - generic [ref=e132]: 📋
        - text: 複製
      - code [ref=e134]: 目標：網頁目前有個問題，請協助修正。 情境（目前狀況 vs 預期狀況）： - 目前狀況：＿＿＿（描述實際發生的畫面或行為，最好附截圖） - 預期狀況：＿＿＿（描述你期望看到的畫面或行為） 限制：請只修改需要變動的部分，不要更動其他已經正常運作的功能。 完成標準：修正後重新整理網頁，上述問題不再出現，且原本正常的功能維持正常。
    - heading "本機測試你的網頁" [level=2] [ref=e135]
    - paragraph [ref=e136]:
      - text: 如果 AI Agent 產生的網頁是用
