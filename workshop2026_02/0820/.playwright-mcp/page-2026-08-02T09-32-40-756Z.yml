  - generic [ref=f1e17]:
    - generic [ref=f1e18]:
      - heading "Windows 11 Vibe Coding 與 AI Agent 環境建置" [level=1] [ref=f1e19]
      - paragraph [ref=f1e20]: 本模組聚焦在 Windows 11 筆電上的 Vibe Coding 與 AI Agent 工作環境建置。先安裝 ChatGPT 桌面 app，再用一鍵安裝腳本準備開發工具；最後以 Chat、ChatGPT Work 與 Codex 的正確工作介面完成幾個小型驗證任務。
      - heading "學習目標 (Learning Objectives)" [level=2] [ref=f1e21]
      - paragraph [ref=f1e22]: 完成本模組後，教師應能：
      - list [ref=f1e23]:
        - listitem [ref=f1e24]: 在自己的 Windows 11 筆電上獨立啟動可運作的 Vibe Coding 與 AI Agent 工作環境。
        - listitem [ref=f1e25]: 使用 ChatGPT 桌面 app 的 Chat、ChatGPT Work 與 Codex 工作介面，依任務選擇適合的入口。
        - listitem [ref=f1e26]: 使用 VS Code 作為主要開發介面，搭配 Codex CLI 與 Codex 擴充套件進行程式生成、修改與檢查。
        - listitem [ref=f1e27]: 使用 uv 與 npm 管理 Python 與 Node.js 的套件及專案環境。
        - listitem [ref=f1e28]:
          - text: 透過 GitHub CLI (
          - code [ref=f1e29]: gh
          - text: ) 以瀏覽器登入 GitHub，完成專案 clone、推送與 GitHub Pages 部署。
        - listitem [ref=f1e30]: 依據 checklist 自行驗證環境，並排除常見安裝問題。
      - heading "先備條件 (Prerequisites)" [level=2] [ref=f1e31]
      - table [ref=f1e33]:
        - rowgroup [ref=f1e34]:
          - row [ref=f1e35]:
            - columnheader "項目" [ref=f1e36]
            - columnheader "說明" [ref=f1e37]
        - rowgroup [ref=f1e38]:
          - row [ref=f1e39]:
            - cell "個人筆電" [ref=f1e40]
            - cell "Windows 11，具系統管理 (安裝軟體) 權限" [ref=f1e41]
          - row [ref=f1e42]:
            - cell "網路" [ref=f1e43]
            - cell "可連線下載安裝套件與存取 AI 服務" [ref=f1e44]
          - row [ref=f1e45]:
            - cell "ChatGPT 帳號" [ref=f1e46]
            - cell "可使用 Codex 的 ChatGPT 帳號；先登入 ChatGPT 桌面 app。實際可用功能依方案、工作區與推出狀況而異，CLI 與 VS Code 擴充套件可使用同一登入帳號。" [ref=f1e47]
          - row [ref=f1e48]:
            - cell "GitHub 帳號" [ref=f1e49]
            - cell "供 GitHub CLI 登入、clone 專案與部署 GitHub Pages 使用" [ref=f1e50]
          - row [ref=f1e51]:
            - cell "基本操作" [ref=f1e52]
            - cell "能開啟終端機 (terminal) 並輸入指令" [ref=f1e53]
      - heading "最低電腦需求 (Minimum Computer Requirements)" [level=2] [ref=f1e54]
      - paragraph [ref=f1e55]: 本工作坊會同時開啟 VS Code、Node.js、Python、終端機與瀏覽器登入頁面，建議筆電至少符合下列規格。標示「建議」者為較順暢的體驗門檻。
      - table [ref=f1e57]:
        - rowgroup [ref=f1e58]:
          - row [ref=f1e59]:
            - columnheader "項目" [ref=f1e60]
            - columnheader "最低需求" [ref=f1e61]
            - columnheader "建議" [ref=f1e62]
        - rowgroup [ref=f1e63]:
          - row [ref=f1e64]:
            - cell "作業系統" [ref=f1e65]
            - cell "Windows 11 (64 位元)，並已安裝 App Installer (winget)" [ref=f1e66]
            - cell "Windows 11 且更新至最新版" [ref=f1e67]
          - row [ref=f1e68]:
            - cell "處理器" [ref=f1e69]
            - cell "64 位元 x64 雙核心" [ref=f1e70]
            - cell "四核心以上" [ref=f1e71]
          - row [ref=f1e72]:
            - cell "記憶體 (RAM)" [ref=f1e73]
            - cell "8 GB" [ref=f1e74]
            - cell "16 GB" [ref=f1e75]
          - row [ref=f1e76]:
            - cell "可用磁碟空間" [ref=f1e77]
            - cell "10 GB" [ref=f1e78]
            - cell "20 GB 以上" [ref=f1e79]
          - row [ref=f1e80]:
            - cell "權限" [ref=f1e81]
            - cell "具系統管理員權限 (可安裝軟體、允許 UAC)" [ref=f1e82]
            - cell "同左" [ref=f1e83]
          - row [ref=f1e84]:
            - cell "網路" [ref=f1e85]
            - cell "穩定寬頻，可存取 GitHub 與 AI 服務" [ref=f1e86]
            - cell "同左" [ref=f1e87]
          - row [ref=f1e88]:
            - cell "瀏覽器" [ref=f1e89]
            - cell "Microsoft Edge 或 Chrome (供登入流程使用)" [ref=f1e90]
            - cell "同左" [ref=f1e91]
      - blockquote [ref=f1e92]:
        - paragraph [ref=f1e93]: 8 GB 記憶體可完成所有任務，但同時開啟 VS Code、瀏覽器與多個終端機時，16 GB 會明顯較順暢。磁碟空間需求包含工具鏈、專案的 node_modules 與 Python 套件。
      - heading "安裝的工具 (Toolchain)" [level=2] [ref=f1e94]
      - paragraph [ref=f1e95]: Windows 11 一鍵安裝腳本與課後指南會在筆電上安裝下列工具：
      - table [ref=f1e97]:
        - rowgroup [ref=f1e98]:
          - row [ref=f1e99]:
            - columnheader "工具" [ref=f1e100]
            - columnheader "用途" [ref=f1e101]
        - rowgroup [ref=f1e102]:
          - row [ref=f1e103]:
            - cell "VS Code" [ref=f1e104]
            - cell "程式碼編輯器，也是日後操作 AI Agent 的主要視窗" [ref=f1e105]
          - row [ref=f1e106]:
            - cell "Git" [ref=f1e107]
            - cell "版本管理工具，許多 AI 工具會用到" [ref=f1e108]
          - row [ref=f1e109]:
            - cell "Node.js + npm" [ref=f1e110]
            - cell "JavaScript 執行環境，用來啟動 local web server 與安裝 Codex CLI" [ref=f1e111]
          - row [ref=f1e112]:
            - cell "uv (Python)" [ref=f1e113]
            - cell "管理 Python 與套件，安裝／更新／移除都很簡單" [ref=f1e114]
          - row [ref=f1e115]:
            - cell "ChatGPT 桌面 app" [ref=f1e116]
            - cell "Windows 上的 Chat、ChatGPT Work 與 Codex 入口；可開啟專案、查看變更與使用整合終端機。" [ref=f1e117]
          - row [ref=f1e118]:
            - cell "Codex CLI（終端機工作流程）" [ref=f1e119]
            - cell "OpenAI 的 AI Agent 命令列工具；適合需要直接在終端機操作專案的課程練習。先以可使用 Codex 的 ChatGPT 帳號登入，實際功能依帳號與工作區而異。" [ref=f1e120]
          - row [ref=f1e121]:
            - cell "GitHub CLI (gh)" [ref=f1e122]
            - cell "用瀏覽器登入 GitHub，clone 專案、推送與部署 GitHub Pages" [ref=f1e123]
          - row [ref=f1e124]:
            - cell "VS Code 擴充套件" [ref=f1e125]
            - cell "Python、Jupyter、GitLens、ESLint，以及 Codex 編程代理 (openai.chatgpt)" [ref=f1e126]
      - heading "實作流程 (Hands-on Activities)" [level=2] [ref=f1e127]
      - heading [level=3] [ref=f1e128]:
        - text: 1. 使用
        - code [ref=f1e129]: setup-windows.bat
        - text: 一鍵安裝
      - paragraph [ref=f1e130]:
        - text: 優先使用本模組提供的
        - link "setup-windows.bat" [ref=f1e131] [cursor=pointer]:
          - /url: setup-windows.bat
        - text: 。這個批次檔會檢查
        - code [ref=f1e132]: winget
        - text: ，再依序安裝 VS Code、Git、Node.js LTS、uv、GitHub CLI、ChatGPT 桌面 app、Codex CLI 與常用 VS Code 擴充套件。腳本可重複執行；已安裝的項目會自動略過。
      - paragraph [ref=f1e133]: 建議操作：
      - list [ref=f1e134]:
        - listitem [ref=f1e135]:
          - text: 下載
          - link "setup-windows.bat" [ref=f1e136] [cursor=pointer]:
            - /url: setup-windows.bat
          - text: ，或將檔案放到容易找到的位置，例如
          - code [ref=f1e137]: Downloads
          - text: 。
        - listitem [ref=f1e138]: 以滑鼠雙擊執行，或在 PowerShell 執行：
      - code [ref=f1e140]: "& \"$HOME\\Downloads\\setup-windows.bat\""
      - list [ref=f1e141]:
        - listitem [ref=f1e142]: 若使用 Command Prompt，執行：
      - code [ref=f1e144]: "\"%USERPROFILE%\\Downloads\\setup-windows.bat\""
      - list [ref=f1e145]:
        - listitem [ref=f1e146]: 腳本結束後，關閉並重新開啟 PowerShell 或 Command Prompt，讓 PATH 設定生效。
        - listitem [ref=f1e147]: 重新執行下列檢查指令，確認主要工具都能被系統找到：
      - code [ref=f1e149]: code --version git --version node --version npm --version uv --version gh --version codex --version
      - paragraph [ref=f1e150]:
        - text: 若腳本顯示
        - code [ref=f1e151]: winget not found
        - text: ，請先安裝或更新 Windows 的 App Installer，完成後再重新執行批次檔。
      - heading "2. 手動下載與安裝必要工具" [level=3] [ref=f1e152]
      - paragraph [ref=f1e153]:
        - text: 若一鍵安裝失敗，或教師的筆電受學校 IT 權限限制，可改用手動安裝。建議仍優先使用
        - code [ref=f1e154]: winget
        - text: 指令；若
        - code [ref=f1e155]: winget
        - text: 不可用，再從官方下載頁面安裝。
      - table [ref=f1e157]:
        - rowgroup [ref=f1e158]:
          - row [ref=f1e159]:
            - columnheader "工具" [ref=f1e160]
            - columnheader "官方下載／說明" [ref=f1e161]
            - columnheader "建議指令或手動操作" [ref=f1e162]
        - rowgroup [ref=f1e163]:
          - row [ref=f1e164]:
            - cell "App Installer / winget" [ref=f1e165]
            - cell [ref=f1e166]:
              - link "https://learn.microsoft.com/windows/msix/app-installer/install-update-app-installer" [ref=f1e167] [cursor=pointer]:
                - /url: https://learn.microsoft.com/windows/msix/app-installer/install-update-app-installer
            - cell [ref=f1e168]:
              - text: Windows 11 通常已內建。若
              - code [ref=f1e169]: winget --version
              - text: 無法執行，請從 Microsoft Store 安裝或更新 App Installer。
          - row [ref=f1e170]:
            - cell "ChatGPT 桌面 app" [ref=f1e171]
            - cell [ref=f1e172]:
              - link "OpenAI：ChatGPT desktop app for Windows" [ref=f1e173] [cursor=pointer]:
                - /url: https://get.microsoft.com/installer/download/9PLM9XGG6VKS?cid=website_cta_psi
            - cell [ref=f1e174]:
              - code [ref=f1e175]: winget install --id 9PLM9XGG6VKS --source msstore
              - text: ，或從 Microsoft Store 安裝。安裝後開啟 app，使用 ChatGPT 帳號登入。
          - row [ref=f1e176]:
            - cell "VS Code" [ref=f1e177]
            - cell [ref=f1e178]:
              - link "https://code.visualstudio.com/download" [ref=f1e179] [cursor=pointer]:
                - /url: https://code.visualstudio.com/download
            - cell [ref=f1e180]:
              - code [ref=f1e181]: winget install --id Microsoft.VisualStudioCode --source winget --exact
          - row [ref=f1e182]:
            - cell "Git for Windows" [ref=f1e183]
            - cell [ref=f1e184]:
              - link "https://git-scm.com/downloads/win" [ref=f1e185] [cursor=pointer]:
                - /url: https://git-scm.com/downloads/win
            - cell [ref=f1e186]:
              - code [ref=f1e187]: winget install --id Git.Git --source winget --exact
          - row [ref=f1e188]:
            - cell "Node.js LTS + npm" [ref=f1e189]
            - cell [ref=f1e190]:
              - link "https://nodejs.org/en/download" [ref=f1e191] [cursor=pointer]:
                - /url: https://nodejs.org/en/download
            - cell [ref=f1e192]:
              - code [ref=f1e193]: winget install --id OpenJS.NodeJS.LTS --source winget --exact
          - row [ref=f1e194]:
            - cell "uv" [ref=f1e195]
            - cell [ref=f1e196]:
              - link "https://docs.astral.sh/uv/getting-started/installation/" [ref=f1e197] [cursor=pointer]:
                - /url: https://docs.astral.sh/uv/getting-started/installation/
            - cell [ref=f1e198]:
              - code [ref=f1e199]: winget install --id astral-sh.uv --source winget --exact
          - row [ref=f1e200]:
            - cell [ref=f1e201]:
              - text: GitHub CLI (
              - code [ref=f1e202]: gh
              - text: )
            - cell [ref=f1e203]:
              - link "https://cli.github.com/" [ref=f1e204] [cursor=pointer]:
                - /url: https://cli.github.com/
            - cell [ref=f1e205]:
              - code [ref=f1e206]: winget install --id GitHub.cli --source winget --exact
          - row [ref=f1e207]:
            - cell "Codex CLI" [ref=f1e208]
            - cell [ref=f1e209]:
              - link "https://developers.openai.com/codex/cli" [ref=f1e210] [cursor=pointer]:
                - /url: https://developers.openai.com/codex/cli
            - cell [ref=f1e211]:
              - text: 安裝 Node.js 後執行
              - code [ref=f1e212]: npm install -g "@openai/codex"
              - text: ，再執行
              - code [ref=f1e213]: codex
              - text: 登入。
      - paragraph [ref=f1e214]: VS Code 擴充套件可在 VS Code 左側 Extensions 視窗搜尋安裝，也可在終端機逐行執行：
      - code [ref=f1e216]: code --install-extension ms-python.python code --install-extension ms-toolsai.jupyter code --install-extension eamodio.gitlens code --install-extension dbaeumer.vscode-eslint code --install-extension openai.chatgpt
      - paragraph [ref=f1e217]: 手動安裝後，同樣需要關閉並重新開啟終端機，再執行版本檢查：
      - code [ref=f1e219]: code --version git --version node --version npm --version uv --version gh --version codex --version
      - heading "3. 設定 ChatGPT、Work 與 Codex" [level=3] [ref=f1e220]
      - list [ref=f1e221]:
        - listitem [ref=f1e222]: 開啟 ChatGPT 桌面 app 並登入。需要快速問答時選 Chat；要完成研究、文件或可審查的多步驟成果時，先選 ChatGPT，再切換到 Work；要處理課程 project、程式碼、指令與 diff 時，從產品選單選 Codex。
        - listitem [ref=f1e223]:
          - text: 在 Codex 先開啟這次課程唯一的 project 資料夾。傳送第一個任務前，選擇
          - strong [ref=f1e224]: 先要求核准
          - text: （Ask for approval）；不要預設開啟
          - strong [ref=f1e225]: 完整存取權
          - text: （Full access）。完成後檢查核准要求、diff 與輸出檔案。
        - listitem [ref=f1e226]:
          - text: 需要終端機工作流程時，再執行
          - code [ref=f1e227]: codex
          - text: 並以瀏覽器登入可使用 Codex 的 ChatGPT 帳號；同一帳號可同時用於 VS Code 的 Codex 擴充套件。
        - listitem [ref=f1e228]: 若後續任務需要操作瀏覽器，讓 AI Agent 依任務需求自行安裝與設定對應工具即可；本模組不把瀏覽器自動化外掛列為預先安裝項目。
        - listitem [ref=f1e229]:
          - text: 執行 guided「Hello, AI Agent」任務 (請 Agent 建立一個
          - code [ref=f1e230]: hello.txt
          - text: )，確認 AI Agent 能接收指令、產生檔案並回報結果。
      - heading "4. 連結 GitHub 與部署 GitHub Pages" [level=3] [ref=f1e231]
      - list [ref=f1e232]:
        - listitem [ref=f1e233]:
          - text: 執行
          - code [ref=f1e234]: gh auth login
          - text: ，全程以瀏覽器與一次性代碼登入，不需產生 SSH 金鑰或於終端機輸入密碼，並一次設定好 git 認證與提交身分 (user.name / user.email)。
        - listitem [ref=f1e235]:
          - text: 練習
          - code [ref=f1e236]: gh repo clone
          - text: 下載專案，以及用
          - code [ref=f1e237]: gh repo create … --push
          - text: 與 GitHub Pages 把靜態網站發佈成公開網址。
      - heading "5. 四項驗證任務 (Verification Tasks)" [level=3] [ref=f1e238]
      - table [ref=f1e240]:
        - rowgroup [ref=f1e241]:
          - row [ref=f1e242]:
            - columnheader "任務" [ref=f1e243]
            - columnheader "內容" [ref=f1e244]
            - columnheader "驗證重點" [ref=f1e245]
        - rowgroup [ref=f1e246]:
          - row [ref=f1e247]:
            - cell "Python 驗證" [ref=f1e248]
            - cell "以 uv 建立專案並安裝 openpyxl、python-docx，讀取 Excel、整理資料並輸出新的 Excel 檔案" [ref=f1e249]
            - cell "套件與檔案處理可運作" [ref=f1e250]
          - row [ref=f1e251]:
            - cell "Word 驗證" [ref=f1e252]
            - cell "讀取 Word 文件內容，並產生一份修改後的 Word 檔案" [ref=f1e253]
            - cell "Office 文件處理可運作" [ref=f1e254]
          - row [ref=f1e255]:
            - cell "JavaScript 驗證" [ref=f1e256]
            - cell [ref=f1e257]:
              - text: 以
              - code [ref=f1e258]: npx http-server
              - text: 啟動簡單的 local web server，確認 client-side 與 server-side 程式正常執行
            - cell "Node.js 與 local host 可運作" [ref=f1e259]
          - row [ref=f1e260]:
            - cell "Codex 驗證" [ref=f1e261]
            - cell "請 Codex 建立簡單文字檔、修改範例程式或整理指定資料" [ref=f1e262]
            - cell "AI Agent 可讀寫工作區檔案並回報結果" [ref=f1e263]
    - contentinfo [ref=f1e264]: 智慧雨林產業創生人才育成計畫 (南臺科技大學 電子系 楊榮林 教授)