  - generic [ref=f2e17]:
    - generic [ref=f2e18]:
      - heading "Windows 11 Vibe Coding 與 AI Agent 環境建置" [level=1] [ref=f2e19]
      - paragraph [ref=f2e20]: 本模組聚焦在 Windows 11 筆電上的 Vibe Coding 與 AI Agent 工作環境建置。先安裝 ChatGPT 桌面 app，再用一鍵安裝腳本準備開發工具；最後以 Chat、ChatGPT Work 與 Codex 的正確工作介面完成幾個小型驗證任務。
      - heading "學習目標 (Learning Objectives)" [level=2] [ref=f2e21]
      - paragraph [ref=f2e22]: 完成本模組後，教師應能：
      - list [ref=f2e23]:
        - listitem [ref=f2e24]: 在自己的 Windows 11 筆電上獨立啟動可運作的 Vibe Coding 與 AI Agent 工作環境。
        - listitem [ref=f2e25]: 使用 ChatGPT 桌面 app 的 Chat、ChatGPT Work 與 Codex 工作介面，依任務選擇適合的入口。
        - listitem [ref=f2e26]: 使用 VS Code 作為主要開發介面，搭配 Codex CLI 與 Codex 擴充套件進行程式生成、修改與檢查。
        - listitem [ref=f2e27]: 使用 uv 與 npm 管理 Python 與 Node.js 的套件及專案環境。
        - listitem [ref=f2e28]:
          - text: 透過 GitHub CLI (
          - code [ref=f2e29]: gh
          - text: ) 以瀏覽器登入 GitHub，完成專案 clone、推送與 GitHub Pages 部署。
        - listitem [ref=f2e30]: 依據 checklist 自行驗證環境，並排除常見安裝問題。
      - heading "先備條件 (Prerequisites)" [level=2] [ref=f2e31]
      - table [ref=f2e33]:
        - rowgroup [ref=f2e34]:
          - row [ref=f2e35]:
            - columnheader "項目" [ref=f2e36]
            - columnheader "說明" [ref=f2e37]
        - rowgroup [ref=f2e38]:
          - row [ref=f2e39]:
            - cell "個人筆電" [ref=f2e40]
            - cell "Windows 11，具系統管理 (安裝軟體) 權限" [ref=f2e41]
          - row [ref=f2e42]:
            - cell "網路" [ref=f2e43]
            - cell "可連線下載安裝套件與存取 AI 服務" [ref=f2e44]
          - row [ref=f2e45]:
            - cell "ChatGPT 帳號" [ref=f2e46]
            - cell "可使用 Codex 的 ChatGPT 帳號；先登入 ChatGPT 桌面 app。實際可用功能依方案、工作區與推出狀況而異，CLI 與 VS Code 擴充套件可使用同一登入帳號。" [ref=f2e47]
          - row [ref=f2e48]:
            - cell "GitHub 帳號" [ref=f2e49]
            - cell "供 GitHub CLI 登入、clone 專案與部署 GitHub Pages 使用" [ref=f2e50]
          - row [ref=f2e51]:
            - cell "基本操作" [ref=f2e52]
            - cell "能開啟終端機 (terminal) 並輸入指令" [ref=f2e53]
      - heading "最低電腦需求 (Minimum Computer Requirements)" [level=2] [ref=f2e54]
      - paragraph [ref=f2e55]: 本工作坊會同時開啟 VS Code、Node.js、Python、終端機與瀏覽器登入頁面，建議筆電至少符合下列規格。標示「建議」者為較順暢的體驗門檻。
      - table [ref=f2e57]:
        - rowgroup [ref=f2e58]:
          - row [ref=f2e59]:
            - columnheader "項目" [ref=f2e60]
            - columnheader "最低需求" [ref=f2e61]
            - columnheader "建議" [ref=f2e62]
        - rowgroup [ref=f2e63]:
          - row [ref=f2e64]:
            - cell "作業系統" [ref=f2e65]
            - cell "Windows 11 (64 位元)，並已安裝 App Installer (winget)" [ref=f2e66]
            - cell "Windows 11 且更新至最新版" [ref=f2e67]
          - row [ref=f2e68]:
            - cell "處理器" [ref=f2e69]
            - cell "64 位元 x64 雙核心" [ref=f2e70]
            - cell "四核心以上" [ref=f2e71]
          - row [ref=f2e72]:
            - cell "記憶體 (RAM)" [ref=f2e73]
            - cell "8 GB" [ref=f2e74]
            - cell "16 GB" [ref=f2e75]
          - row [ref=f2e76]:
            - cell "可用磁碟空間" [ref=f2e77]
            - cell "10 GB" [ref=f2e78]
            - cell "20 GB 以上" [ref=f2e79]
          - row [ref=f2e80]:
            - cell "權限" [ref=f2e81]
            - cell "具系統管理員權限 (可安裝軟體、允許 UAC)" [ref=f2e82]
            - cell "同左" [ref=f2e83]
          - row [ref=f2e84]:
            - cell "網路" [ref=f2e85]
            - cell "穩定寬頻，可存取 GitHub 與 AI 服務" [ref=f2e86]
            - cell "同左" [ref=f2e87]
          - row [ref=f2e88]:
            - cell "瀏覽器" [ref=f2e89]
            - cell "Microsoft Edge 或 Chrome (供登入流程使用)" [ref=f2e90]
            - cell "同左" [ref=f2e91]
      - blockquote [ref=f2e92]:
        - paragraph [ref=f2e93]: 8 GB 記憶體可完成所有任務，但同時開啟 VS Code、瀏覽器與多個終端機時，16 GB 會明顯較順暢。磁碟空間需求包含工具鏈、專案的 node_modules 與 Python 套件。
      - heading "安裝的工具 (Toolchain)" [level=2] [ref=f2e94]
      - paragraph [ref=f2e95]: Windows 11 一鍵安裝腳本與課後指南會在筆電上安裝下列工具：
      - table [ref=f2e97]:
        - rowgroup [ref=f2e98]:
          - row [ref=f2e99]:
            - columnheader "工具" [ref=f2e100]
            - columnheader "用途" [ref=f2e101]
        - rowgroup [ref=f2e102]:
          - row [ref=f2e103]:
            - cell "VS Code" [ref=f2e104]
            - cell "程式碼編輯器，也是日後操作 AI Agent 的主要視窗" [ref=f2e105]
          - row [ref=f2e106]:
            - cell "Git" [ref=f2e107]
            - cell "版本管理工具，許多 AI 工具會用到" [ref=f2e108]
          - row [ref=f2e109]:
            - cell "Node.js + npm" [ref=f2e110]
            - cell "JavaScript 執行環境，用來啟動 local web server 與安裝 Codex CLI" [ref=f2e111]
          - row [ref=f2e112]:
            - cell "uv (Python)" [ref=f2e113]
            - cell "管理 Python 與套件，安裝／更新／移除都很簡單" [ref=f2e114]
          - row [ref=f2e115]:
            - cell "ChatGPT 桌面 app" [ref=f2e116]
            - cell "Windows 上的 Chat、ChatGPT Work 與 Codex 入口；可開啟專案、查看變更與使用整合終端機。" [ref=f2e117]
          - row [ref=f2e118]:
            - cell "Codex CLI（終端機工作流程）" [ref=f2e119]
            - cell "OpenAI 的 AI Agent 命令列工具；適合需要直接在終端機操作專案的課程練習。先以可使用 Codex 的 ChatGPT 帳號登入，實際功能依帳號與工作區而異。" [ref=f2e120]
          - row [ref=f2e121]:
            - cell "GitHub CLI (gh)" [ref=f2e122]
            - cell "用瀏覽器登入 GitHub，clone 專案、推送與部署 GitHub Pages" [ref=f2e123]
          - row [ref=f2e124]:
            - cell "VS Code 擴充套件" [ref=f2e125]
            - cell "Python、Jupyter、GitLens、ESLint，以及 Codex 編程代理 (openai.chatgpt)" [ref=f2e126]
      - heading "實作流程 (Hands-on Activities)" [level=2] [ref=f2e127]
      - heading [level=3] [ref=f2e128]:
        - text: 1. 使用
        - code [ref=f2e129]: setup-windows.bat
        - text: 一鍵安裝
      - paragraph [ref=f2e130]:
        - text: 優先使用本模組提供的
        - link "setup-windows.bat" [ref=f2e131] [cursor=pointer]:
          - /url: setup-windows.bat
        - text: 。這個批次檔會檢查
        - code [ref=f2e132]: winget
        - text: ，再依序安裝 VS Code、Git、Node.js LTS、uv、GitHub CLI、ChatGPT 桌面 app、Codex CLI 與常用 VS Code 擴充套件。腳本可重複執行；已安裝的項目會自動略過。
      - paragraph [ref=f2e133]: 建議操作：
      - list [ref=f2e134]:
        - listitem [ref=f2e135]:
          - text: 下載
          - link "setup-windows.bat" [ref=f2e136] [cursor=pointer]:
            - /url: setup-windows.bat
          - text: ，或將檔案放到容易找到的位置，例如
          - code [ref=f2e137]: Downloads
          - text: 。
        - listitem [ref=f2e138]: 以滑鼠雙擊執行，或在 PowerShell 執行：
      - code [ref=f2e140]: "& \"$HOME\\Downloads\\setup-windows.bat\""
      - list [ref=f2e141]:
        - listitem [ref=f2e142]: 若使用 Command Prompt，執行：
      - code [ref=f2e144]: "\"%USERPROFILE%\\Downloads\\setup-windows.bat\""
      - list [ref=f2e145]:
        - listitem [ref=f2e146]: 腳本結束後，關閉並重新開啟 PowerShell 或 Command Prompt，讓 PATH 設定生效。
        - listitem [ref=f2e147]: 重新執行下列檢查指令，確認主要工具都能被系統找到：
      - code [ref=f2e149]: code --version git --version node --version npm --version uv --version gh --version codex --version
      - paragraph [ref=f2e150]:
        - text: 若腳本顯示
        - code [ref=f2e151]: winget not found
        - text: ，請先安裝或更新 Windows 的 App Installer，完成後再重新執行批次檔。
      - heading "2. 手動下載與安裝必要工具" [level=3] [ref=f2e152]
      - paragraph [ref=f2e153]:
        - text: 若一鍵安裝失敗，或教師的筆電受學校 IT 權限限制，可改用手動安裝。建議仍優先使用
        - code [ref=f2e154]: winget
        - text: 指令；若
        - code [ref=f2e155]: winget
        - text: 不可用，再從官方下載頁面安裝。
      - table [ref=f2e157]:
        - rowgroup [ref=f2e158]:
          - row [ref=f2e159]:
            - columnheader "工具" [ref=f2e160]
            - columnheader "官方下載／說明" [ref=f2e161]
            - columnheader "建議指令或手動操作" [ref=f2e162]
        - rowgroup [ref=f2e163]:
          - row [ref=f2e164]:
            - cell "App Installer / winget" [ref=f2e165]
            - cell [ref=f2e166]:
              - link "https://learn.microsoft.com/windows/msix/app-installer/install-update-app-installer" [ref=f2e167] [cursor=pointer]:
                - /url: https://learn.microsoft.com/windows/msix/app-installer/install-update-app-installer
            - cell [ref=f2e168]:
              - text: Windows 11 通常已內建。若
              - code [ref=f2e169]: winget --version
              - text: 無法執行，請從 Microsoft Store 安裝或更新 App Installer。
          - row [ref=f2e170]:
            - cell "ChatGPT 桌面 app" [ref=f2e171]
            - cell [ref=f2e172]:
              - link "OpenAI：ChatGPT desktop app for Windows" [ref=f2e173] [cursor=pointer]:
                - /url: https://get.microsoft.com/installer/download/9PLM9XGG6VKS?cid=website_cta_psi
            - cell [ref=f2e174]:
              - code [ref=f2e175]: winget install --id 9PLM9XGG6VKS --source msstore
              - text: ，或從 Microsoft Store 安裝。安裝後開啟 app，使用 ChatGPT 帳號登入。
          - row [ref=f2e176]:
            - cell "VS Code" [ref=f2e177]
            - cell [ref=f2e178]:
              - link "https://code.visualstudio.com/download" [ref=f2e179] [cursor=pointer]:
                - /url: https://code.visualstudio.com/download
            - cell [ref=f2e180]:
              - code [ref=f2e181]: winget install --id Microsoft.VisualStudioCode --source winget --exact
          - row [ref=f2e182]:
            - cell "Git for Windows" [ref=f2e183]
            - cell [ref=f2e184]:
              - link "https://git-scm.com/downloads/win" [ref=f2e185] [cursor=pointer]:
                - /url: https://git-scm.com/downloads/win
            - cell [ref=f2e186]:
              - code [ref=f2e187]: winget install --id Git.Git --source winget --exact
          - row [ref=f2e188]:
            - cell "Node.js LTS + npm" [ref=f2e189]
            - cell [ref=f2e190]:
              - link "https://nodejs.org/en/download" [ref=f2e191] [cursor=pointer]:
                - /url: https://nodejs.org/en/download
            - cell [ref=f2e192]:
              - code [ref=f2e193]: winget install --id OpenJS.NodeJS.LTS --source winget --exact
          - row [ref=f2e194]:
            - cell "uv" [ref=f2e195]
            - cell [ref=f2e196]:
              - link "https://docs.astral.sh/uv/getting-started/installation/" [ref=f2e197] [cursor=pointer]:
                - /url: https://docs.astral.sh/uv/getting-started/installation/
            - cell [ref=f2e198]:
              - code [ref=f2e199]: winget install --id astral-sh.uv --source winget --exact
          - row [ref=f2e200]:
            - cell [ref=f2e201]:
              - text: GitHub CLI (
              - code [ref=f2e202]: gh
              - text: )
            - cell [ref=f2e203]:
              - link "https://cli.github.com/" [ref=f2e204] [cursor=pointer]:
                - /url: https://cli.github.com/
            - cell [ref=f2e205]:
              - code [ref=f2e206]: winget install --id GitHub.cli --source winget --exact
          - row [ref=f2e207]:
            - cell "Codex CLI" [ref=f2e208]
            - cell [ref=f2e209]:
              - link "https://developers.openai.com/codex/cli" [ref=f2e210] [cursor=pointer]:
                - /url: https://developers.openai.com/codex/cli
            - cell [ref=f2e211]:
              - text: 安裝 Node.js 後執行
              - code [ref=f2e212]: npm install -g "@openai/codex"
              - text: ，再執行
              - code [ref=f2e213]: codex
              - text: 登入。
      - paragraph [ref=f2e214]: VS Code 擴充套件可在 VS Code 左側 Extensions 視窗搜尋安裝，也可在終端機逐行執行：
      - code [ref=f2e216]: code --install-extension ms-python.python code --install-extension ms-toolsai.jupyter code --install-extension eamodio.gitlens code --install-extension dbaeumer.vscode-eslint code --install-extension openai.chatgpt
      - paragraph [ref=f2e217]: 手動安裝後，同樣需要關閉並重新開啟終端機，再執行版本檢查：
      - code [ref=f2e219]: code --version git --version node --version npm --version uv --version gh --version codex --version
      - heading "3. 設定 ChatGPT、Work 與 Codex" [level=3] [ref=f2e220]
      - list [ref=f2e221]:
        - listitem [ref=f2e222]: 開啟 ChatGPT 桌面 app 並登入。需要快速問答時選 Chat；要完成研究、文件或可審查的多步驟成果時，先選 ChatGPT，再切換到 Work；要處理課程 project、程式碼、指令與 diff 時，從產品選單選 Codex。
        - listitem [ref=f2e223]:
          - text: 在 Codex 先開啟這次課程唯一的 project 資料夾。傳送第一個任務前，選擇
          - strong [ref=f2e224]: 先要求核准
          - text: （Ask for approval）；不要預設開啟
          - strong [ref=f2e225]: 完整存取權
          - text: （Full access）。完成後檢查核准要求、diff 與輸出檔案。
        - listitem [ref=f2e226]:
          - text: 需要終端機工作流程時，再執行
          - code [ref=f2e227]: codex
          - text: 並以瀏覽器登入可使用 Codex 的 ChatGPT 帳號；同一帳號可同時用於 VS Code 的 Codex 擴充套件。
        - listitem [ref=f2e228]: 若後續任務需要操作瀏覽器，讓 AI Agent 依任務需求自行安裝與設定對應工具即可；本模組不把瀏覽器自動化外掛列為預先安裝項目。
        - listitem [ref=f2e229]:
          - text: 執行 guided「Hello, AI Agent」任務 (請 Agent 建立一個
          - code [ref=f2e230]: hello.txt
          - text: )，確認 AI Agent 能接收指令、產生檔案並回報結果。
      - heading "4. 連結 GitHub 與部署 GitHub Pages" [level=3] [ref=f2e231]
      - list [ref=f2e232]:
        - listitem [ref=f2e233]:
          - text: 執行
          - code [ref=f2e234]: gh auth login
          - text: ，全程以瀏覽器與一次性代碼登入，不需產生 SSH 金鑰或於終端機輸入密碼，並一次設定好 git 認證與提交身分 (user.name / user.email)。
        - listitem [ref=f2e235]:
          - text: 練習
          - code [ref=f2e236]: gh repo clone
          - text: 下載專案，以及用
          - code [ref=f2e237]: gh repo create … --push
          - text: 與 GitHub Pages 把靜態網站發佈成公開網址。
      - heading "5. 四項驗證任務 (Verification Tasks)" [level=3] [ref=f2e238]
      - table [ref=f2e240]:
        - rowgroup [ref=f2e241]:
          - row [ref=f2e242]:
            - columnheader "任務" [ref=f2e243]
            - columnheader "內容" [ref=f2e244]
            - columnheader "驗證重點" [ref=f2e245]
        - rowgroup [ref=f2e246]:
          - row [ref=f2e247]:
            - cell "Python 驗證" [ref=f2e248]
            - cell "以 uv 建立專案並安裝 openpyxl、python-docx，讀取 Excel、整理資料並輸出新的 Excel 檔案" [ref=f2e249]
            - cell "套件與檔案處理可運作" [ref=f2e250]
          - row [ref=f2e251]:
            - cell "Word 驗證" [ref=f2e252]
            - cell "讀取 Word 文件內容，並產生一份修改後的 Word 檔案" [ref=f2e253]
            - cell "Office 文件處理可運作" [ref=f2e254]
          - row [ref=f2e255]:
            - cell "JavaScript 驗證" [ref=f2e256]
            - cell [ref=f2e257]:
              - text: 以
              - code [ref=f2e258]: npx http-server
              - text: 啟動簡單的 local web server，確認 client-side 與 server-side 程式正常執行
            - cell "Node.js 與 local host 可運作" [ref=f2e259]
          - row [ref=f2e260]:
            - cell "Codex 驗證" [ref=f2e261]
            - cell "請 Codex 建立簡單文字檔、修改範例程式或整理指定資料" [ref=f2e262]
            - cell "AI Agent 可讀寫工作區檔案並回報結果" [ref=f2e263]
    - contentinfo [ref=f2e264]: 智慧雨林產業創生人才育成計畫 (南臺科技大學 電子系 楊榮林 教授)