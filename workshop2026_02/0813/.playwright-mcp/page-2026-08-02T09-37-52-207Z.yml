        - generic [ref=e224]: 複製
      - code [ref=e226]: 根據剛才產生的 pre-test 轉換後 Likert 結果表，幫我做前測問卷的信度與效度分析。 麻煩輸出成深色主題的 HTML，檔名用 pre-test-validity-reliability.html，預設顯示台灣中文，但也要能切換成 English UI。報告一開始先給我分析結果概覽，內容至少要有資料檢查和 Cronbach alpha。 也請你參考 https://selfdeterminationtheory.org/SDT/documents/2000_GuayVallerandBlanchard_MO.pdf 這篇論文，幫我整理 IM、IR、ER、AM 這幾個構面各自代表什麼意思，並說明這次收集到的問卷資料可以怎麼解讀。 最後記得提醒一下，這次樣本數很小，結果只能當作課堂或工作坊層級的初步篩檢訊號，不是正式的量表驗證。
