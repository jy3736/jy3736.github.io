    - heading "步驟七：打造教師端成績彙整頁" [level=2] [ref=e415]
    - paragraph [ref=e416]: 交付物：老師用的彙整工具
    - paragraph [ref=e417]: 學生在測驗頁面送出作答後會下載一份 CSV。這一步要設計一個給老師用的頁面，把全班這些 CSV 檔合併起來看 一樣要能雙擊開啟、不需要架站，也不能把任何資料上傳到網路上。
    - generic [ref=e418]:
      - button "📋 複製" [ref=e420] [cursor=pointer]:
        - generic [ref=e421]: 📋
        - generic [ref=e422]: 複製
      - code [ref=e424]: 幫我設計並寫出 module3/app/report-aggregator.html，是老師用來彙整全班成績的頁面： 1. 可以把多個 CSV 檔拖曳（或點擊選取）到頁面上。 2. 依考試名稱自動分組，列出「每位學生答對／總題數／正確率」， 跟「每一題的出現次數／答對次數／答對率」兩張表。 3. 提供「匯出合併 CSV」跟「列印／存成 PDF」兩個功能。 全部在瀏覽器裡處理，不能把任何檔案內容送到網路上；一樣要能直接雙擊 file:// 路徑開啟就正常運作，不需要伺服器。
    - paragraph [ref=e425]: 「每一題的答對率」這張表特別適合用來看哪幾題全班普遍答錯，回頭檢討教學重點。這個頁面設計上是通用的，複製一份就能重複用在任何一份測驗、任何一個班級，不需要為了不同考試另外設定。
