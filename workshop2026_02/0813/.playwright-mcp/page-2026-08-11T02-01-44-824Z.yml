      - code [ref=e344]: 幫我設計並寫出 module3/app/quiz.html，這是學生作答用的自我測驗網頁樣板。 先假設測驗資料會被放進一個叫 window.QUIZ_DATA 的全域變數（之後由另一支打包程式塞進去）， 這個頁面要做到： 1. 讓學生輸入姓名，選擇這次要抽幾題（1 到全部題數之間，預設用設定裡的題數上限）。 2. 隨機抽題、依序顯示每題的圖片跟 (A)(B)(C)(D)... 選項（選項字母跟隨設定）。 3. 全部作答完送出後，顯示總分跟每一題的對錯。 4. 提供一顆按鈕，把這次作答的逐題結果下載成 CSV（檔名要帶學生姓名跟時間戳記， 方便老師之後合併多份成績單）。 整個網頁本身完成後不能用 fetch() 讀任何外部檔案 ，最終要能直接雙擊 file:// 路徑開啟就正常運作。先開發階段可以讓它改用 fetch() 讀一份假的 config.json + 假圖片測試畫面，之後再決定要不要保留這個「原始碼／可編輯」版本。
