<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">三種成果，三種驗收</title><desc id="desc">Chat 交出回答與想法，用自己的話說出來；Work 交出可保存的文件，逐列對回來源；Codex 交出可操作的網頁，照驗收例子操作</desc><defs><marker id="ta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="ga" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="32" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">三種成果，三種驗收</text><rect x="20" y="62" width="360" height="92" rx="14" fill="#D5E5DF"/><rect x="34" y="86" width="92" height="44" rx="22" fill="#FFFFFF"/><text x="80" y="116" text-anchor="middle" font-size="22" font-weight="800" fill="#167C80">Chat</text><text x="144" y="102" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">回答與想法</text><text x="144" y="134" text-anchor="start" font-size="20" font-weight="500" fill="#506764">檢查：用自己的話說出來</text><rect x="20" y="170" width="360" height="92" rx="14" fill="#D5E5DF"/><rect x="34" y="194" width="92" height="44" rx="22" fill="#FFFFFF"/><text x="80" y="224" text-anchor="middle" font-size="22" font-weight="800" fill="#167C80">Work</text><text x="144" y="210" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">可保存的文件</text><text x="144" y="242" text-anchor="start" font-size="20" font-weight="500" fill="#506764">檢查：逐列對回來源</text><rect x="20" y="278" width="360" height="92" rx="14" fill="#F1E2D3"/><rect x="34" y="302" width="92" height="44" rx="22" fill="#FFFFFF"/><text x="80" y="332" text-anchor="middle" font-size="22" font-weight="800" fill="#A85F29">Codex</text><text x="144" y="318" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">可操作的網頁</text><text x="144" y="350" text-anchor="start" font-size="20" font-weight="500" fill="#506764">檢查：照驗收例子操作</text><text x="200" y="428" text-anchor="middle" font-size="21" font-weight="600" fill="#506764">成果不同，檢查方式也不同</text></g></svg>
