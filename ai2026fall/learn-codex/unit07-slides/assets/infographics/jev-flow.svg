<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">Jev：先給選項，再回傳機率</title><desc id="desc">軟體提出情況與選項：耳機還沒收到，屬於哪一類？Jev 回傳出貨 86%、付款 9%、退貨 5%；信心夠高就自動處理，信心不夠就轉給人判斷</desc><defs><marker id="ta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="ga" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="32" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">Jev：先給選項，再回傳機率</text><rect x="20" y="52" width="360" height="84" rx="14" fill="#D5E5DF"/><text x="200" y="86" text-anchor="middle" font-size="22" font-weight="800" fill="#163D40">軟體提出情況與選項</text><text x="200" y="119" text-anchor="middle" font-size="20" font-weight="500" fill="#506764">耳機還沒收到，屬於哪一類？</text><path d="M200 142 V164" stroke="#167C80" stroke-width="3" fill="none" marker-end="url(#ta)"/><text x="34" y="196" text-anchor="start" font-size="22" font-weight="800" fill="#163D40">出貨</text><rect x="90" y="177" width="198" height="24" rx="5" fill="#167C80"/><text x="298" y="196" text-anchor="start" font-size="21" font-weight="700" fill="#167C80">86%</text><text x="34" y="236" text-anchor="start" font-size="22" font-weight="800" fill="#163D40">付款</text><rect x="90" y="217" width="21" height="24" rx="5" fill="#B5CAC3"/><text x="121" y="236" text-anchor="start" font-size="21" font-weight="700" fill="#506764">9%</text><text x="34" y="276" text-anchor="start" font-size="22" font-weight="800" fill="#163D40">退貨</text><rect x="90" y="257" width="12" height="24" rx="5" fill="#B5CAC3"/><text x="112" y="276" text-anchor="start" font-size="21" font-weight="700" fill="#506764">5%</text><path d="M200 288 L112 314 M200 288 L288 314" stroke="#167C80" stroke-width="3" fill="none" marker-end="url(#ta)"/><rect x="20" y="320" width="172" height="74" rx="14" fill="#D5E5DF"/><text x="106" y="351" text-anchor="middle" font-size="22" font-weight="800" fill="#163D40">信心夠高</text><text x="106" y="381" text-anchor="middle" font-size="20" font-weight="500" fill="#506764">自動處理</text><rect x="208" y="320" width="172" height="74" rx="14" fill="#F1E2D3"/><text x="294" y="351" text-anchor="middle" font-size="22" font-weight="800" fill="#A85F29">信心不夠</text><text x="294" y="381" text-anchor="middle" font-size="20" font-weight="500" fill="#506764">轉給人判斷</text><text x="200" y="428" text-anchor="middle" font-size="20" font-weight="600" fill="#506764">附上機率，系統才知道何時交給人</text></g></svg>
