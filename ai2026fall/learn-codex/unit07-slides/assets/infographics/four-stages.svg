<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">每個練習的四個階段</title><desc id="desc">題目敘述，看懂誰用、輸入什麼；建議提示詞，目標、脈絡、產出、界線；預期成果，先寫下 0／3、2／3、3／3；完成檢核，親自操作、核對數字；有落差就說清楚、修改、再測一次</desc><defs><marker id="ta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="ga" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="32" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">每個練習的四個階段</text><circle cx="52" cy="88" r="25" fill="#D5E5DF"/><text x="52" y="96" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">1</text><text x="96" y="85" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">題目敘述</text><text x="96" y="114" text-anchor="start" font-size="20" font-weight="500" fill="#506764">誰要用、輸入什麼</text><path d="M52 117 V139" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ta)"/><circle cx="52" cy="170" r="25" fill="#D5E5DF"/><text x="52" y="178" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">2</text><text x="96" y="167" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">建議提示詞</text><text x="96" y="196" text-anchor="start" font-size="20" font-weight="500" fill="#506764">目標、脈絡、產出、界線</text><path d="M52 199 V221" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ta)"/><circle cx="52" cy="252" r="25" fill="#D5E5DF"/><text x="52" y="260" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">3</text><text x="96" y="249" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">預期成果</text><text x="96" y="278" text-anchor="start" font-size="20" font-weight="500" fill="#506764">先寫下 0／3、2／3、3／3</text><path d="M52 281 V303" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ta)"/><circle cx="52" cy="334" r="25" fill="#F1E2D3"/><text x="52" y="342" text-anchor="middle" font-size="23" font-weight="800" fill="#A85F29">4</text><text x="96" y="331" text-anchor="start" font-size="24" font-weight="800" fill="#A85F29">完成檢核</text><text x="96" y="360" text-anchor="start" font-size="20" font-weight="500" fill="#506764">親自操作、核對數字</text><path d="M340 334 H372 V170 H350" stroke="#A85F29" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ga)"/><path d="M140 396 H260" stroke="#B5CAC3" stroke-width="2"/><text x="200" y="428" text-anchor="middle" font-size="21" font-weight="600" fill="#A85F29">有落差：說清楚、修改、再測</text></g></svg>
