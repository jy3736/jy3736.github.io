<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">下一步由誰決定？</title><desc id="desc">和 AI 聊天：你提問、AI 回答、你再追問，每一步由你推進；交辦給 Agent：你說明成果與界線，Agent 連續做好幾步，你檢查成果</desc><defs><marker id="ta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="ga" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="32" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">下一步由誰決定？</text><rect x="20" y="54" width="172" height="50" rx="12" fill="#D5E5DF"/><text x="106" y="87" text-anchor="middle" font-size="22" font-weight="800" fill="#163D40">和 AI 聊天</text><rect x="28" y="132" width="156" height="54" rx="10" fill="none" stroke="#167C80" stroke-width="2"/><text x="106" y="167" text-anchor="middle" font-size="21" font-weight="700" fill="#163D40">你提問</text><path d="M106 190 V212" stroke="#167C80" stroke-width="3" fill="none" marker-end="url(#ta)"/><rect x="28" y="216" width="156" height="54" rx="10" fill="none" stroke="#167C80" stroke-width="2"/><text x="106" y="251" text-anchor="middle" font-size="21" font-weight="700" fill="#163D40">AI 回答</text><path d="M106 274 V296" stroke="#167C80" stroke-width="3" fill="none" marker-end="url(#ta)"/><rect x="28" y="300" width="156" height="54" rx="10" fill="none" stroke="#167C80" stroke-width="2"/><text x="106" y="335" text-anchor="middle" font-size="21" font-weight="700" fill="#163D40">你再追問</text><rect x="208" y="54" width="172" height="50" rx="12" fill="#F1E2D3"/><text x="294" y="87" text-anchor="middle" font-size="22" font-weight="800" fill="#A85F29">交辦給 Agent</text><rect x="216" y="132" width="156" height="54" rx="10" fill="none" stroke="#A85F29" stroke-width="2"/><text x="294" y="167" text-anchor="middle" font-size="21" font-weight="700" fill="#163D40">你說明成果</text><path d="M294 190 V212" stroke="#A85F29" stroke-width="3" fill="none" marker-end="url(#ga)"/><rect x="216" y="216" width="156" height="54" rx="10" fill="none" stroke="#A85F29" stroke-width="2"/><text x="294" y="251" text-anchor="middle" font-size="21" font-weight="700" fill="#163D40">Agent 做好幾步</text><path d="M294 274 V296" stroke="#A85F29" stroke-width="3" fill="none" marker-end="url(#ga)"/><rect x="216" y="300" width="156" height="54" rx="10" fill="none" stroke="#A85F29" stroke-width="2"/><text x="294" y="335" text-anchor="middle" font-size="21" font-weight="700" fill="#163D40">你檢查成果</text><path d="M20 296 Q0 230 20 159" stroke="#167C80" stroke-width="2.5" fill="none" stroke-dasharray="5 5" marker-end="url(#ta)"/><path d="M140 396 H260" stroke="#B5CAC3" stroke-width="2"/><text x="200" y="428" text-anchor="middle" font-size="21" font-weight="600" fill="#506764">Agent＝模型＋工具＋人工把關</text></g></svg>
