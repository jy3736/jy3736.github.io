<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="title desc"><title id="title">機器學習：從例子學規則</title><desc id="desc">收集資料，過去的例子；標上答案，每個例子的結果；訓練模型，比對猜的和答案；預測新資料，沒看過也能判斷；檢驗成效，算準確率或誤差；資料越多，模型越準</desc><defs><marker id="ta" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#167C80"/></marker><marker id="ga" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#A85F29"/></marker></defs><g font-family="PingFang TC, Microsoft JhengHei, Noto Sans TC, sans-serif"><text x="200" y="32" text-anchor="middle" font-size="25" font-weight="800" fill="#163D40">機器學習：從例子學規則</text><circle cx="52" cy="80" r="25" fill="#D5E5DF"/><text x="52" y="88" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">1</text><text x="96" y="77" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">收集資料</text><text x="96" y="106" text-anchor="start" font-size="20" font-weight="500" fill="#506764">過去的郵件、訂單、照片</text><path d="M52 109 V116" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ta)"/><circle cx="52" cy="147" r="25" fill="#D5E5DF"/><text x="52" y="155" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">2</text><text x="96" y="144" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">標上答案</text><text x="96" y="173" text-anchor="start" font-size="20" font-weight="500" fill="#506764">每個例子的正確結果</text><path d="M52 176 V183" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ta)"/><circle cx="52" cy="214" r="25" fill="#D5E5DF"/><text x="52" y="222" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">3</text><text x="96" y="211" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">訓練模型</text><text x="96" y="240" text-anchor="start" font-size="20" font-weight="500" fill="#506764">比對猜的和答案，逐步修正</text><path d="M52 243 V250" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ta)"/><circle cx="52" cy="281" r="25" fill="#D5E5DF"/><text x="52" y="289" text-anchor="middle" font-size="23" font-weight="800" fill="#167C80">4</text><text x="96" y="278" text-anchor="start" font-size="24" font-weight="800" fill="#163D40">預測新資料</text><text x="96" y="307" text-anchor="start" font-size="20" font-weight="500" fill="#506764">沒看過的例子也能判斷</text><path d="M52 310 V317" stroke="#167C80" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ta)"/><circle cx="52" cy="348" r="25" fill="#F1E2D3"/><text x="52" y="356" text-anchor="middle" font-size="23" font-weight="800" fill="#A85F29">5</text><text x="96" y="345" text-anchor="start" font-size="24" font-weight="800" fill="#A85F29">檢驗成效</text><text x="96" y="374" text-anchor="start" font-size="20" font-weight="500" fill="#506764">用新資料算準確率或誤差</text><path d="M140 396 H260" stroke="#B5CAC3" stroke-width="2"/><text x="200" y="428" text-anchor="middle" font-size="21" font-weight="600" fill="#506764">資料越多，模型越準</text></g></svg>
